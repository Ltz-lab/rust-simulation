[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "azsim"
version = "0.1.0"
description = "Fast data-driven WoW combat simulator (Python bindings)"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "azsim"
include = [{ path = "python/tests/**", format = "sdist" }]
