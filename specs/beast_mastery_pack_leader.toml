# Beast Mastery Hunter — Pack Leader, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Hunter_Beast_Mastery.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (SpellEffect etc.) via tools/spelldb.py
#   [obs]  observed behaviour in the reference fight (SimC's report as a
#          stand-in for a combat log)
#   [simc] read from SimC's source (sc_hunter.cpp) or its default APL
# Damage coefficients are straight from SpellEffect. Residual damage
# multipliers (talents, auras, pet damage multipliers) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# The rotation is a focus economy. Kill Command (2 charges, 30 focus) sends
# every pet in for a hit; Barbed Shot (2 charges) puts a rolling bleed on the
# target and pays focus per tick; Cobra Shot (35 focus) dumps focus and takes
# a second off Kill Command. Bestial Wrath every 30s buffs both hunter and
# pets, applies Bloodshed from every pet and triggers the Pack Leader cycle:
# every ~19s the next Kill Command empowers Wyvern, Boar or Bear in turn.
# Kill Command also has a chance to summon a Dire Beast, and every eighth
# Dire Beast or Bear summons Fenryr or Hati.

name = "Beast Mastery Hunter (Pack Leader, core kit)"

# [simc] APL precombat: summon the main pet and animal companion; start the
# howl cooldown that runs for the whole fight.
precombat = ["summon_pets", "start_howl"]

[player]
# [obs] buffed snapshot (core kit). attack_power is the total the formulas
# use: 2662 from agility/AP buffs + 982 weapon attack power (weapon DPS 163.7
# x 6 [db2]); pet power is 60% of it [simc stable_pet_t owner_coeff 0.6].
attack_power = 3644
crit = 0.295            # [obs] buffed attack crit
haste = 0.295           # [obs] fight-average attack haste incl. gear procs (auto 130/300s)
mastery = 0.7447174     # [obs] buffed mastery %; Master of Beasts scales pets
versatility = 0.0498148 # [obs] buffed damage versatility
spell_power = 523        # [obs] buffed; only the item procs below use it
crit_multiplier = 2.0   # [simc] base; per-source crit bonuses from [obs]
# [db2] Caustic Repose Greatbow: 3.0s swing, 397-537 damage x1.05 AP buff
weapon = { min = 417, max = 564, speed = 3.0 }

[auto_attack]
replace_with = "auto_shot"
wakes = false   # [simc] Auto Shot does not wake the APL

[fight]
duration = 300  # [obs] reference setup
variance = 0.2  # [simc] reference settings

[resources.focus]
max = 100       # [db2]
start = 100     # [obs] full out of combat
regen = 8.75    # [simc] base_focus_regen_per_second
regen_hasted = true  # [simc] regen caches haste

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "bestial_wrath"       # [db2 19574: 15s, +20% damage] (pet aura 186254)
duration = 15
damage_pct = 20
pets = true

[[buffs]]
name = "howl_cooldown"       # [db2 471877: 30s]; expiring grants the next beast
duration = 30
on_expire = [{ type = "trigger", ability = "howl_grant" }]

[[buffs]]
name = "wyvern_ready"        # [db2 471878: 30s] next Kill Command summons Wyvern
duration = 30
ability_pct = { duck_kill_command = 50, animal_companion_kill_command = 50, natures_ally_pet_kill_command = 50, dire_beast_kill_command = 50, bear_kill_command = 50, fenryr_kill_command = 50, hati_kill_command = 50 }  # [db2 472358] Pack Mentality

[[buffs]]
name = "boar_ready"          # [db2 472324: 30s]
duration = 30
ability_pct = { duck_kill_command = 50, animal_companion_kill_command = 50, natures_ally_pet_kill_command = 50, dire_beast_kill_command = 50, bear_kill_command = 50, fenryr_kill_command = 50, hati_kill_command = 50 }

[[buffs]]
