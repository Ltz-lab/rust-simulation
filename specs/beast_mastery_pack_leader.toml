duration = 12
max_stacks = 20
damage_pct = 1
pets = true
refresh_duration = false     # pet melee adds stacks without refreshing [simc]

[[buffs]]
name = "natures_ally"        # [db2 1276720: 8s, +30% Kill Command]
duration = 8
ability_pct = { duck_kill_command = 30, animal_companion_kill_command = 30, natures_ally_pet_kill_command = 30, dire_beast_kill_command = 30, bear_kill_command = 30, fenryr_kill_command = 30, hati_kill_command = 30 }

[[buffs]]
