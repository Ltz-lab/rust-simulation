# ---------------------------------------------------------------- rotation
# Paraphrase of the SimC default single-target APL.

# At two charges Barbed Shot stops recharging: spend one rather than cap.
[[rotation]]
action = "barbed_shot"
if = "cooldown.barbed_shot.charges>=2"

# Dump Barbed Shot charges right before Bestial Wrath resets them (Scent of Blood).
[[rotation]]
action = "barbed_shot"
if = "cooldown.bestial_wrath.remains<1.2"

[[rotation]]
action = "bestial_wrath"

[[rotation]]
action = "kill_command"
if = "pet.natures_ally_pet.active>0"

[[rotation]]
action = "kill_command"

[[rotation]]
action = "barbed_shot"

[[rotation]]
action = "cobra_shot"
if = "focus>=35"

