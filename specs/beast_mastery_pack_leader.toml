duration = 30
ability_pct = { duck_kill_command = 50, animal_companion_kill_command = 50, natures_ally_pet_kill_command = 50, dire_beast_kill_command = 50, bear_kill_command = 50, fenryr_kill_command = 50, hati_kill_command = 50 }

[[buffs]]
