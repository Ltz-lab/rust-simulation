# ---------------------------------------------------------------- abilities

[[abilities]]
name = "summon_pets"
gcd = 0
triggered_only = true
on_cast = [
  { type = "summon", pet = "duck" },
  { type = "summon", pet = "animal_companion" },
  { type = "buff", buff = "sharpened_fangs" },
]

[[abilities]]
name = "start_howl"
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "howl_cooldown" }]

# A Kill Command that consumes a beast restarts the howl cooldown only when it
# is not already running [simc consume_howl_of_the_pack_leader].
[[abilities]]
name = "restart_howl"
gcd = 0
triggered_only = true
on_cast = [{ type = "if", if = "buff.howl_cooldown.up", then = [], else = [{ type = "buff", buff = "howl_cooldown" }] }]

[[abilities]]
name = "howl_grant"
gcd = 0
triggered_only = true
on_cast = [{ type = "if", if = "buff.howl_cycle.stack = 0", then = [ { type = "buff", buff = "wyvern_ready" }, { type = "buff", buff = "howl_cycle", set = "1" }, ], else = [{ type = "if", if = "buff.howl_cycle.stack = 1", then = [ { type = "buff", buff = "boar_ready" }, { type = "buff", buff = "howl_cycle", set = "2" }, ], else = [ { type = "buff", buff = "bear_ready" }, { type = "buff", buff = "howl_cycle", set = "0" }, ] }] }]

# Auto Shot: 7.2x weapon damage + 3/6 of attack power x 7.2 [simc].
[[abilities]]
name = "auto_shot"
gcd = 0
damage = { weapon_mult = 7.2, ap_coeff = 2.631, school = "physical", crit_bonus = 0.035 }

[[auto_attack.on_hit]]
# [db2 468695] Snakeskin Quiver: 15% chance for a free Cobra Shot
type = "trigger"
ability = "cobra_shot_snakeskin_quiver"
chance = 0.15

[[abilities]]
name = "cobra_shot_snakeskin_quiver"
gcd = 0
triggered_only = true
damage = { ap_coeff = 3.904, school = "physical", crit_bonus = 0.337 }  # [db2 193455]

[[abilities]]
name = "kill_command"
gcd = 1.5
cooldown = 7.5          # [db2 34026] against Alpha Predator's extra charge
cooldown_hasted = true  # [simc] dynamic cooldown
charges = 2             # [db2 269737] Alpha Predator: +1 charge
cost = { focus = 30 }   # [db2]
on_cast = [
  { type = "for_each_pet", pet = "duck", each = [{ type = "trigger", ability = "duck_kill_command" }] },
  { type = "for_each_pet", pet = "animal_companion", each = [{ type = "trigger", ability = "animal_companion_kill_command" }] },
  { type = "for_each_pet", pet = "natures_ally_pet", each = [{ type = "trigger", ability = "natures_ally_pet_kill_command" }] },
  { type = "for_each_pet", pet = "dire_beast", each = [{ type = "trigger", ability = "dire_beast_kill_command" }] },
  { type = "for_each_pet", pet = "bear", each = [{ type = "trigger", ability = "bear_kill_command" }] },
  { type = "for_each_pet", pet = "fenryr", each = [{ type = "trigger", ability = "fenryr_kill_command" }] },
  { type = "for_each_pet", pet = "hati", each = [{ type = "trigger", ability = "hati_kill_command" }] },
  # Dire Command [db2 378743: 20% chance to summon a Dire Beast]
  { type = "trigger", ability = "dire_command", chance = 0.2 },
  # Dire Summons [db2 472352]: -1s howl cooldown
  { type = "extend_buff", buff = "howl_cooldown", seconds = -1 },
  # Consume whatever beast is ready. Each consumed beast reduces Barbed Shot's
  # cooldown by 4s (Pack Mentality) and restarts the howl cooldown.
  { type = "if", if = "buff.wyvern_ready.up", then = [ { type = "consume", buff = "wyvern_ready" }, { type = "buff", buff = "wyverns_cry", stacks = 10 }, { type = "reduce_cooldown", ability = "barbed_shot", seconds = 4 }, { type = "if", if = "buff.stampede_incoming.up", then = [ { type = "consume", buff = "stampede_incoming" }, { type = "trigger", ability = "stampede_tick" } ] }, { type = "trigger", ability = "restart_howl" } ] },
  { type = "if", if = "buff.boar_ready.up", then = [ { type = "consume", buff = "boar_ready" }, { type = "trigger", ability = "boar_charge" }, { type = "buff", buff = "hogstrider" }, { type = "reduce_cooldown", ability = "barbed_shot", seconds = 4 }, { type = "if", if = "buff.stampede_incoming.up", then = [ { type = "consume", buff = "stampede_incoming" }, { type = "trigger", ability = "stampede_tick" } ] }, { type = "trigger", ability = "restart_howl" } ] },
  { type = "if", if = "buff.bear_ready.up", then = [ { type = "consume", buff = "bear_ready" }, { type = "trigger", ability = "bear_spawn" }, { type = "reduce_cooldown", ability = "barbed_shot", seconds = 4 }, { type = "if", if = "buff.stampede_incoming.up", then = [ { type = "consume", buff = "stampede_incoming" }, { type = "trigger", ability = "stampede_tick" } ] }, { type = "trigger", ability = "restart_howl" } ] },
]

