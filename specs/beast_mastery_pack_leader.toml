  { type = "for_each_pet", pet = "duck", each = [ { type = "trigger", ability = "duck_bestial_wrath" }, { type = "trigger", ability = "duck_bloodshed" }, { type = "trigger", ability = "duck_thundering_hooves" }, ] },
