# Balance Druid — Elune's Chosen, Midnight Season 2, single target.
# Profile: Nokomanida, US Zul'jin (profiles/MID2_Druid_Balance.simc).
# [db2] SpellEffect etc, build 12.1.5.70575; [simc] sc_druid.cpp/default APL;
# [obs] generated core reference and its combat log. Calibration fits per hit only.
name = "Balance Druid (Elune's Chosen, core kit)"
precombat = ["wrath_precast", "wrath_precast", "starfire_precast", "shooting_stars_clock"]

[player]
# [obs] snapshot converted from caster to Moonkin Lycara's Teachings:
# remove 6% haste, add 6 mastery points x0.75; plus mean temporary ratings.
spell_power = 3223
crit = 0.1940
haste = 0.2408
mastery = 0.3370
versatility = 0.1469
crit_multiplier = 2.0 # [simc] Night Elf, no dwarf racial

[gear]
primary = "intellect"
base_primary = 619 # [obs] level 90 base intellect, approximate
primary_mult = 1.0815 # [simc] leather specialization and Arcane Intellect
spell_power_per_primary = 1.0 # [obs]
crit_bonus = 0.05 # [obs]
haste_mult = 1.01 # [obs] Moonkin form
mastery_points = 16 # [obs] Moonkin Lycara and Skyfury
mastery_coeff = 0.75 # [db2] Astral Invocation per mastery point
versatility_bonus = 0.06 # [simc] Mark of the Wild and passive versatility
effect_mult = { physical = 1.0815, magic = 1.0609 } # [simc] raid debuffs
spec_id = 102 # [db2] Balance

[gear.procs]
crit = 0.0049 # [obs]
haste = 0.0492 # [obs]
mastery = 0.0093 # [obs]
versatility = 0.0339 # [obs]

[gear.kit]
enabled = 1 # [simc] standard raid consumables
stats = { primary = 75.1, mastery_rating = 165, crit_rating = 16, haste_rating = 16 } # [db2] food, rune, flask, oil
precombat = ["full_kit"] # [simc] Bloodlust at pull
primary_buffs = { lights_potential = 695 } # [db2 1236616] potion

[fight]
duration = 300 # [simc] reference default
variance = 0.2 # [simc]

[resources.astral_power]
max = 100 # [simc]
start = 50 # [db2 202430] Nature's Balance; precombat AP resets at pull
regen = 0.5 # [db2 202430] 1 AP every 2 seconds, unhasted

