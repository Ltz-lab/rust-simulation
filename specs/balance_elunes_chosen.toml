[[rotation]]
action = "potion" # [simc] use near Incarnation
if = "buff.incarnation.up|fight_remains<30"
[[rotation]]
action = "fury_of_elune"
[[rotation]]
action = "incarnation"
if = "(!buff.incarnation.up&!buff.eclipse_lunar.up&cooldown.fury_of_elune.remains>50)|!buff.opened.up|fight_remains<20"
[[rotation]]
action = "sunfire"
if = "(dot.sunfire.remains<2|dot.sunfire.remains<5.4&!buff.eclipse_lunar.up)&fight_remains>10"
[[rotation]]
action = "moonfire"
if = "(dot.moonfire.remains<2|dot.moonfire.remains<6.6&!buff.eclipse_lunar.up)&fight_remains>10"
[[rotation]]
action = "eclipse"
if = "!buff.eclipse_lunar.up&(cooldown.eclipse.charges>=2|cooldown.fury_of_elune.remains>17|!cooldown.incarnation.ready|fight_remains<15)"
[[rotation]]
action = "starsurge"
if = "buff.eclipse_lunar.up|astral_power>80|buff.touch_the_cosmos.up"
[[rotation]]
action = "starfire_umbral"
if = "buff.umbral_embrace.up&buff.eclipse_lunar.up"
[[rotation]]
action = "starfire"
