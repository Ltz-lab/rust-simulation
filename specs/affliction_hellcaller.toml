# Affliction Warlock — Hellcaller, Midnight Season 2, core kit.
# Every numerical mechanic is [db2] game data, [simc] class module/APL,
# or [obs] committed SimC observations; calibration fits damage per hit only.
# Midnight uses UA as its shard spender, Wither instead of Corruption,
# Dark Harvest instead of Soul Rot, and Malefic Grasp during Darkglare.
name = "Affliction Warlock (Hellcaller, core kit)"
precombat = ["summon_sayaad", "haunt"] # [simc] APL precast

[player]
spell_power = 3390       # [obs] 3352 snapshot +38 averaged gear procs
crit = 0.3419            # [obs] 0.303478 +0.0384 averaged gear procs
haste = 0.3534           # [obs] 0.329547 +0.0239 averaged gear procs
mastery = 0.6642         # [obs] 0.553804 +0.1104 averaged gear procs
versatility = 0.0632     # [obs] 0.059259 +0.0039 averaged gear procs
crit_multiplier = 2.092  # [obs] non-DoT crit/noncrit (no dwarf racial)

[gear]
spec_id = 265           # [db2] Affliction
primary = "intellect"
base_primary = 617      # [obs] troll level 90
primary_mult = 1.113945  # [simc] 1.05 *1.03 *1.03
spell_power_per_primary = 1.0 # [obs]
crit_bonus = 0.07        # [obs] 1074/46 +7%
haste_mult = 1.02        # [db2] Pact of the Satyr
mastery_points = 12     # [db2] base 8 +2 pact +2 Skyfury
mastery_coeff = 2.5      # [obs] Potent Afflictions rating conversion
versatility_bonus = 0.03 # [simc] Mark of the Wild
effect_mult = { physical = 1.0815, magic = 1.0609 } # [simc] raid debuffs
use_after = "summon_darkglare"
use_items = { buff = "pet.darkglare.active|buff.malevolence.up|fight_remains<20" } # [simc] APL

# Omnium traits (omnium_talents= in the profile; docs/gear.md#omnium-traits). The
# calibration reference has these on, so their worth is inside the fitted
# multipliers; a character with fewer gets it taken back out, trait by trait.
# tools/omnium.py ablate at 20,000 iterations: core kit 156,314 with all, 150,891 with
# none, +3.59%. Each value is the leave-one-out ratio, rescaled so the product
# is exactly all / none.
[gear.omnium]
baseline = ["136822", "136819", "136817", "136815", "136814"]
traits = [
  { id = "136822", name = "Rune of Unleashed Fire", global_mult = 1.01918 },   # [simc] leave-one-out 1.03583
  { id = "136819", name = "Rune of Self-Mending", global_mult = 0.99983 },   # [simc] leave-one-out 0.99968
  { id = "136817", name = "Rune of Lingering", global_mult = 1.00109 },   # [simc] leave-one-out 1.00203
  { id = "136815", name = "Rune of Critical Power", global_mult = 1.01335 },   # [simc] leave-one-out 1.02488
  { id = "136814", name = "Rune of Overload", global_mult = 1.00213 },   # [simc] leave-one-out 1.00394
]

[gear.kit]
enabled = 1 # [simc] consumables and Bloodlust when gear is supplied
precombat = ["full_kit"] # [simc]
stats = { primary = 75.1, crit_rating = 181, haste_rating = 16 }   # [simc] SimC default consumables, measured on the sample profile: Flask of the Shattered Sun (crit 165) + oil 16/16

[gear.procs] # [obs] time-averaged sample-gear enchants/weapon/embellishments
spell_power = 38
crit = 0.0384
haste = 0.0239
mastery = 0.1104
versatility = 0.0039

[fight]
duration = 300 # [obs] Patchwerk reference
variance = 0.2 # [simc] reference settings

[resources.soul_shard]
max = 5 # [db2]
start = 3 # [simc] out of combat

