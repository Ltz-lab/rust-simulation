# Frost Death Knight — Deathbringer, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Death_Knight_Frost.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_death_knight.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# Runes: 6, each regenerating in 10s/haste; at most 3 regenerate at once
# [simc MAX_REGENERATING_RUNES], so the pool refills at ~0.3 runes/s x haste.
# Obliterate, Howling Blast and Reaper's Mark spend runes; Runic Empowerment
# (1.8% per RP spent), Murderous Efficiency (20% per Killing Machine stack),
# Obliteration (20% while Pillar is up) and Breath of Sindragosa (2 on expiry)
# give them back. Runic power (max 100) comes from Obliterate (20, halved while
# an Exterminate is armed), Reaper's Mark (20), Empower Rune Weapon (40),
# Runic Attenuation (3, RPPM 10.8), Rage of the Frozen Champion (8 per Rime
# Howling Blast) and Frost Fever ticks (30% chance, 4); Frost Strike spends 35.
# Howling Blast itself gives no runic power (its -10 RP cost is not paid out).
#
# Killing Machine (2 stacks, 10s) comes from auto-attack crits (SimC's 30%
# accumulated RNG procs on ~half of them), Empower Rune Weapon, Exterminate,
# Reaper's Mark and, during Pillar of Frost, every Frost Strike / Howling
# Blast (Obliteration). It guarantees Obliterate crits. Rime (Frost Strike,
# 45% + 15% Rage of the Frozen Champion = 60% [db2]) makes Howling Blast free,
# +275% damage and 8 RP. Pillar of Frost (+20% strength, 12s, 45s) starts a
# free Remorseless Winter (Frozen Dominion) and Deathbringer's Reaper's Mark
# puts a 40-stack debuff on the target that explodes for 0.544 AP a stack;
# the explosion arms Exterminate (the next Obliterates cost 1 rune, half RP,
# and pull a scythe), plus a Mark's own cast.

name = "Frost Death Knight (Deathbringer, core kit)"

precombat = ["gear_procs"]

[player]
# SimC's buffed snapshot (raid buffs, no procs). Strength procs (Unholy
# Strength 18%, Rune Mastery 6%, Enduring Strength 8%) are buffs below.
attack_power = 2741      # [obs]
crit = 0.1937            # [obs]
haste = 0.3439           # [obs] rating 948 (26.4%) + Rune of Burning Haste's average 340 rating (8.0%)
versatility = 0.0502     # [obs]
mastery = 0.8008         # [obs] Mastery: Frozen Heart, frost damage [db2 77514]
crit_multiplier = 2.08   # [obs] crit_bonus total 1.0808 in the log
# One-handers, 2.6s swing [db2; obs weapon speed 2.6]
weapon = { min = 0, max = 0, speed = 2.6 }
off_hand = { min = 0, max = 0, speed = 2.6 }

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1          # [simc] death_knight_t::available(): re-check while pooling runes/RP
ready_tolerance = 1e-5

[resources.runes]
max = 6                  # [db2]
start = 6                # [obs] full out of combat
# [obs] SimC's Rune Regeneration grant is 97.3 a fight, but it spends them
# evenly while this engine caps runes in Pillar windows where Obliterate is
# held; 0.36/s is the rate that reproduces SimC's 113.6 Obliterates.
regen = 0.36
regen_hasted = false

[resources.runic_power]
max = 100                # [db2]
start = 0                # [obs]

[[abilities]]
name = "gear_procs"
triggered_only = true
gcd = 0
on_cast = [{ type = "buff", buff = "venomcursed_crit" }]

[auto_attack]
replace_with = "mh_swing"
off_hand_replace_with = "oh_swing"
wakes = false            # [simc] ready trigger: runes/RP and the 100ms poll, not swings

