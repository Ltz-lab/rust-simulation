# Obliterate: 2 runes, MH physical + MH frost + OH physical + OH frost, 20 RP
[[abilities]]
name = "obliterate"
spell_id = 49020
cost = { runes = 2 }
cost_expr = { runes = "2-buff.exterminate.up" }   # [db2 441416 #2: -50% cost while an Exterminate is armed]
free_with = "empower_rune_weapon"     # [simc] Obliteration's free cast
damage = { ap_coeff = 0.785643, crit_damage_bonus = 0.45 }   # [db2 222024]
on_start = [
  { type = "trigger", ability = "obliterate_frost" },
  { type = "trigger", ability = "obliterate_offhand" },
  { type = "trigger", ability = "obliterate_offhand_frost" },
]
on_cast = [
  { type = "gain", resource = "runic_power", amount_expr = "10*spent.runes" },   # [obs] 20 a cast, 10 under Exterminate, 0 when free
  { type = "trigger", ability = "rune_spent_2" },
  { type = "if", if = "buff.exterminate.up", then = [
    { type = "consume", buff = "exterminate" },
    { type = "trigger", ability = "exterminate", delay = 0.5 },   # [simc] 500ms
  ] },
  { type = "if", if = "buff.killing_machine.up", then = [
    { type = "trigger", ability = "km_consume" },
  ] },
]

[[abilities]]
name = "obliterate_frost"
