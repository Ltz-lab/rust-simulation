# ---------------------------------------------------------------- rotation
# SimC's default single-target APL for this profile (Deathbringer, Breath,
# Obliteration). Cooldowns first, then the single_target list.

[[rotation]]
action = "pillar_of_frost"
if = "fight_remains<20|((cooldown.breath_of_sindragosa.remains>20|(cooldown.breath_of_sindragosa.remains<gcd&runic_power>=40))&runes>=2)"

[[rotation]]
action = "breath_of_sindragosa"
if = "!dot.breath_of_sindragosa_damage.ticking&(buff.pillar_of_frost.up|fight_remains<20)"

[[rotation]]
action = "reapers_mark"
if = "buff.pillar_of_frost.up|cooldown.pillar_of_frost.remains>5|fight_remains<20"

[[rotation]]
action = "frostwyrms_fury"
if = "(!buff.chosen_of_frostbrood_fwf.up&buff.pillar_of_frost.up&buff.bonegrinder_frost.up)|(fight_remains<20&!buff.chosen_of_frostbrood_haste.up)"

[[rotation]]
action = "chosen_of_frostbrood"
if = "buff.chosen_of_frostbrood_fwf.up&(buff.pillar_of_frost.remains<gcd|buff.unholy_strength.remains<gcd|buff.bonegrinder_frost.remains<gcd)&buff.razorice.stack=5"

[[rotation]]
action = "empower_rune_weapon"
if = "(runes<2|!buff.killing_machine.up)&runic_power<35"

[[rotation]]
action = "empower_rune_weapon"
if = "cooldown.empower_rune_weapon.charges_fractional>=1.8&buff.killing_machine.stack<1"

[[rotation]]
action = "empower_rune_weapon"
if = "cooldown.breath_of_sindragosa.remains<=6&buff.killing_machine.stack<1"

[[rotation]]
action = "empower_rune_weapon"
if = "buff.pillar_of_frost.remains>4*gcd&runes<=2&buff.killing_machine.stack=1"

# --- single_target
[[rotation]]
action = "obliterate"
if = "buff.killing_machine.stack=2|(buff.killing_machine.up&runes>=3)"

[[rotation]]
action = "howling_blast_rime"
if = "buff.rime.up"

[[rotation]]
action = "frost_strike"
if = "runic_power>70&!(cooldown.breath_of_sindragosa.remains<4*gcd&runic_power<95-10*runes)"

[[rotation]]
action = "obliterate"
if = "buff.killing_machine.up&!(cooldown.reapers_mark.remains<6&runes<3)"

[[rotation]]
action = "frost_strike"
if = "!(cooldown.breath_of_sindragosa.remains<4*gcd&runic_power<95-10*runes)"

[[rotation]]
action = "obliterate"
if = "!(cooldown.reapers_mark.remains<6&runes<3)&!buff.pillar_of_frost.up"

[[rotation]]
action = "howling_blast"
if = "!buff.killing_machine.up&buff.pillar_of_frost.up"
