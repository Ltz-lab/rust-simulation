on_noncrit = [{ type = "if", if = "buff.reapers_mark_debuff.up", then = [{ type = "buff", buff = "reapers_mark_stacks", stacks = 2 }] }]

# Killing Machine spent: Killing Streak, Bonegrinder, Murderous Efficiency,
# Breath extension and Arctic Assault (one hit a stack) [simc consume_killing_machine]
[[abilities]]
name = "km_consume"
triggered_only = true
gcd = 0
on_cast = [
  { type = "buff", buff = "killing_streak" },
  { type = "if", if = "buff.killing_machine.stack>=2", then = [{ type = "buff", buff = "killing_streak" }] },
  { type = "if", if = "!buff.bonegrinder_frost.up", then = [
    { type = "buff", buff = "bonegrinder_crit", set = "buff.bonegrinder_crit.stack+buff.killing_machine.stack" },
    { type = "if", if = "buff.bonegrinder_crit.stack>=5", then = [
      { type = "buff", buff = "bonegrinder_frost" },
      { type = "buff", buff = "bonegrinder_crit", set = "0" },
    ] },
  ] },
  { type = "trigger", ability = "murderous_efficiency", chance = 0.20 },
  { type = "if", if = "buff.killing_machine.stack>=2", then = [
    { type = "trigger", ability = "murderous_efficiency", chance = 0.20 },
  ] },
  { type = "if", if = "dot.breath_of_sindragosa_damage.ticking", then = [
    { type = "if", if = "buff.killing_machine.stack>=2", then = [{ type = "extend_dot", dot = "breath_of_sindragosa_damage", seconds = 1.6 }], else = [
      { type = "extend_dot", dot = "breath_of_sindragosa_damage", seconds = 0.8 },
    ] },
  ] },
  { type = "buff", buff = "arctic_assault_stacks", set = "buff.killing_machine.stack" },
  { type = "trigger", ability = "glacial_advance_arctic_assault", delay = 0.5 },   # [simc] one hit at stack strength
  { type = "trigger", ability = "dark_talons_proc", chance = 0.25 },   # [db2 436687]
  { type = "consume", buff = "killing_machine", all = true },
]

