# Demonology Warlock — Diabolist, Midnight Season 2.
# [db2]: build 12.1.5.70575, tools/spelldb.py; [simc]: warlock class module
# and default APL; [obs]: reference/demo_core_observations.json / logged SimC fights.
# Per-hit residuals live in calibration/. No cast/hit counts are calibrated.
name = "Demonology Warlock (Diabolist, core kit)"
# [simc] pre-pull Felguard and Demonbolt; Inner Demons first spawn approximated at 6s.
precombat = ["summon_felguard", "demonbolt", "start_inner_demons", "oculi_clock"]

[player]
# [obs] snapshot plus averages from 24 logged fights (gear procs and Blood Fury):
# +61.64 intellect, +195.87 crit, +93.32 haste, +201.47 mastery, +30.27 vers rating.
spell_power = 3492
crit = 0.38975
haste = 0.21249
mastery = 0.5341
versatility = 0.078014
crit_multiplier = 2.0 # [simc] pets with Demonic Brutality add 0.6 individually.

[gear]
primary = "intellect"
base_primary = 622          # [obs] level-90 Orc, checked against SimC.
primary_mult = 1.135575     # [simc] 1.05 armor x 1.05 Fel Intellect x 1.03 raid intellect.
spell_power_per_primary = 1.0 # [simc]
crit_bonus = 0.07           # [obs] snapshot less rating contribution (checked with --gear-stats).
haste_mult = 1.02           # [simc] racial/passive; checked against snapshot.
mastery_points = 15         # [obs] base 13 + 2 Skyfury.
mastery_coeff = 1.45        # [obs] +500 mastery probe, including spec modifiers.
versatility_bonus = 0.03    # [simc] Mark of the Wild.
spec_id = 266              # [db2] ChrSpecialization.
use_items = { buff = "pet.demonic_tyrant.active|fight_remains<25", other = "1" }
use_after = "potion"
effect_mult = { physical = 1.0815, magic = 1.0609 } # [simc] raid debuffs.

[gear.procs]
# [obs] same time averages as [player], in final-stat units.
spell_power = 70
crit = 0.0425761
haste = 0.02164
mastery = 0.063507
versatility = 0.0056066

[gear.kit]
enabled = 1 # [simc] raid consumables; applied only with gear, disable for core reference.
precombat = ["full_kit"]
# [db2/obs] Royal Roast 50 primary, augment rune 25.1, flask 165 mastery, oil 16 crit/haste.
stats = { primary = 75.1, crit_rating = 181, haste_rating = 16 }   # [simc] SimC default consumables, measured on the sample profile: Flask of the Shattered Sun (crit 165) + oil 16/16

[fight]
duration = 300 # [obs] reference setup
variance = 0.2 # [obs] SimC default

[resources.soul_shard]
max = 5 # [db2]
start = 3 # [simc] out of combat

[resources.ritual_stage]
max = 2 # [simc] Overlord -> Mother -> Pit Lord
start = 1 # [simc] initial ritual can be any stage; representative Mother opener


