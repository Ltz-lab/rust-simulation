# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Feral APL, single target, Wildstalker.

[[rotation]]
action = "shadowmeld"
if = "cooldown.shadowmeld.ready&dot.rake.remains<=3.6"   # [simc] builder: re-stealth for a fresh Rake

[[rotation]]
action = "rake"
if = "buff.prowl.up"       # [simc] rake out of stealth

[[rotation]]
action = "tigers_fury"
if = "cooldown.berserk.remains<=1|cooldown.berserk.remains>10"

[[rotation]]
action = "berserk"
if = "buff.tigers_fury.up"

[[rotation]]
action = "potion"          # [simc APL: potion,if=buff.bs_inc.up|fight_remains<32|...]
if = "buff.berserk.up|fight_remains<32"

[[rotation]]
action = "feral_frenzy"
if = "combo_points<=2+(2*buff.berserk.up)"

[[rotation]]
action = "convoke_the_spirits"
if = "(buff.berserk.up&buff.tigers_fury.up&(prev_gcd.rip|prev_gcd.ferocious_bite))|fight_remains<5"

[[rotation]]
action = "rip"
if = "combo_points>=5&dot.rip.remains<=5.8&(buff.tigers_fury.up|dot.rip.remains<cooldown.tigers_fury.remains)"   # [simc] refreshable = 30% of 19.2s

[[rotation]]
action = "ferocious_bite"
if = "combo_points>=5&energy>=50"   # [simc] max_energy=1

[[rotation]]
action = "rake"
if = "combo_points<=4&(dot.rake.remains<2|((buff.tigers_fury.up|dot.rake.remains<cooldown.tigers_fury.remains)&dot.rake.remains<=3.6))"   # [simc] refreshable = 30% of 12s

[[rotation]]
action = "lunar_inspiration"
if = "combo_points<=4&(dot.lunar_inspiration.remains<2|((buff.tigers_fury.up|dot.lunar_inspiration.remains<cooldown.tigers_fury.remains)&dot.lunar_inspiration.remains<=4.32))"   # [simc] refreshable = 30% of 14.4s

[[rotation]]
action = "shred"
if = "combo_points<=4"
