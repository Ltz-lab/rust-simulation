# ---------------------------------------------------------------- Convoke the Spirits
# [simc convoke_the_spirits_t] 16 ticks in 4s, no haste. _execute_cat builds the
# tick list as 4-8 offspec ticks (heal 35% / Moonfire 50% / Wrath 15%), one
# exceptional Feral Frenzy and ~3.6+ Ferocious Bites, and fills the rest with
# CAST_SPEC (Shred 10/32, Rake 22/32; a Rake whose dot is up becomes Shred, and
# Moonfire becomes Wrath while Lunar Inspiration ticks).
# Per convoke in the reference [obs]: 3.64 Bite, 6.03 Shred, 3.32 Wrath,
# 0.53 Moonfire, 0.20 Feral Frenzy, ~2.2 heals. Weighted over 32 slots.

[[abilities]]
name = "convoke_the_spirits"
spell_id = 391528
gcd = 1.5
cooldown = 120             # [db2]
channel = { ticks = 16 }
[abilities.dot]
name = "convoke_clock"
tick_time = 0.25
duration = 4
hasted = false
whole_ticks = true
on_tick = [{ type = "choose", choices = [
  # 4/32 heals (Regrowth / Rejuvenation, no damage)
  { effects = [] },
  { effects = [] },
  { effects = [] },
  { effects = [] },
  # 7/32 Ferocious Bite
  { effects = [{ type = "trigger", ability = "ferocious_bite_convoke" }] },
  { effects = [{ type = "trigger", ability = "ferocious_bite_convoke" }] },
  { effects = [{ type = "trigger", ability = "ferocious_bite_convoke" }] },
  { effects = [{ type = "trigger", ability = "ferocious_bite_convoke" }] },
  { effects = [{ type = "trigger", ability = "ferocious_bite_convoke" }] },
  { effects = [{ type = "trigger", ability = "ferocious_bite_convoke" }] },
  { effects = [{ type = "trigger", ability = "ferocious_bite_convoke" }] },
  # 12/32 Shred
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  { effects = [{ type = "trigger", ability = "shred_convoke" }] },
  # 6/32 Wrath
  { effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  { effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  { effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  { effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  { effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  { effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  # 2/32 Moonfire, which is a Wrath while the Lunar Inspiration dot ticks
  { if = "dot.lunar_inspiration.up", effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  { if = "dot.lunar_inspiration.up", effects = [{ type = "trigger", ability = "wrath_convoke" }] },
  { if = "!dot.lunar_inspiration.up", effects = [{ type = "trigger", ability = "lunar_inspiration_convoke" }] },
