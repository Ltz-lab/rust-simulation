tick_time = 1.6            # [db2 155625] 2s, x0.8 Circle of Life and Death
duration = 14.4            # [db2 155625] 18s, x0.8 Circle of Life and Death
hasted = true
school = "arcane"
mastery = true
refresh = "pandemic"

[[abilities]]
name = "panthers_guile"    # [db2 1280316] Shred/Moonfire: 25% to generate full combo points
triggered_only = true
gcd = 0
on_cast = [{ type = "if", if = "combo_points<5", then = [
  { type = "gain", resource = "combo_points", amount_expr = "5-combo_points" },
] }]

# ---------------------------------------------------------------- finishers

[[abilities]]
name = "rip"
spell_id = 1079
gcd = 1.0
cost = { energy = 20, combo_points = 1 }   # [db2]
cost_max = { combo_points = 5 }
on_cast = [{ type = "trigger", ability = "finisher_common" }]
[abilities.dot]
name = "rip"
ap_coeff = 0.3113          # [db2 1079#1] per 2s tick
tick_time = 1.6            # [db2 1079] 2s, x0.8 Circle of Life and Death
duration = 19.2            # [db2 1079] 4s x (1+CP), x0.8 Circle of Life and Death; overridden per cast
duration_expr = "3.2*(1+spent.combo_points)"
hasted = true
school = "physical"
mastery = true
refresh = "pandemic"
# [db2 439528#1] Thriving Growth 10% per Rip tick, x1.2 Green Thumb and
# x1.3 for Twin Sprouts' second stack: 15.6%
on_tick = [{ type = "trigger", ability = "bloodseeker_vines_apply", chance = 0.156 }]

[[abilities]]
name = "ferocious_bite"
spell_id = 22568
gcd = 1.0
cost = { energy = 25, combo_points = 1 }   # [db2]
cost_max = { energy = 50, combo_points = 5 }
damage = { ap_coeff = 1.452, school = "physical", mastery = true, scale = "(spent.combo_points/5)*(1+(spent.energy-25)/25)" }   # [db2 22568#1/#2]
on_cast = [
  { type = "trigger", ability = "finisher_common" },
  { type = "buff", buff = "sabertooth", set = "spent.combo_points" },   # [db2 391722]
  { type = "trigger", ability = "unseen_slash", chance_expr = "0.15*spent.combo_points" },   # [db2 1263657]
  { type = "if", if = "dot.bloodseeker_vines.up", then = [{ type = "trigger", ability = "bursting_growth" }] },   # [simc ferocious_bite_t]
]

[[abilities]]
name = "finisher_common"
triggered_only = true
gcd = 0
on_cast = [
  { type = "gain", resource = "energy", amount_expr = "2*spent.combo_points" },   # [db2 158476] Soul of the Forest
  { type = "trigger", ability = "frantic_momentum_proc", chance_expr = "0.06*spent.combo_points" },   # [db2 391875#1] 6% per cp at rank 2
  { type = "trigger", ability = "sudden_ambush_proc", chance_expr = "0.06*spent.combo_points" },      # [db2 384667]
  { type = "if", if = "buff.tigers_tenacity.up", then = [
    { type = "consume", buff = "tigers_tenacity" },
    { type = "gain", resource = "combo_points", amount = 1 },   # [db2 391874]
  ] },
]

[[abilities]]
name = "frantic_momentum_proc"
triggered_only = true
gcd = 0
on_cast = [{ type = "buff", buff = "frantic_momentum" }]

[[abilities]]
name = "sudden_ambush_proc"
triggered_only = true
gcd = 0
on_cast = [{ type = "buff", buff = "sudden_ambush" }]

