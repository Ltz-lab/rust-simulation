# Feral Druid — Wildstalker, Midnight Season 2, single target, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Druid_Feral.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py / SimC's
#          spell_query
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_druid.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# Cat form: energy (140, 12.65/s hasted), combo points (5). Builders are Rake,
# Shred and Lunar Inspiration (Moonfire); finishers are Rip (a bleed whose
# length grows with combo points) and Ferocious Bite (spends all combo points
# and up to 25 extra energy). Tiger's Fury (+50 energy, +21% damage, bleeds
# +31% for their full duration) drives Berserk (15s, +15% damage, +1 combo
# point per builder, 1 combo point every 1.5s) and Feral Frenzy / Convoke the
# Spirits. Wildstalker: Rip/Rake ticks grow Bloodseeker Vines, whose stacks
# burst as Bursting Growth and can proc Rampancy; Tiger's Fury makes the next
# two builders deliver an Unseen Slash, and Ferocious Bite can too.

name = "Feral Druid (Wildstalker, core kit)"
precombat = ["prowl_precast"]

[player]
# SimC's buffed snapshot (core kit). The gear stat procs (Rune of Burning
# Haste, Arcanoweave Insight, Might of the Void, Venomcursed) are not modelled;
# their effect sits in the calibration residual.
attack_power = 2577        # [obs] buffed snapshot
# [obs] the weapon's share of ability damage, fitted to the +200 agility probe
# (AP 2577 -> 2798 gives +5.99% per hit on every source: 1112 AP-equivalent)
weapon_attack_power = 1112
crit = 0.2689              # [obs] buffed snapshot
haste = 0.2657             # [obs] 26.57% buffed snapshot (gear haste procs are not modelled)
mastery = 0.7474           # [obs] buffed snapshot (Mastery: Razor Claws)
versatility = 0.0798       # [obs] buffed snapshot
crit_multiplier = 2.0808   # [obs] crit/non-crit in the log (2.0 x 1.0404 physical crit damage)
weapon = { min = 0, max = 0, speed = 1.0 }   # [simc] cat form beast weapon, 1.0s

# Gear -> stats (docs/gear.md): SimC's MID2 sample Feral profile without
# trinkets (core kit). Every item level and rating matches SimC
# (tools/check_gear.py) and the buffed stats land on the [player] snapshot.
[gear]
primary = "agility"
base_primary = 622            # [obs] level-90 night elf druid base agility (SimC: 2339 initial = 1717 from gear + 622)
primary_mult = 1.05           # [obs] leather specialization: buffed 2455 / initial 2339 (+200 agility probe: +210 buffed)
attack_power_mult = 1.05      # [obs] Battle Shout: 2455 agility -> 2577 attack power
crit_bonus = 0.10             # [obs] 26.89% at 777 rating = 16.89% from rating + 10%
haste_mult = 1.0706           # [obs] 26.57% at 802 rating (18.23%): x1.0706, multiplicative with rating haste
mastery_points = 10           # [obs] 8 base + 2 Skyfury, in mastery points
mastery_coeff = 2.0           # [db2 77493] Mastery: Razor Claws, % per mastery point
versatility_bonus = 0.06      # [db2 1126] Mark of the Wild, doubled by Gift of the Wild
weapon_ap_per_dps = 7.13756   # [obs] weapon_attack_power 1112 at 155.80 main-hand DPS
spec_id = 103                 # [db2] ChrSpecialization

# The gear stat procs (Rune of Burning Haste, Arcanoweave Insight, Might of
# the Void, Venomcursed) are not modelled: [player] holds the plain buffed
# snapshot, so there is no [gear.procs] on top.

# Omnium traits (omnium_talents= in the profile; docs/gear.md#omnium-traits). The
# calibration reference has these on, so their worth is inside the fitted
# multipliers; a character with fewer gets it taken back out, trait by trait.
# tools/omnium.py ablate at 20,000 iterations: core kit 169,273 with all, 163,783 with
# none, +3.35%. Each value is the leave-one-out ratio, rescaled so the product
# is exactly all / none.
[gear.omnium]
baseline = ["136814", "136821", "136817", "136823", "136822"]
traits = [
  { id = "136814", name = "Rune of Overload", global_mult = 1.00155 },   # [simc] leave-one-out 1.00293
  { id = "136821", name = "Rune of Burning Haste", global_mult = 1.01319 },   # [simc] leave-one-out 1.02510
  { id = "136817", name = "Rune of Lingering", global_mult = 1.00085 },   # [simc] leave-one-out 1.00160
  { id = "136823", name = "Rune of Lynxlike Reflexes", global_mult = 0.99979 },   # [simc] leave-one-out 0.99961
  { id = "136822", name = "Rune of Unleashed Fire", global_mult = 1.01783 },   # [simc] leave-one-out 1.03398
]

# Raid-night kit with gear lines: SimC's default level-90 Feral consumables
# plus Bloodlust. --set gear.kit.enabled=0 for core-kit runs.
[gear.kit]
enabled = 1
precombat = ["full_kit"]   # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, mastery_rating = 165, crit_rating = 16, haste_rating = 16 }
#   primary 50     Harandar Celebration [obs: +53 agility]
#   primary 25.1   Void-Touched augment rune [db2 1264426; obs +27 agility]
#   mastery 165    Flask of the Magisters (rank 2) [obs: SimC buffed stats]
#   crit/haste 16  Thalassian Phoenix Oil (rank 2) on the main hand [obs]

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1            # [simc] druid_t::available(): re-check on energy thresholds
ready_tolerance = 1e-5

[resources.energy]
max = 140                  # [simc] 100 + Tireless Energy 2/2 (+40)
start = 140                # [obs] full out of combat
regen = 12.65              # [obs/simc] SimC base_energy_regen_per_second (10/s x 1.1 Tireless x 1.15)
regen_hasted = true        # [obs] energy regen follows haste

[resources.combo_points]
max = 5                    # [db2] Overflowing Power's over-cap storage is not modelled
start = 0

[auto_attack]
replace_with = "cat_melee"
wakes = false              # [simc] a waiting feral re-checks on resources and cooldowns, not swings
on_hit = [{ type = "trigger", ability = "cat_melee_skyfury", chance = 0.20 }]   # [simc 462854] Skyfury repeats the swing

# Omen of Clarity: a swing has a flat chance to grant Clearcasting [simc
# melee_t: weapon->proc_chance_on_swing(7 PPM)]. Measured over the reference's
# log it is 15.2% per swing (9.1 PPM of cat form's 1.0s weapon), not hasted.
[[procs]]
ability = "clearcasting_proc"
chance = 0.152
on_hit = true
sources = ["cat_melee"]   # Skyfury repeats report in this row too

# Rune of Unleashed Fire (main-hand enchant) [obs 49.5 procs a fight]
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 10.1

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "prowl"             # [db2 5215] out of combat stealth, broken by the opener
duration = 1000000000
ability_pct = { rake = 60, shred = 60 }   # [db2 1822#4/5221#3] Pouncing Strikes / Improved Prowl
ability_crit_pct = { shred = 27 }          # [simc] Shred's crit chance multiplier x2 from stealth

[[buffs]]
name = "tigers_fury"       # [db2 5217 + 202021] 15s (Predator +5s)
duration = 15
damage_pct = 21            # [db2 5217#1/#3/#4 + 390902] +15% + Carnivorous Instinct 6%
ability_pct = { rip = 10, rake = 10, bloodseeker_vines = 10, lunar_inspiration = 10, feral_frenzy = 10, unseen_slash = 10 }   # [db2 391872#3] Tiger's Tenacity: bleeds +10% more

[[buffs]]
name = "berserk"           # [db2 106951] 15s
duration = 15
damage_pct = 15            # [db2 106951#3/#4/#5]

[[buffs]]
name = "clearcasting"      # [db2 135700] 2 stacks out of the class 4pc; only Shred is free
duration = 15
max_stacks = 2

[[buffs]]
name = "sudden_ambush"     # [db2 1244483] 6% per combo point on finishers
duration = 15
ability_pct = { rake = 50, shred = 50 }
ability_crit_pct = { rake = 100, shred = 100 }

[[buffs]]
name = "frantic_momentum"  # [db2 391876] 6% per combo point on finishers (rank 2)
duration = 6
haste_duration = 1.0       # [obs] 8.2s average duration in the reference, i.e. 6s x haste
haste_pct = 10

[[buffs]]
name = "savage_fury"       # [db2 449646] Tiger's Fury: +10% haste, +25% energy regen
duration = 8
haste_pct = 10
resource_regen_pct = { energy = 25 }

[[buffs]]
name = "tigers_tenacity"   # [db2 391873] next 3 finishers restore 1 combo point
duration = 15
max_stacks = 3

[[buffs]]
name = "stalking_predator" # [db2 1263962] Tiger's Fury: next 2 builders deliver an Unseen Slash
duration = 15
max_stacks = 2

[[buffs]]
name = "unseen_predators_craving"   # [db2 1263939, simc value override] 1s per combo point
duration = 5
refresh_extend = true
damage_pct = 15

[[buffs]]
name = "sabertooth"        # [db2 391722] Ferocious Bite: bleeds +6% per combo point, 6s
duration = 6
max_stacks = 5
ability_pct = { rip = 6, rake = 6, bloodseeker_vines = 6, lunar_inspiration = 6, feral_frenzy = 6, unseen_slash = 6 }

[[buffs]]
name = "full_kit"          # marker: consumables and Bloodlust are in play (see [gear.kit])
duration = 1000000000

[[buffs]]
name = "bloodlust"         # [db2 2825: +30% haste, 40s]
duration = 40
haste_pct = 30

[[buffs]]
name = "liquid_luster"     # potion: Lustrous Gleam stacks (3 average over the 30s) [db2 1295147]
duration = 30
versatility_pct = 23.34    # [simc log] 420 rating a stack (not the 220.82 an unscaled DB2 read gives) x 3 stacks / 54 rating a point

# ---------------------------------------------------------------- builders

[[abilities]]
name = "clearcasting_proc"
triggered_only = true
gcd = 0
on_cast = [{ type = "buff", buff = "clearcasting" }]

[[abilities]]
name = "cat_melee"         # [simc] cat form auto attack: weapon damage + AP/6
triggered_only = true
gcd = 0
damage = { ap_coeff = 0.166667, school = "physical" }   # [simc] 1/6 weapon power coefficient

[[abilities]]
name = "cat_melee_skyfury" # [simc 462854] Skyfury repeats the swing; the repeat can't proc Skyfury again
triggered_only = true
gcd = 0
source = "cat_melee"
damage = { ap_coeff = 0.166667, school = "physical" }   # [simc] the same 1/6 weapon power coefficient

[[abilities]]
name = "shadowmeld"        # [db2 58984] Night Elf racial; the APL re-stealths to re-Rake
spell_id = 58984
gcd = 1.0                  # [db2]
cooldown = 120             # [db2 58984] two minutes
on_cast = [{ type = "buff", buff = "prowl" }]

[[abilities]]
name = "prowl_precast"
triggered_only = true
gcd = 0
on_cast = [{ type = "buff", buff = "prowl" }]

[[abilities]]
name = "rake"
spell_id = 1822
gcd = 1.0
cost = { energy = 35 }     # [db2]
gain = { combo_points = 1 } # [db2 1822#2]
damage = { ap_coeff = 0.291, school = "physical" }   # [db2 1822#1]
on_crit = [{ type = "gain", resource = "combo_points", amount = 1 }]   # [db2 16953] Primal Fury
on_cast = [
  { type = "if", if = "buff.berserk.up", then = [{ type = "gain", resource = "combo_points", amount = 1 }] },   # [db2 106951#2]
  { type = "if", if = "buff.stalking_predator.up", then = [
    { type = "consume", buff = "stalking_predator" },
    { type = "trigger", ability = "unseen_slash" },
  ] },
  { type = "if", if = "buff.sudden_ambush.up", then = [{ type = "consume", buff = "sudden_ambush" }] },
  { type = "consume", buff = "prowl" },
]
[abilities.dot]
name = "rake"
ap_coeff = 0.294           # [db2 155722#1] per 3s tick
tick_time = 2.4            # [db2 155722] 3s, x0.8 Circle of Life and Death [db2 400320]
duration = 12              # [db2 155722] 15s, x0.8 Circle of Life and Death
hasted = true
school = "physical"
mastery = true             # [obs] +500 mastery probe: x1.107 on the tick
refresh = "pandemic"
# [db2 439528#2] Thriving Growth 13.5% per Rake tick, x1.2 Green Thumb
# [db2 1270565] and x1.3 for Twin Sprouts' second stack [db2 440117]: 21.06%
on_tick = [{ type = "trigger", ability = "bloodseeker_vines_apply", chance = 0.2106 }]

[[abilities]]
name = "shred"
spell_id = 5221
gcd = 1.0
cost = { energy = 40 }     # [db2]
gain = { combo_points = 1 } # [db2 5221#2]
free_with = "clearcasting"
damage = { ap_coeff = 2.6048, school = "physical" }   # [db2 5221#1]
on_crit = [{ type = "gain", resource = "combo_points", amount = 1 }]   # [db2 16953]
on_cast = [
  { type = "if", if = "buff.berserk.up", then = [{ type = "gain", resource = "combo_points", amount = 1 }] },
  { type = "if", if = "buff.stalking_predator.up", then = [
    { type = "consume", buff = "stalking_predator" },
    { type = "trigger", ability = "unseen_slash" },
  ] },
  { type = "if", if = "buff.sudden_ambush.up", then = [{ type = "consume", buff = "sudden_ambush" }] },
  { type = "trigger", ability = "panthers_guile", chance = 0.25 },   # [db2 1280316]
  { type = "consume", buff = "prowl" },
]

[[abilities]]
name = "lunar_inspiration"
spell_id = 155625
gcd = 1.0
cost = { energy = 30 }     # [db2]
gain = { combo_points = 1 } # [db2 155625#3]
damage = { ap_coeff = 0.216, school = "arcane", mastery = true }   # [db2 155625#2]
on_crit = [{ type = "gain", resource = "combo_points", amount = 1 }]
on_cast = [
  { type = "if", if = "buff.berserk.up", then = [{ type = "gain", resource = "combo_points", amount = 1 }] },
  { type = "if", if = "buff.stalking_predator.up", then = [
    { type = "consume", buff = "stalking_predator" },
    { type = "trigger", ability = "unseen_slash" },
  ] },
  { type = "trigger", ability = "panthers_guile", chance = 0.25 },   # [db2 1280316]
]
[abilities.dot]
name = "lunar_inspiration"
