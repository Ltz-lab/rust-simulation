# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Destruction APL, single target, Hellcaller.

[[rotation]]
action = "soul_fire"
if = "soul_shard<=4"

[[rotation]]
action = "conflagrate"
if = "cooldown.conflagrate.charges>=2"

[[rotation]]
action = "conflagrate"
if = "soul_shard<=4.2&buff.backdraft.stack<1"

[[rotation]]
action = "summon_infernal"

[[rotation]]
action = "malevolence"

# Shadowburn needs the target below 20% or Fiendish Cruelty
[[rotation]]
action = "shadowburn"
if = "(target.health.pct<=20|buff.fiendish_cruelty.up)&(soul_shard>=4|buff.malevolence.up|buff.infernal.up|fight_remains<=15)"

# Wither in its pandemic window, unless Soul Fire will refresh it first
[[rotation]]
action = "wither_direct"
if = "dot.wither.remains<6.3&cooldown.soul_fire.remains+2.5>dot.wither.remains&fight_remains>8"

[[rotation]]
action = "conflagrate"
if = "soul_shard<=4.4&buff.backdraft.stack<1"

[[rotation]]
action = "chaos_bolt"
if = "soul_shard>=4|buff.malevolence.up|buff.infernal.up|fight_remains<=15"

[[rotation]]
action = "incinerate_instant"

[[rotation]]
action = "incinerate"
