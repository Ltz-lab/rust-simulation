# Protection Warrior — Colossus, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Warrior_Protection.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_warrior.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# A tank, simulated only for the damage it deals to a Patchwerk boss that
# hits it every 2s. What the boss does to the warrior still matters in three
# ways, and each is modelled as its own source of rage or procs:
#   * rage from damage taken: 3 every 2s [simc rage_from_damage_taken];
#   * Tough as Nails: a damage proc on a block, ~12.8 a minute [obs 63.8 a fight];
#   * Revenge: a free Revenge when the warrior dodges or parries [simc rppm.revenge],
#     ~3.3 a minute [obs 16.6 buff starts].
# Rage (max 130): Shield Slam +19 (+50% inside Violent Outburst), Thunder Clap
# +5, Shield Charge +20, Demoralizing Shout +20 (Booming Voice), Charge +20, a
# swing +3 and the Devastator it fires +2 (Instigate). Spent on Ignore Pain
# (35), Shield Block (30), Revenge (10 here, free with the proc) and Execute.
# Ignore Pain only matters to the sim as the rage sink: 250 rage spent triggers
# Violent Outburst [db2 386477], which triples the next Shield Slam, casts a
# free Ignore Pain and raises its rage by 50% [db2 386478].
#
# Every swing fires Devastator (1.314 AP, [db2 236282]) and each Devastator,
# Thunder Clap, Revenge or Execute has a 20% chance to reset Shield Slam
# [db2 458008 #1; obs: 0.275 reproduces 97 Shield Slams]. Shield Slam stacks Colossal Might (2 on
# a crit, Precise Might); Demolish (a 30s three-hit channel) spends it. Thunder
# Clap applies Rend and a Phalanx that the next Shield Slam spends for an extra
# hit. Execute and Demolish's third hit apply Deep Wounds (Decimator).

name = "Protection Warrior (Colossus, core kit)"

# Charge at the pull (+20 rage), the stance, and the gear-proc haste
precombat = ["battle_stance", "charge", "gear_haste_procs"]

[player]
# Final stats = SimC's buffed snapshot [obs]. Crit is the rate abilities
# actually crit at in the log (31%); the sheet says 25.5% before Wild
# Strikes, Rune of Critical Power and Celeritous Conclusion.
attack_power = 3046.6    # [obs] 2817 strength x 1.0815 (Battle Shout x Skyfury); mastery rides on top
crit = 0.31              # [obs] abilities and auto attacks crit 31% (sheet 25.5%)
haste = 0.3527           # [obs] buffed
versatility = 0.0498     # [obs] buffed
mastery = 0.2359         # [db2 76857 #4] Critical Block: attack power x(1 + 0.666 x mastery), mastery 35.41% [obs]; every AP-scaled source takes it
crit_multiplier = 2.12   # [obs] SimC's "Crit Dmg Mult: 1.0612" x2
# One-hander and a shield, 2.6s swing [obs]
weapon = { min = 0, max = 0, speed = 2.6 }

# How `--gear profile.simc` turns gear into the [player] stats above (see
# docs/gear.md). All [obs] from SimC's reported stats unless tagged.
[gear]
primary = "strength"
base_primary = 838            # [obs] 2817 buffed strength / 1.05 less the 1845 the items sum to (the profile's summary says 2042: ~197 strength is not in the item tables)
primary_mult = 1.05           # [obs] plate specialization
attack_power_mult = 1.0815    # [obs] Battle Shout x1.05 and Skyfury x1.03
crit_bonus = 0.1348           # [obs] the sheet says 25.5% but abilities crit 31% (Wild Strikes, Rune of Critical Power, Celeritous Conclusion); 17.52% from rating
haste_mult = 1.0404           # [obs] Into the Fray 4 x 2% [db2 202603] and the rest of the sheet's 35.27%
mastery_points = 10           # [obs] 8 base + 2 Skyfury
mastery_ap = 0.666            # read by tools/validate_stats.py: the reference's attack power carries (1 + 0.666 x mastery)
mastery_coeff = 1.0           # [db2 76857 #5] Critical Block: attack power +1% per mastery %; the sheet's mastery_value is 1.5x (AP 3765 -> 4096 on +500 rating)
versatility_bonus = 0.03      # [obs] Mark of the Wild
spec_id = 73                  # [db2] ChrSpecialization

# Raid-night kit with gear lines (see Ret): SimC's default level-90 Protection
# consumables plus Bloodlust. --set gear.kit.enabled=0 for core-kit runs.
# The potion (Liquid Luster, a 30s periodic proc of "Lustrous Gleam") is not modelled.
[gear.kit]
enabled = 1
precombat = ["full_kit"]      # Bloodlust at the pull
stats = { primary = 75.1, crit_rating = 181, haste_rating = 16 }
#   primary 50     Harandar Celebration [obs: +78 strength with the augment]
#   primary 25.1   Void-Touched augment rune [db2 1264426]
#   crit 165       Flask of the Shattered Sun (rank 2) [obs: SimC buffed stats]
#   crit/haste 16  Thalassian Phoenix Oil (rank 2) on the main hand [obs]

# Class set bonuses (the Midnight 12.1 Protection set, spells 1296647 / 1296648).
# 2pc [simc]: a free Revenge grants Vengeful Shield, +20% on the next Shield Slam
# [db2 1300681]. Its other effect, +15% to the label-4989 proc chance (Revenge's
# trigger), is not modelled. 4pc [simc bloody_rebuke]: Ravager hits and Revenge
# cast on its proc apply Bloody Rebuke, a 12s bleed [db2 1300690]. SimC applies it
# 55 times from Ravager and 13 from Revenge a fight.
[[gear.effects]]
spell = 1296647
text = '''
[[buffs]]
name = "vengeful_shield"
duration = 12
ability_pct = { shield_slam = 20 }

[[patch]]
ability = "revenge"
on_free = [{ type = "buff", buff = "vengeful_shield" }]

[[patch]]
ability = "shield_slam"
on_cast = [{ type = "consume", buff = "vengeful_shield" }]
'''

[[gear.effects]]
spell = 1296648
text = '''
[[abilities]]
name = "bloody_rebuke_apply"
triggered_only = true
gcd = 0
[abilities.dot]
name = "bloody_rebuke"      # [db2 1300690: 12s, 3s period, 0.761862 AP]
ap_coeff = 0.761862
tick_time = 3.0
duration = 12.0
hasted = true
mastery = true
refresh = "rolling"

[[patch]]
ability = "ravager_whirling_blade"
on_cast = [
  { type = "trigger", ability = "bloody_rebuke_apply" },
  { type = "trigger", ability = "bloody_rebuke_apply" },
]

[[patch]]
ability = "revenge"
on_free = [{ type = "trigger", ability = "bloody_rebuke_apply" }]
'''

[fight]
duration = 300
variance = 0.2
ready_tolerance = 1e-5

[resources.rage]
max = 130                # [db2]
start = 0

[auto_attack]
replace_with = "auto_attack_mh"

