# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Protection APL, Colossus, single target
# (actions + actions.colossus_st in MID2_Warrior_Protection.simc). Wrecking
# Throw, Shattering Throw (Javelineer), Champion's Spear and Leap are not taken
# or not cast in the reference (<1 a fight) and left out.

[[rotation]]
action = "avatar"

[[rotation]]
action = "ignore_pain"
if = "target.health.pct>=20&(rage.max-rage<=15&cooldown.shield_slam.ready|rage.max-rage<=20&cooldown.shield_charge.ready|rage.max-rage<=20&cooldown.demoralizing_shout.ready|rage.max-rage<=15|rage.max-rage<=18&cooldown.shield_slam.ready)|rage>=70&cooldown.shield_slam.remains<=1&buff.shield_block.remains"

[[rotation]]
action = "ravager"

[[rotation]]
action = "demoralizing_shout"

[[rotation]]
action = "demolish"
if = "buff.colossal_might.stack>=5"

[[rotation]]
action = "shield_charge"

[[rotation]]
action = "shield_block"
if = "buff.shield_block.remains<=10"

[[rotation]]
action = "shield_slam"

[[rotation]]
action = "thunder_clap"
if = "!buff.phalanx.up"

[[rotation]]
action = "execute"
if = "target.health.pct<20|buff.sudden_death.up"

[[rotation]]
action = "revenge"
if = "buff.revenge.up"

[[rotation]]
action = "thunder_clap"

[[rotation]]
action = "revenge"
