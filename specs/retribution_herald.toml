# ---------------------------------------------------------------- rotation
# Paraphrase of the observed priority (SimC default APL), single target.

[[rotation]]
action = "avenging_wrath"

[[rotation]]
action = "potion"           # only with [gear.kit]; SimC APL: in Avenging Wrath or the last 30s
if = "buff.avenging_wrath.up|fight_remains<30"

[[rotation]]
action = "execution_sentence_cast"
if = "buff.avenging_wrath.up"

[[rotation]]
action = "final_verdict"
if = "holy_power>=5&cooldown.wake_of_ashes.remains>0|buff.divine_purpose.up&buff.divine_purpose.remains<gcd*2"

[[rotation]]
action = "wake_of_ashes"
if = "cooldown.avenging_wrath.remains>6|buff.avenging_wrath.up"

[[rotation]]
action = "divine_toll"
if = "buff.avenging_wrath.up|cooldown.avenging_wrath.remains>15"

[[rotation]]
action = "hammer_of_wrath"
if = "cooldown.hammer_of_wrath.charges=2"

[[rotation]]
action = "final_verdict"

[[rotation]]
action = "hammer_of_wrath"

[[rotation]]
action = "blade_of_justice"

[[rotation]]
action = "judgment"
