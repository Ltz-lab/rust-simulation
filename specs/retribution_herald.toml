# Retribution Paladin — Herald of the Sun, Midnight Season 2, core kit
# (no trinkets / tier set / consumables; matches profiles/ret_core.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
# Spell-power coefficients are converted to attack power with the observed
# Ret ratio SP/AP = 3362/2696 = 1.247.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.

name = "Retribution Paladin (Herald, core kit)"

# Always-on haste procs, as an average: Rush of Light (+5%, 81% uptime) and the
# Rune of Burning Haste gear proc (~+4%). [obs] GCD outside AW is 1.14s, not
# the 1.24s base haste alone would give.
precombat = ["haste_procs"]

[player]
attack_power = 2696      # [obs] buffed stats
weapon_attack_power = 1058   # [obs] +8.5% AP from strength gives only +6.1% per hit -> constant weapon component
crit = 0.3185
haste = 0.2092
versatility = 0.0498
mastery = 0.5007         # Ret mastery: bonus to Holy/Holyfire damage AND Highlord's Judgment proc chance [obs: stat probe]
crit_multiplier = 2.12     # [obs] crit/non-crit ratio on Judgment (never overlaps AW): 2.117
weapon = { min = 0, max = 0, speed = 2.14 }   # [obs] 1.62s swings outside AW at 1.318 total haste; swings are Crusading Strikes

# How `--gear profile.simc` turns gear into the [player] stats above. Gear
# ratings and strength come from the game's item tables (data/gamedata.json.gz);
# these are the character's own constants on top. All [obs] from the
# reference's reported stats (naked, geared, and +rating probes).
[gear]
primary = "strength"
base_primary = 622         # [obs] level-90 dwarf paladin base strength (naked character)
primary_mult = 1.092       # [obs] x1.04 passive (naked) x1.05 plate armor specialization
attack_power_mult = 1.05   # [obs] Battle Shout
crit_bonus = 0.09          # [obs] 5% base + 4% passive
haste_mult = 1.02          # [obs] passive, multiplicative with rating haste
mastery_points = 14        # [obs] 8 base + 4 passive + 2 Skyfury, in mastery points
mastery_coeff = 1.35       # [obs] Ret mastery: % damage per mastery point (+500 mastery probe)
versatility_bonus = 0.03   # [obs] Mark of the Wild
weapon_ap_per_dps = 6.7909 # [obs] the engine's weapon AP component per main-hand weapon DPS (1058 at 155.8 DPS)

[fight]
duration = 300
variance = 0.2
physical_mult = 0.70

[resources.holy_power]
max = 5
start = 0

[auto_attack]
replace_with = "crusading_strike"
on_hit = [
  # Skyfury raid buff: 20% chance to repeat the swing [obs: 41 repeats / 197 swings]
  { type = "trigger", ability = "crusading_strike", chance = 0.20 },
]

# Random gear procs (neck/ring embellishments), as Poisson rates [obs]
[[procs]]
ability = "venomfang_proc"
per_minute = 5.65            # hasted RPPM: ~7.5/min observed at 1.318 haste incl. AW
hasted = true

[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 10.06

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "avenging_wrath"     # 24s window [obs]; db2 says 20s base -> talent extended
duration = 24
crit_pct = 20               # [db2 454351 aura 290 base 20]
haste_pct = 15              # [obs] swing timer 1.62s -> 1.41s inside AW
gcd_pct = 5                 # [obs] GCDs 0.94s inside AW (haste alone gives 0.99s)
cooldown_rate_pct = { hammer_of_wrath = 35 }   # [obs] fitted to Hammer cast rate in AW; 7.5s hasted alone can't sustain it

[[buffs]]
name = "haste_procs"
duration = 1e9
haste_pct = 9.0

[[buffs]]
name = "empyrean_legacy"    # next spender also fires a free Divine Storm [obs]
duration = 20

[[buffs]]
name = "divine_purpose"     # next Final Verdict is free [db2 408458: 12s]
duration = 12

[[buffs]]
name = "art_of_war"         # [db2 406086: 20s]
duration = 20

[[buffs]]
name = "dawnlight"          # stacks from Wake of Ashes, spent by spenders [db2 431522: 30s, 6 stacks]
duration = 30
max_stacks = 6

[[buffs]]
name = "execution_sentence"  # stores 20% of damage dealt for 10s [db2 1260251 aura 4 base 20]
duration = 10
store_damage_pct = 20

[[buffs]]
name = "divine_resonance"   # from Divine Toll: each Hammer of Wrath fires an extra one [db2 1266308: 30s, 3 stacks]
duration = 30
max_stacks = 3

# ---------------------------------------------------------------- player-cast abilities

[[abilities]]
name = "haste_procs"
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "haste_procs" }]

[[abilities]]
name = "avenging_wrath"
spell_id = 31884
gcd = 0                     # [obs] cast alongside a GCD ability
cooldown = 60               # [obs] 60.3s interval; db2 base 120s -> talented
on_cast = [
  { type = "buff", buff = "avenging_wrath" },
  { type = "buff", buff = "empyrean_legacy" },
  { type = "gain", resource = "holy_power", amount = 2 },     # Walk into Light [obs]
]

[[abilities]]
name = "execution_sentence_cast"
spell_id = 343527
gcd = 0.75                  # [db2]
cooldown = 60               # [db2]
on_cast = [
  { type = "buff", buff = "execution_sentence" },
  { type = "trigger", ability = "execution_sentence_init" },
  { type = "trigger", ability = "execution_sentence", delay = 10.0 },   # [db2 1260251: 10s]
]

[[abilities]]
name = "wake_of_ashes"
spell_id = 255937
cooldown = 30               # [db2]
gain = { holy_power = 3 }   # [obs]
damage = { ap_coeff = 1.743, school = "holyfire", mastery = true }   # [db2 205273]
on_cast = [
  { type = "buff", buff = "dawnlight", stacks = 3 },        # [obs]
  { type = "buff", buff = "divine_purpose" },               # [obs] every Wake
  { type = "trigger", ability = "truths_wake_apply" },
  { type = "trigger", ability = "seething_flames_0", delay = 0.5 },   # [obs]
  { type = "trigger", ability = "seething_flames_1", delay = 1.0 },
]

[[abilities]]
name = "divine_toll"
spell_id = 375576
cooldown = 60               # [db2]
on_cast = [
  { type = "trigger", ability = "hammer_of_wrath_divine_toll" },
  { type = "buff", buff = "divine_resonance", stacks = 3 },
]

[[abilities]]
name = "final_verdict"
spell_id = 383328
cost = { holy_power = 3 }   # [db2]
free_with = "divine_purpose"
damage = { ap_coeff = 4.65069, school = "holy", mastery = true }    # [db2 383328]
on_cast = [
  { type = "extend_dot", dot = "dawnlight", seconds = 0.3 },   # [obs] every spender
  { type = "trigger", ability = "dawnlight_apply" },
  { type = "trigger", ability = "divine_storm" },           # only if Empyrean Legacy is up
  { type = "buff", buff = "divine_purpose", chance = 0.09 },  # [obs] ~15 extra procs / 160 casts
]

[[abilities]]
name = "hammer_of_wrath"
spell_id = 24275
requires_buff = "avenging_wrath"     # [obs] only cast inside AW
cooldown = 7.5                       # [db2] recharge 7.5s (sped up by Avenging Wrath, see buff)
cooldown_hasted = true
charges = 2                          # [obs] ~34 casts per 5 AW windows = 2 charges at 7.5s hasted
gain = { holy_power = 1 }            # [obs]
damage = { ap_coeff = 2.15807, school = "holy", mastery = true }    # [db2 24275]
on_cast = [
  { type = "trigger", ability = "blade_of_justice_walk_into_light" },   # [obs] same timestamp
  { type = "trigger", ability = "hammer_of_wrath_divine_resonance" },
  { type = "trigger", ability = "hammer_of_wrath_second_sunrise", chance = 0.20, delay = 0.325 },  # [obs]
]
on_crit = [{ type = "trigger", ability = "sun_sear_apply" }]

[[abilities]]
name = "blade_of_justice"
spell_id = 184575
cooldown = 12               # [db2]
cooldown_hasted = true
gain = { holy_power = 2 }   # [db2 effect 30]
damage = { ap_coeff = 1.92877, school = "holy", mastery = true }    # [db2 184575]
on_cast = [
  { type = "consume", buff = "art_of_war" },
  { type = "trigger", ability = "expurgation_apply" },
  { type = "trigger", ability = "light_within_boj", chance = 0.52 },          # [obs] 16.0 / 30.8
  { type = "trigger", ability = "consecration_apply", chance = 0.75 },        # [obs] 23.2 / 30.8
]

[[abilities]]
name = "judgment"
spell_id = 20271
cooldown = 9.5              # [obs] 2 charges (casts 1.2s apart), ~7s cadence outside AW; db2 base 11s/1 charge -> talented
cooldown_hasted = true
charges = 2
gain = { holy_power = 1 }   # [obs]
damage = { ap_coeff = 1.256, school = "holy", mastery = true }     # [db2 sp 1.00739 x 1.247]
on_cast = [
  { type = "trigger", ability = "highlords_judgment", mastery_chance = 0.85 },   # [obs] ~43% at 50% mastery
]

