# Windwalker Monk — Shado-Pan, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Monk_Windwalker.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_monk.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, the level-90 spell scaling of
# each spell) live in a separate calibration file produced by tools/calibrate.py
# — not hand-tuned here.
#
# The spec runs on energy (10/s, hasted) and chi (6) on a flat 1.0s global
# cooldown (SimC's log: every global exactly 1.00s apart at 29% haste). Tiger
# Palm builds chi and Combo Breaker; Blackout Kick spends one chi (none inside
# Zenith), cuts Rising Sun Kick and Fists of Fury (Sharp Reflexes) and cashes
# in Teachings of the Monastery stacks as extra kicks. Rising Sun Kick crits
# take 4s off Fists of Fury (Xuen's Battlegear), as do Glory of the Dawn's
# crits. With Combo Breaker up a Blackout Kick can reset the kick and arm
# Rushing Wind Kick, which is cast on its own 10s cooldown. Zenith is the
# 2-charge cooldown; each cast stomps once and opens a 15s window of cheaper
# chi. Shado-Pan: auto attacks and Dual Threat store Flurry Charges that Fists
# of Fury cashes as Flurry Strikes, kicks flush Wisdom of the Wall in Zenith,
# and Stand Ready adds ten strikes to each Zenith.

name = "Windwalker Monk (Shado-Pan, core kit)"

[player]
# Final stats = SimC's buffed snapshot (core kit) [obs].
attack_power = 2682         # [obs] buffed attack power
# [obs] the weapon's share of ability damage: +200 agility (+229 AP) gives
# +6.1% to every source, so ability damage scales with 2682 + 1072.
weapon_attack_power = 1072
crit = 0.2748               # [obs] 27.48% buffed
haste = 0.2944              # [obs] 29.44% buffed
versatility = 0.0528        # [obs] 5.28% buffed
mastery = 0.8778            # [obs] Combo Strikes, 87.78% buffed
crit_multiplier = 2.0       # [obs] +500 crit rating gives +8.50% (27.5% -> 38.3%)
# [db2] two-handed polearm, 3.6s. Martial Agility adds a flat 30% auto-attack
# speed [simc 1272685 #1], folded in: 3.6 / 1.3 = 2.77s, less a little for the
# swing count the reference reports (207 a fight).
weapon = { min = 0, max = 0, speed = 2.60 }

# Gear -> stats (docs/gear.md): SimC's MID2 sample Windwalker profile without
# trinkets (core kit). Every item level and rating matches SimC
# (tools/check_gear.py) and the buffed stats land on the [player] snapshot.
[gear]
primary = "agility"
base_primary = 622            # [obs] level-90 troll monk base agility (SimC gear_agility=0 gives 679 = 622 x 1.092)
primary_mult = 1.092          # [obs] SimC gear_agility probe: +1000 gives +1092 agility (leather specialization etc.)
attack_power_mult = 1.05      # [obs] Battle Shout: 2555 agility -> 2682 attack power (2555 with optimal_raid=0)
crit_bonus = 0.14             # [obs] 27.48% at 620 rating = 13.48% from rating + 14%
haste_mult = 1.05             # [obs] 29.44% at 1024 rating (23.27%): x1.05, multiplicative with rating haste
mastery_points = 10           # [obs] 8 base + 2 Skyfury (SimC unbuffed 83.13%, buffed 87.78%)
mastery_coeff = 2.32875       # [obs] Combo Strikes, % per mastery point: 87.78% at 37.70 points
versatility_bonus = 0.03      # [obs] Mark of the Wild
weapon_ap_per_dps = 6.8809    # [obs] weapon_attack_power 1072 at 155.80 two-hander DPS
spec_id = 269                 # [db2] ChrSpecialization Windwalker

# Omnium traits (omnium_talents= in the profile; docs/gear.md#omnium-traits). The
# calibration reference has these on, so their worth is inside the fitted
# multipliers; a character with fewer gets it taken back out, trait by trait.
# tools/omnium.py ablate at 20,000 iterations: core kit 169,345 with all, 164,187 with
# none, +3.14%. Each value is the leave-one-out ratio, rescaled so the product
# is exactly all / none.
[gear.omnium]
baseline = ["136822", "136819", "136817", "136815", "136814"]
traits = [
  { id = "136822", name = "Rune of Unleashed Fire", global_mult = 1.01651 },   # [simc] leave-one-out 1.03171
  { id = "136819", name = "Rune of Self-Mending", global_mult = 1.00015 },   # [simc] leave-one-out 1.00028
  { id = "136817", name = "Rune of Lingering", global_mult = 1.00120 },   # [simc] leave-one-out 1.00229
  { id = "136815", name = "Rune of Critical Power", global_mult = 1.01150 },   # [simc] leave-one-out 1.02203
  { id = "136814", name = "Rune of Overload", global_mult = 1.00179 },   # [simc] leave-one-out 1.00341
]

# Raid-night kit, applied only with gear lines (`--set gear.kit.enabled=0`
# turns it off): SimC's default level-90 consumables for the sample profile
# plus Bloodlust, measured on its buffed stats. [simc]
[gear.kit]
enabled = 1
precombat = ["full_kit"]   # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, haste_rating = 181, crit_rating = 16 }
#   primary 75.1   Harandar Celebration 50 + Void-Touched augment rune 25.1 [obs: +54 and +27 agility, +86 attack power]
#   haste 165      Flask of the Blood Knights (rank 2) [obs: SimC buffed stats]
#   crit/haste 16  Thalassian Phoenix Oil (rank 2) on the two-hander [obs]

[fight]
duration = 300
variance = 0.2
idle_poll = 0.05            # [simc] the monk re-checks on energy/chi thresholds

[resources.energy]
max = 150                   # [db2] 100 + Ascension 20 + Inner Peace 30
start = 150
regen = 10                  # [db2] base 10, hasted [simc]
regen_hasted = true         # [obs: 68.6 Tiger Palms in 300s]

[resources.chi]
max = 6                     # [db2] 5 + Ascension [simc 115396 #1]
start = 2                   # [simc] Combat Wisdom sets 2 chi at the pull

[auto_attack]
replace_with = "mh_swing"
wakes = false               # [simc] a waiting monk re-checks on resources, not swings

# Combat Wisdom re-arms every 15s [simc 121817 #1], and the next Tiger Palm
# cashes it as an Expel Harm hit.
[[procs]]
ability = "combat_wisdom_proc"
per_minute = 4              # [simc] 15s period

# Dance of Chi-Ji: a chi spend can arm a free Spinning Crane Kick [simc 325201]
[[procs]]
ability = "dance_of_chiji_proc"
per_minute = 3.6            # [obs] 17.9 Spinning Crane Kicks armed a fight

# Rune of Unleashed Fire, main-hand enchant [obs]
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 9.9             # [obs] 49.5 procs a fight

