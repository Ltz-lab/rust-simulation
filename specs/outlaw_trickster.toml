# Outlaw Rogue — Trickster, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Rogue_Outlaw.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_rogue.cpp) or its APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# Outlaw runs on energy (10/s + Vigor 5/s, hasted) and combo points (7).
# Sinister Strike procs Opportunity (30%, +25% while Roll the Bones is up);
# Pistol Shot spends its charges with Fan the Hammer. Finishers (Between the
# Eyes, Killing Spree, Coup de Grace, Dispatch) feed Restless Blades, Cut to
# the Chase and Ruthlessness. Roll the Bones rolls one of four states.
# Trickster adds Unseen Blade (Fazed, Escalating Blade), Flawless Form and the
# Coup de Grace finisher.

name = "Outlaw Rogue (Trickster, core kit)"

# Stealth out of combat, Adrenaline Rush (which also feeds Improved
# Adrenaline Rush's full combo points, Loaded Dice and Supercharger), Slice
# and Dice and Roll the Bones [simc precombat APL].
precombat = ["outlaw_precombat"]

[player]
# Snapshot from the core-kit reference (reference/outlaw_core_observations.json),
# with the in-fight value of the crit and haste procs folded in (see the
# gear-proc comments below).
attack_power = 3577      # [obs] SimC's in-fight average attack power: +200 agility moves DPS 5.87%, so damage scales on ~3,577 AP
spell_power = 433        # [obs] only the gear procs below use it
crit = 0.336             # [obs] SimC's in-fight base crit chance (snapshot 0.2739 + proc/raid buffs)
haste = 0.352            # [obs] 0.339 snapshot + Venomcursed Haste's average
versatility = 0.1902     # [obs]
mastery = 0.1426         # [obs] only Main Gauche scales with it
crit_multiplier = 2.13   # [obs] crit/non-crit of auto attacks and Instant Poison
# Main hand is a 2.6s one-hander (117.64 dps at ilvl 344, damage variance 0.6)
# [db2 item 268209, data/gamedata.json.gz].
weapon = { min = 214.1, max = 397.6, speed = 2.6 }
# Off hand is a 1.8s dagger [db2 item 275070]; its weapon damage is folded
# into auto_attack_oh's coefficient below (the engine rolls the main-hand
# weapon for off-hand-replacement abilities too).
off_hand = { min = 0, max = 0, speed = 1.8 }

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1          # [simc] rogue_t::available(): re-check at least every 100ms while pooling

[resources.energy]
max = 150                # [db2] 100 + Vigor's 50 (Adrenaline Rush's temporary +50 isn't modelled)
start = 100              # [obs] full out of combat
regen = 13.14            # [obs] SimC's Energy Regen gain: 17.6/s at 33.9% haste
regen_hasted = true      # [simc] DYNAMIC regeneration with haste in the regen caches

[resources.combo_points]
max = 7                  # [db2] 5 + Deeper Stratagem + Devious Stratagem
start = 1                # [obs] after the precombat SnD spends 7 and Ruthlessness returns 1

[auto_attack]
replace_with = "mh_swing"
off_hand_replace_with = "oh_swing"
wakes = false            # [simc] READY_TRIGGER: re-checks on resources and every 100ms, not on swings

# ---------------------------------------------------------------- procs
# Instant Poison: 30% per strike (white and yellow melee) [db2 315584].
[[procs]]
ability = "instant_poison"
on_hit = true
chance = 0.30

# Main Gauche: 30% of main-hand attacks [db2 76806]. Only the attacks that
# SimC marks procs_main_gauche.
[[procs]]
ability = "main_gauche"
on_hit = true
chance = 0.30
sources = ["auto_attack_mh", "sinister_strike", "sinister_strike_extra_attack", "dispatch", "killing_spree_mh", "unseen_blade", "coup_de_grace"]

# Unseen Blade fires from Sinister Strike, Pistol Shot and Ambush whenever its
# 20s lockout is down; Thousand Cuts (4.5 RPPM hasted on auto attacks) clears
# the lockout, which is what makes the observed rate [obs 67.1 hits a fight =
# 13.4/min]. Modelled as a flat Poisson rate; Disorienting Strikes' extra
# procs are inside that observed number.
[[procs]]
ability = "unseen_blade"
per_minute = 13.4

# Weapon and gear passives that remain in the core kit [obs rates]
[[procs]]
ability = "searing_lightwood"     # off-hand weapon proc, 45.8 hits a fight
per_minute = 9.17

[[procs]]
ability = "venomfang_apply"       # main-hand weapon dot, 38.1 applications a fight
per_minute = 7.62

[[procs]]
ability = "rune_of_unleashed_fire"  # ring/gem rune, 43.8 hits a fight
per_minute = 8.75

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "adrenaline_rush"    # [db2 13750: 15s]
duration = 15
resource_regen_pct = { energy = 75 }   # [db2 #1]
attack_speed_pct = 20                  # [db2 #2]
# Menacing Rush: Adrenaline Rush also grants +20% damage to its listed spells
# [db2 1256630 effects #1/#2 on 13750 effects #4/#5].
ability_pct = { dispatch = 20, killing_spree = 20, killing_spree_mh = 20, killing_spree_oh = 20, pistol_shot = 20, pistol_shot_fan_the_hammer = 20, sinister_strike = 20, between_the_eyes = 20, coup_de_grace = 20 }

[[buffs]]
name = "loaded_dice"        # [db2 256171: 45s] next Roll the Bones is one state higher
duration = 45

[[buffs]]
name = "slice_and_dice"     # [db2 315496: 6s] +50% attack speed, +10% Thousand Cuts
duration = 6
attack_speed_pct = 60
attack_speed_per_haste = 1  # Swift Slasher: plus your haste [db2 381988, simc]

[[buffs]]
name = "roll_the_bones"     # container buff [db2 1214909: 30s]
duration = 30

# Roll the Bones states: 30s. Dragon-Bone Dice raises the builder damage
# bonus from 15% to 20% and Jackpot's crit from 10% to 15% [db2 1259481].
[[buffs]]
name = "rtb1"               # One of a Kind: only the Opportunity proc bonus
duration = 30

[[buffs]]
name = "rtb2"               # Double Trouble: +20% Sinister Strike, +1 CP on SS
duration = 30
ability_pct = { sinister_strike = 20, sinister_strike_extra_attack = 20 }

[[buffs]]
name = "rtb3"               # Triple Threat: as rtb2
duration = 30
ability_pct = { sinister_strike = 20, sinister_strike_extra_attack = 20 }

[[buffs]]
name = "rtb4"               # Jackpot: as rtb3, +15% crit
duration = 30
ability_pct = { sinister_strike = 20, sinister_strike_extra_attack = 20 }
crit_pct = 15

[[buffs]]
name = "opportunity"        # [db2 195627: 12s, up to 6 charges]
duration = 12
max_stacks = 6
flat = true                 # bonuses apply once, stacks only count charges
ability_pct = { pistol_shot = 120, pistol_shot_fan_the_hammer = 120 }   # [db2 #2 + Quick Draw]

[[buffs]]
name = "zero_in"            # [db2 1259486: 20s, 20 stacks] +2% crit and +2% BtE damage per stack
duration = 20
max_stacks = 20
ability_crit_pct = { between_the_eyes = 2 }
ability_pct = { between_the_eyes = 2 }

[[buffs]]
name = "supercharge"        # [db2 470347] +3 effective CP each, consumed by finishers
duration = 1e9
max_stacks = 2

[[buffs]]
name = "between_the_eyes"   # [db2 315341: 2s per combo point, 16s at 7] +7% damage [db2 #2/#3 + Fast Action + Expert Duelist]
duration = 16
damage_pct = 7

[[buffs]]
name = "fazed"              # [db2 441224: 10s] +5% damage taken, +3% Hoodwink
duration = 10
damage_pct = 8

[[buffs]]
name = "escalating_blade"   # [db2 441786] 4 Unseen Blades arm Coup de Grace
duration = 1e9
max_stacks = 4

[[buffs]]
name = "flawless_form"      # [db2 441326: 12s, 5 stacks] +4% finisher damage per stack
duration = 12
max_stacks = 5
ability_pct = { dispatch = 4, between_the_eyes = 4, killing_spree = 4, killing_spree_mh = 4, killing_spree_oh = 4, coup_de_grace = 4 }

[[buffs]]
name = "gravedigger"        # [db2 1265935: 30s] next Between the Eyes costs no energy
duration = 30

[[buffs]]
name = "palmed_bullets"     # [db2 1265931: 30s, 10 stacks] 6 bullets load Gravedigger
duration = 30
max_stacks = 10

[[buffs]]
name = "deadly_precision"   # [db2 381542] +5% crit to combo-point generators
duration = 1e9
ability_crit_pct = { sinister_strike = 5, sinister_strike_extra_attack = 5, pistol_shot = 5, pistol_shot_fan_the_hammer = 5 }

[[buffs]]
name = "clever_combatant"   # [db2 1276679] Pistol Shot +20% crit
duration = 1e9
ability_crit_pct = { pistol_shot = 20, pistol_shot_fan_the_hammer = 20 }

[[buffs]]
name = "ks_cp"              # Killing Spree's snapshotted combo points (tick count)
duration = 30
max_stacks = 12

[[buffs]]
name = "cp_bonus"           # Coup de Grace counts as 5 more combo points [db2 441423 #3]
duration = 1
max_stacks = 12

