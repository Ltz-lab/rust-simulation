name = "restless_blades"
triggered_only = true
gcd = 0
on_cast = [
  { type = "reduce_cooldown", ability = "adrenaline_rush", seconds_expr = "(1+0.4*(buff.rtb3.up|buff.rtb4.up))*(spent.combo_points+3*buff.supercharge.up+buff.cp_bonus.stack)" },
  { type = "reduce_cooldown", ability = "between_the_eyes", seconds_expr = "(1+0.4*(buff.rtb3.up|buff.rtb4.up))*(spent.combo_points+3*buff.supercharge.up+buff.cp_bonus.stack)" },
  { type = "reduce_cooldown", ability = "killing_spree", seconds_expr = "(1+0.4*(buff.rtb3.up|buff.rtb4.up))*(spent.combo_points+3*buff.supercharge.up+buff.cp_bonus.stack)" },
  { type = "reduce_cooldown", ability = "keep_it_rolling", seconds_expr = "(1+0.4*(buff.rtb3.up|buff.rtb4.up))*(spent.combo_points+3*buff.supercharge.up+buff.cp_bonus.stack)" },
  { type = "reduce_cooldown", ability = "roll_the_bones", seconds_expr = "(1+0.4*(buff.rtb3.up|buff.rtb4.up))*(spent.combo_points+3*buff.supercharge.up+buff.cp_bonus.stack)" },
]

