# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Outlaw APL, single target, Trickster build.
# Blade Rush is in SimC's APL but never becomes usable in the reference sim,
# so it isn't used here either; Vanish/Ambush need Hidden Opportunity, which
# this build doesn't take.

[[rotation]]
action = "thistle_tea"
if = "energy<30"

[[rotation]]
action = "adrenaline_rush"
if = "!buff.adrenaline_rush.up"

[[rotation]]
action = "preparation"
if = "(cooldown.adrenaline_rush.remains>30&!cooldown.between_the_eyes.ready&!cooldown.killing_spree.ready)|fight_remains<=30"

[[rotation]]
action = "keep_it_rolling"
if = "buff.rtb3.up|buff.rtb4.up"

[[rotation]]
action = "roll_the_bones"
if = "!buff.roll_the_bones.up|(buff.rtb2.up&buff.loaded_dice.up)|(buff.rtb1.up&!buff.loaded_dice.up)"

# finish_condition = combo_points >= cp_max_spend - 1 = 6 [simc]
[[rotation]]
action = "between_the_eyes"
if = "combo_points>=6&!(buff.supercharge.stack=1&cooldown.killing_spree.ready)&energy>=(23.5+42.3*(buff.supercharge.up&cooldown.killing_spree.ready))"

[[rotation]]
action = "killing_spree"
if = "combo_points>=6&(buff.supercharge.up|cooldown.adrenaline_rush.remains>120)&energy>=43"

[[rotation]]
action = "coup_de_grace"
if = "combo_points>=6&buff.escalating_blade.stack>=4&energy>=33&!(cooldown.killing_spree.ready&buff.supercharge.up&energy<42.3)"

[[rotation]]
action = "dispatch"
if = "combo_points>=6&energy>=33&!(cooldown.killing_spree.ready&buff.supercharge.up&energy<42.3)"

# Fan the Hammer: spend at 6 charges or when they're about to expire [simc].
[[rotation]]
action = "pistol_shot"
if = "buff.opportunity.up&(buff.opportunity.stack>=6|buff.opportunity.remains<2)&(combo_points<6|energy>=23.5)&!(cooldown.killing_spree.ready&buff.supercharge.up&energy<42.3)"

# ... or early when it won't overcap combo points.
[[rotation]]
action = "pistol_shot"
if = "buff.opportunity.up&combo_points<=3&(combo_points>1|(!buff.rtb2.up&!buff.rtb3.up&!buff.rtb4.up))&(combo_points<6|energy>=23.5)&!(cooldown.killing_spree.ready&buff.supercharge.up&energy<42.3)"

[[rotation]]
action = "sinister_strike"
if = "energy>=45&(combo_points<6|energy>=23.5)&!(cooldown.killing_spree.ready&buff.supercharge.up&energy<42.3)"
