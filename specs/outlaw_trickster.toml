  { type = "consume", buff = "loaded_dice" },
  { type = "buff", buff = "roll_the_bones" },
]

# The state roll: base odds 55/30/10/5 [simc], Loaded Dice adds one state
# (2/3/4 at 44/35/21%), Sleight of Hand's 20% bump is folded into those.
[[abilities]]
name = "rtb_roll"
triggered_only = true
gcd = 0
on_cast = [
  { type = "if", if = "buff.loaded_dice.up", then = [
    { type = "trigger", ability = "rtb4", chance = 0.30 },
    { type = "if", if = "!buff.rtb4.up", then = [{ type = "trigger", ability = "rtb3", chance = 0.55 }] },
    { type = "if", if = "!buff.rtb2.up&!buff.rtb3.up&!buff.rtb4.up", then = [{ type = "trigger", ability = "rtb2" }] },
  ], else = [
    { type = "trigger", ability = "rtb4", chance = 0.12 },
    { type = "if", if = "!buff.rtb4.up", then = [{ type = "trigger", ability = "rtb3", chance = 0.35 }] },
    { type = "if", if = "!buff.rtb2.up&!buff.rtb3.up&!buff.rtb4.up", then = [{ type = "trigger", ability = "rtb2", chance = 0.45 }] },
    { type = "if", if = "!buff.rtb2.up&!buff.rtb3.up&!buff.rtb4.up", then = [{ type = "trigger", ability = "rtb1" }] },
  ] },
]

