# ---------------------------------------------------------------- rotation

# SimC cooldowns: the potion in Void Metamorphosis, or in the last 30s; only
# with [gear.kit] (the ability needs the kit's marker).
[[rotation]]
action = "potion"
if = "buff.metamorphosis.up|fight_remains<=30"

# SimC's default Void-Scarred APL, single target (apl/demon_hunter/devourer.simc).
# Vengeful Retreat is off the GCD; Voidblade is overridden by Pierce the Veil and
# The Hunt by Predator's Wake inside Void Metamorphosis. Both Voidblade/Pierce and
# Hungering Slash/Reaper's Toll are unavailable while the Hungering Slash buff is
# up, so a granted buff is always consumed before the next one.

[[rotation]]
action = "vengeful_retreat"
if = "buff.voidstep.up"

# --- Void Metamorphosis
# The first Void Ray of the window; its cooldown resets when the window opens.
[[rotation]]
action = "void_ray_meta"
if = "buff.metamorphosis.up"

[[rotation]]
action = "collapsing_star"
if = "buff.metamorphosis.up&buff.collapsing_star_stacks.stack>=30"

# Reaper's Toll: the empowered Hungering Slash, held until fragments are low.
[[rotation]]
action = "reapers_toll"
if = "buff.metamorphosis.up&buff.hungering_slash.up"

[[rotation]]
action = "voidblade_cast"
if = "buff.metamorphosis.up&!buff.hungering_slash.up"

[[rotation]]
action = "hunt_cast"
if = "buff.metamorphosis.up&!buff.hungering_slash.up"

[[rotation]]
action = "cull"
if = "buff.metamorphosis.up&soul_fragment>=4"

[[rotation]]
action = "soul_immolation"
if = "buff.metamorphosis.up&!dot.soul_immolation.ticking"

[[rotation]]
action = "devour"
if = "buff.metamorphosis.up"

# --- outside Void Metamorphosis
# Hunt entry: at max stacks The Hunt goes out (its buff carries onto the
# Hungering Slash/Reaper's Toll inside the window that opens next) [simc].
[[rotation]]
action = "hunt_cast"
if = "!buff.metamorphosis.up&buff.void_souls.stack>=35&cooldown.hunt_cast.ready&cooldown.voidblade_cast.ready"

[[rotation]]
action = "metamorphosis"
if = "buff.void_souls.stack>=35"

# Voidblade only right after a Void Ray, and only while the Hunt is on cooldown.
[[rotation]]
action = "voidblade_cast"
if = "!buff.metamorphosis.up&!buff.hungering_slash.up&prev_gcd.void_ray&!cooldown.hunt_cast.ready"

[[rotation]]
action = "reap"
if = "!buff.metamorphosis.up&fury<100&fury+4*soul_fragment>=100&soul_fragment>=1"

[[rotation]]
action = "hungering_slash"
if = "!buff.metamorphosis.up&buff.hungering_slash.up"

[[rotation]]
action = "reap"
if = "!buff.metamorphosis.up&soul_fragment>=4"

[[rotation]]
action = "void_ray"
if = "!buff.metamorphosis.up&fury>=100"

[[rotation]]
action = "soul_immolation"
if = "!buff.metamorphosis.up&!dot.soul_immolation.ticking"

[[rotation]]
action = "consume"
if = "!buff.metamorphosis.up"
