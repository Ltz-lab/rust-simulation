  { type = "gain", resource = "fury", amount = 8 },        # [db2 1223628] 4 per fragment collected
  { type = "buff", buff = "void_souls", set = "buff.void_souls.stack+2" },
]

# Reap and Cull share an 8s cooldown with two charges (Second Helping) and the
# recharge is hasted (Umbral Blade) [db2 1239537, 1272842]. A Void Ray's last
# tick gives one charge back (Reap's outside, Cull's inside Metamorphosis) and
# Devour knocks a second off the Cull recharge [simc].
[[abilities]]
name = "reap"
spell_id = 1226019
cooldown = 16               # [db2] Reap and Cull share one 8s, 2-charge pool; the engine
cooldown_hasted = true      # [db2 1272842 Umbral Blade] has per-ability cooldowns, so each
charges = 2                 # [db2 1239537 Second Helping] side gets half the throughput
gcd = 1.24                  # [obs] 1.027s at 20.86% haste (SimC's double-hasted GCD)
cost = { soul_fragment = 4 }
damage = { sp_coeff = 6.0156, school = "cosmic", mastery = true, mastery_scale = 1.2 }   # [db2]
source = "reap_damage"
on_cast = [
  { type = "buff", buff = "void_souls", set = "buff.void_souls.stack+spent.soul_fragment" },
  # Moment of Craving: the Reap eats up to 6 more souls [db2 1238495]
  { type = "if", if = "buff.moment_of_craving.up", then = [
    { type = "buff", buff = "void_souls", set = "buff.void_souls.stack+6" },
    { type = "consume", buff = "moment_of_craving", all = true },
  ] },
]

