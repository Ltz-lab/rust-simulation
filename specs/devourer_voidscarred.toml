# Devourer Demon Hunter — Void-Scarred, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Demon_Hunter_Devourer.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (SimC spell_query on build 12.1.5.70575)
#   [obs]  SimC's own combat log and reference/devourer_*.json
#   [simc] read from sc_demon_hunter.cpp or its default APL
# Damage coefficients are spell-power coefficients from SpellEffect.
# Residual damage multipliers (the spec's +38%, Feast of Souls, Devourer's Bite,
# Rolling Torment, Voidsurge...) live in calibration/, not here.
#
# The spec runs on fury (140) and soul fragments (10). About a quarter of the
# direct hits shatter a fragment (Shattered Souls + Sweet Release [simc]);
# Consume/Devour add two and Soul Immolation one every other tick. Reap and
# Cull eat up to 4 fragments (10 while Moment of Craving is up), each giving one
# Void Metamorphosis stack (outside Meta) or one Collapsing Star stack (inside).
# 35 stacks open Void Metamorphosis, which drains fury and ends at 0 (modelled
# as a fixed 25s window [obs]); inside it Consume becomes Devour, Reap becomes Cull,
# Voidblade becomes Pierce the Veil and Hungering Slash becomes Reaper's Toll.
# 30 Collapsing Star stacks open Collapsing Star.

name = "Devourer Demon Hunter (Void-Scarred, core kit)"

# [obs] Entropy starts the pull with 25 soul-fragment stacks; the pull also
# opens with Soul Immolation and one Consume.
precombat = ["entropy", "soul_immolation", "consume"]

[player]
spell_power = 3969       # [obs] buffed snapshot
# Observed in-fight crit is 26.8% against the 22.3% snapshot: the gear procs
# (Venomcursed Critical Strike etc.) are folded in as their time average.
crit = 0.268             # [obs]
haste = 0.2086           # [obs] 20.86% (Consume casts land 1.448s apart)
mastery = 0.4437         # [obs] Mastery: Monster Within
versatility = 0.0528     # [obs]
crit_multiplier = 2.52   # [obs] Calamitous: crits hit for 240% plus gear

[gear]
spec_id = 1480                # [db2] ChrSpecialization: picks the class set bonuses
primary = "intellect"
base_primary = 622            # [obs] level-90 void elf base intellect (naked SimC character: 704 buffed)
primary_mult = 1.18965        # [obs] x1.05 matching gear x1.03 Arcane Intellect x1.10 talent (buffed 3969; +200 int probe 4207)
spell_power_per_primary = 1.0 # [obs] spell power = buffed intellect (3969)
crit_bonus = 0.07             # [obs] 22.30% at 704 rating = 15.30% from rating + 7%
haste_mult = 1.0              # [obs] 20.86% at 918 rating, from rating alone
mastery_points = 16.2         # [obs] incl. 2 Skyfury, in mastery points (44.37% at 28.17 points from rating)
mastery_coeff = 1.0           # [obs] Mastery: Monster Within, +1% per point; +500 probe gives +9.97 points
versatility_bonus = 0.03      # [obs] Mark of the Wild

# Raid-night kit with gear lines (see Ret): SimC's default level-90 Devourer
# consumables plus Bloodlust. --set gear.kit.enabled=0 for core-kit runs.
[gear.kit]
enabled = 1
precombat = ["full_kit"]   # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, mastery_rating = 165, crit_rating = 16, haste_rating = 16 }
#   primary 50     Blooming Feast [obs]
#   primary 25.1   Void-Touched augment rune [db2 1264426]
#   mastery 165    Flask of the Magisters (rank 2) [obs: SimC buffed stats]
#   crit/haste 16  Thalassian Phoenix Oil (rank 2) on the main hand [obs]
primary_buffs = { lights_potential = 695 }   # primary stat potion [db2 1236616, item-level scaled]

# The time-averaged gear stat procs folded into [player] above, so --gear
# lands on the same final stats. They belong to this gear set; other gear
# keeps the same averages.
[gear.procs]
crit = 0.045

[fight]
duration = 300
variance = 0.2

[resources.fury]
max = 140                # [obs] log: 140 cap
start = 0

[resources.soul_fragment]
max = 10                 # [simc] DEVOURER_MAX_SOUL_FRAGMENTS
start = 0

# Random gear procs, as Poisson rates [obs]
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 7.78

# Shattered Souls: every direct hit has a chance to shatter a fragment [simc]
[[procs]]
ability = "shatter_soul"
on_hit = true
chance = 0.25
sources = ["consume", "devour", "reap_damage", "cull_damage", "voidblade_damage", "hungering_slash_damage", "pierce_the_veil_damage", "reapers_toll_damage", "collapsing_star_damage", "predators_wake_damage", "the_hunt_damage", "voidstep", "voidsurge", "void_ray_tick", "void_ray_tick_meta"]
on_tick = true

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "void_souls"          # Void Metamorphosis stacks: 35 opens Meta [db2 1225789]
duration = 1e9
max_stacks = 35
flat = true

[[buffs]]
name = "metamorphosis"       # [obs] 25.18s average window (200 starting Fury drained to 0)
duration = 25
# [db2 1217607 #4] +0.4 x mastery (44.37% x 1.2 Enduring Torment) = +21.3%
damage_pct = 21.3
# [simc] Metamorphosis ends at 0 Fury: the drain eats everything gained in the
# window, and the Void Ray cooldown resets when it ends. Rolling Torment then
# pays 5 Fury per leftover Collapsing Star stack [db2 1244235].
on_expire = [
  { type = "gain", resource = "fury", amount_expr = "-fury" },
  { type = "gain", resource = "fury", amount_expr = "5*buff.collapsing_star_stacks.stack" },
  { type = "reset_cooldown", ability = "void_ray" },
]

[[buffs]]
name = "hungering_slash"     # [db2 1239525: 6s] Hungering Slash / Reaper's Toll available
duration = 6

[[buffs]]
name = "voidstep"            # [db2 1223157] a Vengeful Retreat charge
duration = 15
max_stacks = 5
flat = true

[[buffs]]
name = "vengeful_retreat_move"   # [simc] the leap window The Hunt needs
duration = 3

[[buffs]]
name = "voidsurge"           # [db2 1246160 #2] +10% damage per stack, 12s, 8 stacks
duration = 12
max_stacks = 8
damage_pct = 10

[[buffs]]
name = "collapsing_star_stacks"   # [simc] 30 stacks open Collapsing Star
duration = 1e9
max_stacks = 30
flat = true

[[buffs]]
name = "collapsing_star"     # [db2 1221171: 3s] Collapsing Star window
duration = 3

[[buffs]]
name = "moment_of_craving"   # [db2 1238495: 8s] Reap/Cull shatter 10 souls
duration = 8

# One Voidsurge per ability per Metamorphosis [simc]
[[buffs]]
name = "vs_reapers"
duration = 25

[[buffs]]
name = "vs_pierce"
duration = 25

[[buffs]]
name = "vs_wake"
duration = 25

[[buffs]]
name = "volatile_instinct"   # [db2 1272462] the next Voidsurge repeats
duration = 10

[[buffs]]
name = "full_kit"            # [simc] marker: consumables and Bloodlust are in play (see [gear.kit])
duration = 1e9

[[buffs]]
name = "bloodlust"           # [db2 2825: +30% haste, 40s]
duration = 40
haste_pct = 30

[[buffs]]
name = "lights_potential"    # potion: +695 intellect for 30s [db2 1236616]
duration = 30
power_pct = 0                # [simc] computed from the gear's spell power

