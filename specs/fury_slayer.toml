# Fury Warrior — Slayer, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Warrior_Fury.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_warrior.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# Fury dual-wields two two-handers. Every attack is a constant weapon damage
# (`damage.amount`: 606.2 main hand, 268.5 off hand after the off-hand
# penalty) plus an attack-power coefficient; off-hand hits deal half, so their
# coefficient and amount are halved. Rage comes from auto attacks (7.6 main
# hand, 3.8 off hand), Bloodthirst/Bloodbath (+8), Raging Blow (+12, 18 for
# Crushing Blow), Execute (+25, it costs nothing with Improved Execute),
# Bladestorm strikes (+5), Cold Steel, Hot Blood (+4) and Odyn's Fury (+20);
# everything sourced from damage gains 50% more while Reckless, so each reads
# x1.5 there. Rampage spends 80 (50 while Reckless) and Whirlwind 20. Every 20
# rage spent takes a second off Recklessness (Anger Management), so the 90s
# cooldown comes back about every 40s. Enrage (+15% haste, refreshed by
# Bloodthirst/Bloodbath and every Rampage, 99% uptime) and Unshackled Fury
# turn mastery into damage while enraged, so every source takes mastery.
# Recklessness (+20% crit, 18s) swaps Raging Blow for Crushing Blow and
# Bloodthirst for Bloodbath. Slayer: special attacks proc Slayer's Strike
# (stacking Executioner), every 3rd one grants Sudden Death; Sudden Death
# Executes fire Reap the Storm and stack Imminent Demise (extra Bladestorm
# strikes). Bladestorm's strikes auto-cast Bloodthirst (Unhinged) and it ends
# with Brutal Finish (+50% Rampage) and Violent Euphoria (+15% haste).

name = "Fury Warrior (Slayer, core kit)"

# Charge at the pull (+20 rage) and the always-on stance
precombat = ["berserker_stance", "charge", "gear_haste_procs", "surge_average"]

[player]
# Final stats = SimC's buffed snapshot [obs]. Crit is the rate abilities
# actually crit at in the log (29-30%), not the raw sheet number (24.96%).
attack_power = 3225      # [obs] 2982 strength x 1.0815 (Battle Shout x Skyfury)
crit = 0.30              # [obs] auto attacks and never-Recklessness abilities crit 30.0%
haste = 0.2831           # [obs] buffed
versatility = 0.0785     # [obs] buffed
mastery = 0.4498         # [db2 76856] Unshackled Fury: +45% damage while enraged (99% uptime)
crit_multiplier = 2.135  # [obs] SimC's "Crit Dmg Mult: 1.0676" x2
# Two two-handers, 3.6s each [db2]; the weapon's own damage rides in `amount`.
weapon = { min = 0, max = 0, speed = 3.6 }
off_hand = { min = 0, max = 0, speed = 3.6 }

# How `--gear profile.simc` turns gear into the [player] stats above (see
# docs/gear.md). All [obs] from SimC's reported stats unless tagged.
[gear]
primary = "strength"
base_primary = 937            # [obs] 2982 buffed / 1.05 less the core kit's 1903 strength from gear
primary_mult = 1.05           # [obs] plate specialization (the +200 strength probe gives +227 AP)
attack_power_mult = 1.0815    # [obs] 2982 strength -> 3225 AP: Battle Shout x1.05 and Skyfury x1.03
crit_bonus = 0.124            # [obs] the sheet says 24.96% at 826 rating but abilities crit 30%: Cruel Strikes +2% and an unmodelled ~3%
haste_mult = 1.02             # [obs] Wild Strikes 2/2 [db2 382946 #0]
mastery_points = 10           # [obs] 8 base + 2 Skyfury, in mastery points
mastery_coeff = 1.4           # [db2 76856] Unshackled Fury, % per mastery point
versatility_bonus = 0.03      # [obs] Mark of the Wild
spec_id = 72                  # [db2] ChrSpecialization

# Raid-night kit with gear lines (see Ret): SimC's default level-90 Fury
# consumables plus Bloodlust. --set gear.kit.enabled=0 for core-kit runs.
[gear.kit]
enabled = 1
precombat = ["full_kit"]      # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, mastery_rating = 165, crit_rating = 32, haste_rating = 32 }   # [simc] SimC default consumables, measured on the sample profile: Flask of the Magisters (mastery 165) + oil 16/16 on each weapon
#   primary 50     Harandar Celebration [obs: +57 AP]
#   primary 25.1   Void-Touched augment rune [db2 1264426; obs +29 AP]
#   haste 165      Flask of the Magisters (rank 2) [obs: SimC buffed stats]
#   crit/haste 16  Thalassian Phoenix Oil (rank 2) on the main hand [obs]
primary_buffs = { lights_potential = 695 }   # Light's Potential (rank 2) [db2 1236616, item-level scaled]

[fight]
duration = 300
variance = 0.2
ready_tolerance = 1e-5   # Raging Blow's hasted 8s and Bloodthirst's 4.5s sit on GCD boundaries

[resources.rage]
max = 130                # [db2] 100 + Overwhelming Rage 30 [db2 382767]
start = 0

[auto_attack]
replace_with = "auto_attack_mh"
off_hand_replace_with = "auto_attack_oh"

# Skyfury raid buff: 20% to repeat the swing, rolled per hand [obs: SimC's
# 40.3 main-hand and 32.3 off-hand procs a fight]
[[procs]]
ability = "skyfury_mh"
on_hit = true
chance = 0.20
sources = ["auto_attack_mh"]

[[procs]]
ability = "skyfury_oh"
on_hit = true
chance = 0.20
sources = ["auto_attack_oh"]

# Sudden Death: real PPM 1.7, hasted, 3s internal cooldown [db2 29725], rolled
# on the player's special attacks like SimC's warrior_action_t::execute
[[procs]]
ability = "sudden_death_proc"
on_hit = true
per_minute = 1.7
hasted = true
icd = 3.0
sources = ["bloodthirst", "raging_blow_mh", "crushing_blow_mh", "execute_mainhand", "rampage1", "whirlwind_mh_first"]

# Random gear procs (neck/ring embellishments, rune), as Poisson rates [obs]
[[procs]]
ability = "venomfang_proc"
per_minute = 5.65        # hasted RPPM: 7.6/min observed at 1.3565 haste
hasted = true

[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 10.08       # [obs] 50.4 a fight

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "full_kit"           # marker: consumables and Bloodlust are in play (see [gear.kit])
duration = 1e9

[[buffs]]
name = "bloodlust"          # [db2 2825: +30% haste, 40s]
duration = 40
haste_pct = 30

[[buffs]]
name = "lights_potential"   # potion: +695 strength for 30s [db2 1236616]
duration = 30
power_pct = 16.6            # as a share of attack power; [gear.kit] recomputes it from the gear

[[buffs]]
name = "gear_haste_procs"   # time-averaged haste from gear procs [obs]
duration = 1e9
haste_pct = 2.26

[[buffs]]
name = "berserker_stance"   # [db2 386196: 15% auto-attack damage], Stance Mastery +3% attack speed
duration = 1e9
ability_pct = { auto_attack_mh = 15, auto_attack_oh = 15 }
attack_speed_pct = 3

[[buffs]]
name = "enrage"             # [db2 184362: 4s, +15% haste]; Unshackled Fury's damage is the mastery flag
duration = 4
haste_pct = 15

[[buffs]]
name = "recklessness"       # [db2 1719: 18s (12s x 1.5 Rampaging Berserker), 90s cd]
duration = 18
# +20% critical chance to the spells Recklessness lists [db2 1719 #4]; auto
# attacks and Odyn's Fury are not on that list (they crit 30% in the log)
ability_crit_pct = { rampage1 = 20, rampage2 = 20, rampage3 = 20, rampage4 = 20, raging_blow_mh = 20, raging_blow_oh = 20, crushing_blow_mh = 20, crushing_blow_oh = 20, bladestorm_mh = 20, bladestorm_oh = 20, execute_mainhand = 20, execute_offhand = 20, slayers_strike = 20, reap_the_storm_execute = 20, bloodthirst = 20, bloodbath = 20, bloodthirst_bladestorm_unhinged = 20, bloodbath_bladestorm_unhinged = 20, whirlwind_mh_first = 20, whirlwind_mh_others = 20, whirlwind_oh_first = 20, whirlwind_oh_others = 20, deep_wounds = 20, bloodbath_dot = 20, gushing_wound = 20, rend_dot = 20, storm_bolt = 20 }

[[buffs]]
name = "sudden_death"       # Execute usable at any health, free [db2 52437: 12s, 2 stacks]
duration = 12
max_stacks = 2

[[buffs]]
name = "hack_and_slash"     # Rampage's first hit: Raging Blow +20% and a reset; spent by it [db2 383873: 8s]
duration = 8
ability_pct = { raging_blow_mh = 20, raging_blow_oh = 20, crushing_blow_mh = 20, crushing_blow_oh = 20 }

[[buffs]]
name = "opportunist"        # Raging Blow reset: +10% and +10% crit damage per stack [db2 456120: 8s, 2]
duration = 8
max_stacks = 2
ability_pct = { raging_blow_mh = 10, raging_blow_oh = 10, crushing_blow_mh = 10, crushing_blow_oh = 10 }
crit_damage_pct = 10

[[buffs]]
name = "executioner"        # Slayer's Strike: +3% Execute damage, +3% crit and crit damage per stack
duration = 12               # [db2 445584: 12s, 5 stacks, asynchronous]
max_stacks = 5
overlap = true
ability_pct = { execute_mainhand = 3, execute_offhand = 3 }
ability_crit_pct = { execute_mainhand = 3, execute_offhand = 3 }
crit_damage_pct = 3

[[buffs]]
name = "imminent_demise"    # Sudden Death Executes: +1 Bladestorm strike each [db2 445606: 60s, 3 stacks]
duration = 60
max_stacks = 3

[[buffs]]
name = "ss_counter"         # Imminent Demise: every 3rd Slayer's Strike grants Sudden Death [db2 444769 #0]
duration = 1e9
max_stacks = 3

[[buffs]]
name = "executioners_wrath" # Execute: +10% Rampage damage for 4s [db2 1265575]
duration = 4
ability_pct = { rampage1 = 10, rampage2 = 10, rampage3 = 10, rampage4 = 10 }

[[buffs]]
name = "bloodborne"         # Bloodthirst: +20% bleed damage for 8s [db2 1265406]
duration = 8
ability_pct = { bloodbath_dot = 20, deep_wounds = 20, gushing_wound = 20, odyns_fury_mh = 20, rend_dot = 20 }

[[buffs]]
name = "brutal_finish"      # Bladestorm ends: +50% Rampage damage for 10s [db2 446918]
duration = 10
ability_pct = { rampage1 = 50, rampage2 = 50, rampage3 = 50, rampage4 = 50 }

[[buffs]]
name = "berserk"            # Rampage (Rampaging Berserker): +3% strength per stack, 12s, 10 stacks
duration = 12               # [db2 1269349: 8s x 1.5 Rampaging Berserker 1269310]
max_stacks = 10
overlap = true              # each stack expires on its own timer [simc: ASYNCHRONOUS]
power_pct = 3

[[buffs]]
name = "frenzy"             # Rampage's 4th hit: +2% haste per stack, 12s, 10 stacks [db2 335082/335077]
duration = 12
max_stacks = 10
overlap = true              # each stack expires on its own timer [simc: ASYNCHRONOUS]
haste_pct = 2

[[buffs]]
name = "surge_of_adrenaline"   # Raging Blow resets itself: +30% auto-attack speed and damage, 6s
duration = 1e9                 # [db2 1265560], folded in at its observed 57.5% uptime: +17.25%
attack_speed_pct = 17.25       # (the resets cluster, so a re-triggered 6s buff would run near 100%)
ability_pct = { auto_attack_mh = 17.25, auto_attack_oh = 17.25 }

[[buffs]]
name = "wild_strikes"       # auto crit: +20% attack speed (2 ranks) [db2 392778: 10s]
duration = 10
attack_speed_pct = 20

[[buffs]]
name = "violent_euphoria"   # Bladestorm ends: +15% haste [db2 1270731: 8s]
duration = 8
haste_pct = 15

[[buffs]]
name = "overwhelmed"        # Reap the Storm/Bladestorm: +1% damage taken per stack [db2 445836: 20s, 5]
duration = 20
max_stacks = 5
ability_pct = { bladestorm_mh = 1, bladestorm_oh = 1, rampage1 = 1, rampage2 = 1, rampage3 = 1, rampage4 = 1, raging_blow_mh = 1, raging_blow_oh = 1, crushing_blow_mh = 1, crushing_blow_oh = 1, execute_mainhand = 1, execute_offhand = 1, bloodthirst = 1, bloodbath = 1, odyns_fury_mh = 1, odyns_fury_oh = 1, slayers_strike = 1, reap_the_storm_execute = 1, auto_attack_mh = 1, auto_attack_oh = 1, deep_wounds = 1, bloodbath_dot = 1, gushing_wound = 1, rend_dot = 1 }

[[buffs]]
name = "bs_odd"             # Bladestorm tick parity: Unhinged on odd ticks [simc bladestorm_t::tick]
duration = 1e9

# ---------------------------------------------------------------- opener

[[abilities]]
name = "full_kit"
gcd = 0
triggered_only = true
on_cast = [
  { type = "buff", buff = "full_kit" },
  { type = "buff", buff = "bloodlust" },
]

[[abilities]]
name = "potion"
spell_id = 1236616
gcd = 0
cooldown = 300              # [db2]
requires_buff = "full_kit"
on_cast = [{ type = "buff", buff = "lights_potential" }]

[[abilities]]
name = "surge_average"      # Surge of Adrenaline folded in at its 57.5% uptime
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "surge_of_adrenaline", duration = 1e9 }]

[[abilities]]
name = "gear_haste_procs"
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "gear_haste_procs" }]

[[abilities]]
name = "berserker_stance"
spell_id = 386196
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "berserker_stance" }]

[[abilities]]
name = "charge"
spell_id = 100
gcd = 0
triggered_only = true
gain = { rage = 20 }        # [obs] charge_impact
on_cast = [{ type = "trigger", ability = "charge_impact" }]

[[abilities]]
name = "charge_impact"      # [db2 126664: 0.21 AP]
triggered_only = true
gcd = 0
damage = { ap_coeff = 0.21, amount = 606.2, mastery = true }

# ---------------------------------------------------------------- cooldowns

[[abilities]]
name = "recklessness"
spell_id = 1719
gcd = 0                     # [db2] off the GCD
cooldown = 90               # [db2], cut by Anger Management
gain = { rage = 50 }        # [db2 396749 #1] Reckless Abandon: 50 rage on activation
on_cast = [{ type = "buff", buff = "recklessness" }]

[[abilities]]
name = "rage_spent"         # Anger Management: 1s off Recklessness per 20 rage [db2 152278 #2]
triggered_only = true
gcd = 0
on_cast = [{ type = "reduce_cooldown", ability = "recklessness", seconds_expr = "spent.rage/20" }]

# Odyn's Fury: two main-hand and two off-hand hits, plus a 4s 1s-period bleed
# on the main-hand spell [db2 385059, 385060]. Enrages.
[[abilities]]
name = "odyns_fury"
spell_id = 385059
cooldown = 45               # [db2]
gain = { rage = 20 }        # [db2 385059 #4]
on_cast = [
  { type = "buff", buff = "enrage" },
  { type = "trigger", ability = "odyns_fury_mh" },
  { type = "trigger", ability = "odyns_fury_oh" },
]

[[abilities]]
name = "odyns_fury_mh"
spell_id = 385060
triggered_only = true
gcd = 0
damage = { ap_coeff = 1.82598, amount = 606.2, mastery = true, hits = 2 }   # [db2 385060/385062]
[abilities.dot]
name = "odyns_fury_mh"     # [db2 385060 #1: 1s period, 4s, 1.3 AP]; reported with the hits, as SimC does
ap_coeff = 1.3
tick_time = 1.0
duration = 4.0
mastery = true
hasted = false

[[abilities]]
name = "odyns_fury_oh"
spell_id = 385061
triggered_only = true
gcd = 0
damage = { ap_coeff = 0.91299, amount = 268.48, mastery = true, hits = 2 }   # [db2] x0.5 off hand

# Bladestorm: 90s cooldown, a strike every 1s (hasted) for 4s (the 6s spell
# less Fury Warrior's -2s), squeezed by Imminent Demise's extra strikes
# [db2 446035, 137050 #8]. SimC's isn't channelled — Storm Bolt fits inside.
[[abilities]]
name = "bladestorm"
spell_id = 446035
cooldown = 90               # [db2]
on_start = [{ type = "buff", buff = "bs_odd" }]   # the initial strike is even
[abilities.dot]
name = "bladestorm_dot"
tick_time = 1.0
tick_time_expr = "4/(4+buff.imminent_demise.stack)"
duration = 4.0
duration_expr = "4/(1+haste)"
tick_on_apply = true
on_tick = [
  { type = "if", if = "buff.bs_odd.up", then = [{ type = "consume", buff = "bs_odd" }], else = [
    { type = "buff", buff = "bs_odd" },
    { type = "if", if = "buff.recklessness.up", then = [{ type = "trigger", ability = "bloodbath_bladestorm_unhinged" }], else = [{ type = "trigger", ability = "bloodthirst_bladestorm_unhinged" }] },
  ] },
  { type = "trigger", ability = "bladestorm_mh" },
  { type = "trigger", ability = "bladestorm_oh" },
]
on_expire = [
  { type = "consume", buff = "imminent_demise", all = true },
  { type = "buff", buff = "violent_euphoria" },
  { type = "buff", buff = "brutal_finish" },
]

[[abilities]]
name = "bladestorm_mh"
spell_id = 50622
triggered_only = true
damage = { ap_coeff = 2.71635, amount = 606.2, mastery = true }   # [db2]
gain = { rage = 5 }         # [db2 50622 #2: 5 rage a strike], x1.5 while Reckless
on_cast = [
  { type = "gain", resource = "rage", amount_expr = "2.5*buff.recklessness.up" },
  { type = "buff", buff = "overwhelmed" },
]

[[abilities]]
name = "bladestorm_oh"
spell_id = 95738
triggered_only = true
damage = { ap_coeff = 1.358175, amount = 268.48, mastery = true }   # [db2] x0.5 off hand

# ---------------------------------------------------------------- Rampage
# 60 rage (80 less 20 from the Berserk buff) for four hits: off hand, main
# hand, off hand, main hand, 0/0.3/0.9/0.9s apart [db2 184367].

[[abilities]]
name = "rampage"
spell_id = 184367
cost_expr = { rage = "50+30*(1-buff.recklessness.up)" }   # [obs] 80, 50 while Reckless
on_cast = [
  { type = "buff", buff = "enrage" },
  { type = "gain", resource = "rage", amount_expr = "0.1*spent.rage", chance = 0.20 },   # Frothing Berserker [db2 392792 #2]
  { type = "trigger", ability = "rampage1" },
  { type = "trigger", ability = "rampage2", delay = 0.3 },
  { type = "trigger", ability = "rampage3", delay = 0.9 },
  { type = "trigger", ability = "rampage4", delay = 0.9 },
  { type = "trigger", ability = "rage_spent" },
]

[[abilities]]
name = "rampage1"
spell_id = 184707
triggered_only = true
gcd = 0
damage = { ap_coeff = 1.015325, amount = 268.48, mastery = true }   # [db2] off hand
on_cast = [{ type = "trigger", ability = "hack_and_slash_roll", chance = 0.75 }]

[[abilities]]
