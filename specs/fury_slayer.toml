# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Fury APL, Slayer, single target
# (actions.slayer in MID2_Warrior_Fury.simc). Raging Blow and Bloodthirst are
# unavailable while Recklessness is up: Crushing Blow and Bloodbath replace
# them (simc ready()).

[[rotation]]
action = "potion"           # only with [gear.kit]
if = "buff.recklessness.up|fight_remains<25"

[[rotation]]
action = "recklessness"

[[rotation]]
action = "rampage"
if = "(buff.enrage.remains<gcd)&!dot.bladestorm_dot.up"

[[rotation]]
action = "rampage"
if = "(buff.recklessness.up&rage>=100)&!dot.bladestorm_dot.up"

[[rotation]]
action = "rampage"
if = "(buff.recklessness.up&cooldown.bladestorm.ready)&!dot.bladestorm_dot.up"

[[rotation]]
action = "bladestorm"
if = "buff.recklessness.up|fight_remains<=5"

[[rotation]]
action = "execute"
if = "(buff.recklessness.up&buff.sudden_death.up)&!dot.bladestorm_dot.up"

[[rotation]]
action = "rampage"
if = "(buff.recklessness.up&!buff.hack_and_slash.up)&!dot.bladestorm_dot.up"

[[rotation]]
action = "raging_blow"
if = "(buff.recklessness.up)&!dot.bladestorm_dot.up"

[[rotation]]
action = "odyns_fury"
if = "(buff.recklessness.up)&!dot.bladestorm_dot.up"

[[rotation]]
action = "execute"
if = "(buff.recklessness.up&(target.health.pct<35|buff.sudden_death.up))&!dot.bladestorm_dot.up"

[[rotation]]
action = "bloodbath"
if = "!dot.bladestorm_dot.up"

[[rotation]]
action = "rampage"
if = "(rage>100)&!dot.bladestorm_dot.up"

[[rotation]]
action = "execute"
if = "(target.health.pct<35|buff.sudden_death.up)&!dot.bladestorm_dot.up"

[[rotation]]
action = "odyns_fury"
if = "!dot.bladestorm_dot.up"

[[rotation]]
action = "raging_blow"
if = "(!buff.recklessness.up)&!dot.bladestorm_dot.up"

[[rotation]]
action = "rampage"
if = "!dot.bladestorm_dot.up"

[[rotation]]
action = "bloodthirst"
if = "(!buff.recklessness.up)&!dot.bladestorm_dot.up"

[[rotation]]
action = "storm_bolt"
if = "dot.bladestorm_dot.up"

[[rotation]]
action = "whirlwind"
if = "!dot.bladestorm_dot.up"
