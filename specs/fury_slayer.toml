# ---------------------------------------------------------------- Execute
# Costs nothing (Improved Execute) and generates 25 rage, 4.5s cooldown
# (Massacre), usable below 35% health or with Sudden Death; the damage is
# doubled because a free Execute counts as a full 40-rage one [simc
# execute_damage_t::action_multiplier].

[[abilities]]
