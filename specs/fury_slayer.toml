]

# ---------------------------------------------------------------- Raging Blow
# Two charges (Improved Raging Blow +1) on a hasted 8s recharge, 12 rage,
# 25% (+10% from Wrath and Fury while enraged) to reset itself [db2 85288].

[[abilities]]
name = "raging_blow"        # replaced by Crushing Blow in Recklessness [db2 1719 #11]:
spell_id = 85288            # they share one charge pool (category 1672), 8s hasted recharge
charges = 2                 # [db2 85288] 1 + Improved Raging Blow [db2 383854]; resets restart the recharge, as simc's cooldown_t::reset does
cooldown = 8                # [db2]
cooldown_hasted = true      # [db2 137050 #7]
on_cast = [
  { type = "if", if = "buff.recklessness.up", then = [
    { type = "gain", resource = "rage", amount = 18 },          # 12 x 1.5 [db2 1719 #6]
    { type = "trigger", ability = "crushing_blow_mh" },
    { type = "trigger", ability = "crushing_blow_oh" },
  ], else = [
    { type = "gain", resource = "rage", amount = 12 },          # [db2 85288 #2]
    { type = "trigger", ability = "raging_blow_mh" },
    { type = "trigger", ability = "raging_blow_oh" },
  ] },
  { type = "consume", buff = "opportunist" },
  { type = "consume", buff = "hack_and_slash" },
  { type = "trigger", ability = "raging_blow_reset", chance_expr = "0.35*buff.enrage.up+0.25*(1-buff.enrage.up)" },
]

