# ---------------------------------------------------------------- rotation
# SimC's Sentinel single-target APL (actions.sentst), paraphrased.
# trueshot_ready = (fight_remains>25 | bullseye at max stacks)
#                & (explosive shot 15s from ready) | fight_remains<25 | time<10

[[rotation]]
action = "explosive_shot"
if = "buff.unstable_trigger.up&!buff.lock_and_load.up"   # the free second cast, off the cooldown

[[rotation]]
action = "explosive_shot"
if = "!buff.explosive_shot_cd.up&!buff.lock_and_load.up"

[[rotation]]
action = "volley"

[[rotation]]
action = "trueshot"
if = "((fight_remains>25|buff.bullseye.stack>=30)&(buff.explosive_shot_cd.remains>=15|!buff.explosive_shot_cd.up))|fight_remains<25|time<10"

[[rotation]]
action = "moonlight_chakram"
if = "buff.moonlight_chakram.remains<5"

[[rotation]]
action = "aimed_shot_locked"
if = "buff.trueshot.up&!buff.precise_shots.up&cooldown.aimed_shot.charges>0"

[[rotation]]
action = "aimed_shot"
if = "buff.trueshot.up&!buff.precise_shots.up"

[[rotation]]
action = "rapid_fire"
if = "!buff.precise_shots.up|buff.trueshot.up"

[[rotation]]
action = "kill_shot"
if = "buff.precise_shots.up&target.health.pct<=20"

[[rotation]]
action = "arcane_shot"
if = "buff.precise_shots.up"

[[rotation]]
action = "aimed_shot_locked"
if = "cooldown.aimed_shot.charges>0"

[[rotation]]
action = "aimed_shot"

[[rotation]]
action = "moonlight_chakram"

[[rotation]]
action = "steady_shot"
