# Omnium traits (omnium_talents= in the profile; docs/gear.md#omnium-traits). The
# calibration reference has these on, so their worth is inside the fitted
# multipliers; a character with fewer gets it taken back out, trait by trait.
# tools/omnium.py ablate at 20,000 iterations: core kit 161,742 with all, 156,612 with
# none, +3.28%. Each value is the leave-one-out ratio, rescaled so the product
# is exactly all / none.
[gear.omnium]
baseline = ["136822", "136819", "136817", "136815", "136814"]
traits = [
  { id = "136822", name = "Rune of Unleashed Fire", global_mult = 1.01705 },   # [simc] leave-one-out 1.03281
  { id = "136819", name = "Rune of Self-Mending", global_mult = 0.99994 },   # [simc] leave-one-out 0.99989
  { id = "136817", name = "Rune of Lingering", global_mult = 1.00097 },   # [simc] leave-one-out 1.00185
  { id = "136815", name = "Rune of Critical Power", global_mult = 1.01283 },   # [simc] leave-one-out 1.02464
  { id = "136814", name = "Rune of Overload", global_mult = 1.00166 },   # [simc] leave-one-out 1.00318
]

[gear.kit]
enabled = 1  # [simc]
precombat = ["full_kit"]  # [simc]
stats = { primary = 75.1, mastery_rating = 165 }   # [simc] SimC default consumables, measured on the sample profile: Flask of the Magisters (mastery 165); a staff, so no weapon oil
primary_buffs = { lights_potential = 695 }  # [db2]

[gear.procs]
