precombat = ["stormkeeper", "earthen_rage_start"]

[player]
spell_power = 3453  # [simc/db2]
crit = 0.31665  # [simc/db2]
haste = 0.25513  # [simc/db2]
versatility = 0.05337  # [simc/db2]
mastery = 0.7167  # [simc/db2]
crit_multiplier = 2.55  # [simc/db2]
# [obs] snapshot + 24 logged fights: +166.74 crit /74.74 haste /189.84 mastery /19.22 vers rating, +71.10 intellect; converted at baseline DR.

[gear]
primary = "intellect"  # [simc/db2]
base_primary = 618  # [simc/db2]
primary_mult = 1.113945  # [simc/db2]
spell_power_per_primary = 1.0  # [simc/db2]
crit_bonus = 0.05  # [simc/db2]
haste_mult = 1.03  # [simc/db2]
