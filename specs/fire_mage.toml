on_expire = [
  { type = "dismiss", pet = "arcane_phoenix" },   # it only ever acted during Combustion [obs]
  { type = "buff", buff = "hyperthermia" },       # Memory of Al'ar: phoenix leaving grants Hyperthermia [db2 449619]
]

