# Fire Mage — Sunfury, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Mage_Fire.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py, incl.
#          the Spell table's tooltip text for what a talent does
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (class module or APL)
# Damage coefficients are spell-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, target debuffs) live in a
# separate calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# The crit chain is the core of the spec: two direct crits in a row turn
# Heating Up into Hot Streak (instant Pyroblast), Fire Blast always crits and
# is used to complete the pair, and every direct hit or meteorite lands Fire
# Blast's cooldown sooner. Ignite banks a share of direct damage and rolls it
# forward over 9s.

name = "Fire Mage (Sunfury, core kit)"

precombat = ["pyroblast_hardcast"]   # [obs] precast Pyroblast lands at 0.3s

[player]
spell_power = 3341       # [obs] buffed stats
# Final stats = buffed snapshot + the time-averaged gear stat procs (rituals,
# rites, Soul Fang, Venomcursed, Rune of the Versatile Warrior) [obs: 24 logged
# fights, 21 crit / 130 haste / 212 mastery / 157 vers rating on average,
# converted with the probes' rating -> stat deltas].
crit = 0.1115            # 0.1070 + 0.0045
haste = 0.3269           # 0.2991 + 0.0278
versatility = 0.1693     # 0.1402 + 0.0291
mastery = 0.1964         # 0.1750 + 0.0214: Mastery: Ignite banks this share of direct damage [db2 12846]
crit_multiplier = 2.19   # [obs] same-base meteorite crit/non-crit pairs: 2.192 at 0 Fevered Incantation stacks

[gear]
primary = "intellect"
base_primary = 619            # [obs] level-90 dwarf base intellect (SimC report: 3031 from gear = 2412 items + 619)
primary_mult = 1.1025         # [obs] x1.05 passive (unbuffed 3182) x1.05 Arcane Intellect (buffed 3341; +200 int probe 3562)
spell_power_per_primary = 1.0 # [obs] spell power = buffed intellect (3341)
crit_bonus = 0.07             # [obs] 10.70% at 170 rating = 3.70% from rating + 7%
haste_mult = 1.02             # [obs] 29.91% at 1204 rating (27.36%): x1.02, multiplicative with rating haste
mastery_points = 13           # [obs] incl. 2 Skyfury, in mastery points (17.50% at 23.24 points from rating)
mastery_coeff = 0.483         # [obs] +500 mastery probe: +5.05% over +10.46 points after diminishing returns
versatility_bonus = 0.03      # [obs] Mark of the Wild
# Omnium traits (omnium_talents= in the profile; docs/gear.md#omnium-traits). The
# calibration reference has these on, so their worth is inside the fitted
# multipliers; a character with fewer gets it taken back out, trait by trait.
# tools/omnium.py ablate at 20,000 iterations: core kit 147,405 with all, 142,711 with
# none, +3.29%. Each value is the leave-one-out ratio, rescaled so the product
# is exactly all / none.
[gear.omnium]
baseline = ["136822", "136816", "136817", "136820", "136814"]
traits = [
  { id = "136822", name = "Rune of Unleashed Fire", global_mult = 1.01761 },   # [simc] leave-one-out 1.03260
  { id = "136816", name = "Rune of Void-Tainted Shell", global_mult = 1.00002 },   # [simc] leave-one-out 1.00003
  { id = "136817", name = "Rune of Lingering", global_mult = 1.00114 },   # [simc] leave-one-out 1.00210
  { id = "136820", name = "Rune of the Versatile Warrior", global_mult = 1.01126 },   # [simc] leave-one-out 1.02079
  { id = "136814", name = "Rune of Overload", global_mult = 1.00256 },   # [simc] leave-one-out 1.00472
]

# Raid-night kit, applied only with gear lines (the core-kit calibration never
# sees it; `--set gear.kit.enabled=0` turns it off). Same consumables as every
# other caster spec: SimC's defaults at 300s Patchwerk with Bloodlust. [simc]
[gear.kit]
enabled = 1
precombat = ["full_kit"]   # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, versatility_rating = 165, crit_rating = 16, haste_rating = 16 }   # [simc] food, rune, Flask of Thalassian Resistance (vers 165), oil; measured on the sample profile
primary_buffs = { lights_potential = 695 }   # [db2 1236616] rank-2 Light's Potential

# Damage of the library's gear procs (data/item_effects.toml): the raid
# debuffs the calibrated sources carry in their fitted multipliers, Mystic
# Touch (+5% physical), Chaos Brand (+3% magic) and Hunter's Mark (+3%). [simc]
effect_mult = { physical = 1.0815, magic = 1.0609 }

# The time-averaged gear stat procs folded into [player] above, so --gear
# lands on the same final stats. They belong to this gear set; other gear
# keeps the same averages.
[gear.procs]
crit = 0.0045
haste = 0.0278
mastery = 0.0214
versatility = 0.0291

[fight]
duration = 300
variance = 0.2

# Random gear procs, as Poisson rates [obs]
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 10.04

[[procs]]
ability = "acidbrood_scourge"
per_minute = 4.58

