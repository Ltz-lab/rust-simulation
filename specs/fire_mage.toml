duration = 0
below_health = 35
damage_pct = 15
pets = true                 # also the Arcane Phoenix's damage (as calibrated)

# ---------------------------------------------------------------- crit chain helpers

[[abilities]]
name = "crit_chain"         # a Hot Streak spell crit: Heating Up -> Hot Streak [db2 48107, 195283]
gcd = 0
triggered_only = true
on_cast = [
  { type = "if", if = "!buff.hot_streak.up&buff.heating_up.up", then = [{ type = "consume", buff = "heating_up" }, { type = "buff", buff = "hot_streak" }, { type = "buff", buff = "brainstorm" }], else = [{ type = "if", if = "!buff.hot_streak.up", then = [{ type = "buff", buff = "heating_up" }] }] },
  { type = "buff", buff = "fevered_incantation" },
]

[[abilities]]
name = "crit_chain_break"   # a non-crit drops Heating Up and the Fevered Incantation streak [obs]
gcd = 0
triggered_only = true
on_cast = [
  { type = "consume", buff = "heating_up" },
  { type = "consume", buff = "fevered_incantation", all = true },
]

[[abilities]]
name = "spent_hot_streak"   # everything that procs off spending Hot Streak
gcd = 0
triggered_only = true
on_cast = [
  { type = "buff", buff = "pyroclasm", chance = 0.15 },          # [db2 269650]
  { type = "trigger", ability = "conjure_sphere", chance = 0.24 },  # Spellfire Spheres 12% + Rondurmancy 12% [db2 448601, 449596]
  { type = "buff", buff = "mana_cascade" },
  # Fired Up 20% [db2 1257343]; Combustion raises it [db2 1257348], 35% inside [obs]
  { type = "if", if = "buff.combustion.up", then = [{ type = "trigger", ability = "fired_up_gain", chance = 0.35 }], else = [{ type = "trigger", ability = "fired_up_gain", chance = 0.20 }] },
]

[[abilities]]
name = "fired_up_gain"
gcd = 0
triggered_only = true
on_cast = [
  { type = "buff", buff = "fired_up" },
  { type = "reduce_cooldown", ability = "fire_blast", seconds = 2.5 },   # [db2 1257349 #0]
  { type = "extend_buff", buff = "combustion", seconds = 1.0 },          # [db2 1257348 #1]
]

[[abilities]]
name = "conjure_sphere"
gcd = 0
triggered_only = true
on_cast = [
  { type = "buff", buff = "spellfire_sphere" },
  { type = "buff", buff = "glorious_incandescence" },
]

