duration = 8.0
hasted = false
school = "cosmic"
crit_bonus = -1.0
refresh = "extend"           # [obs] stacking debuff: overlapping applications keep ticking

[[abilities]]
name = "acidbrood_scourge"
spell_id = 1310088
triggered_only = true
damage = { sp_coeff = 2.7, school = "nature" }   # gear; scale from calibration

# ---------------------------------------------------------------- rotation
# Paraphrase of the observed priority (SimC default Sunfury APL), single target.

# Fire Blast is off the GCD (castable mid-cast in game; here between casts): complete a
# Heating Up into Hot Streak, or avoid capping charges.
# Potion on the pull (Firestarter + spheres delay it 8s), or with Combustion. [simc]
[[rotation]]
action = "potion"
if = "time>=8|buff.combustion.remains>6|fight_remains<35"

[[rotation]]
action = "fire_blast"
if = "buff.heating_up.up&!buff.hot_streak.up"

[[rotation]]
action = "fire_blast"
if = "cooldown.fire_blast.charges_fractional>=2.9&!buff.hot_streak.up"

# Combustion after the pull delay (18s, Firestarter), right after Meteor when it's up.
[[rotation]]
action = "combustion"
if = "time>=18&cooldown.meteor.remains>gcd"

[[rotation]]
action = "meteor"
if = "time>=16"

[[rotation]]
action = "pyroblast_hot_streak"

[[rotation]]
action = "pyroblast_hyperthermia"

[[rotation]]
action = "pyroblast_hardcast"
if = "buff.pyroclasm.up&(!buff.combustion.up|buff.combustion.remains>2.5)"

[[rotation]]
action = "scorch_heat_shimmer"

[[rotation]]
action = "scorch"
if = "buff.combustion.up|target.health.pct<30"

[[rotation]]
action = "fireball"
