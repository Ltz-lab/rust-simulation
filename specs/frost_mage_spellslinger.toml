# Frost Mage — Spellslinger, Midnight Season 2 core kit.
# [db2]: build 12.1.5.70575, tools/spelldb.py. [simc]: sc_mage.cpp / mage.cpp APL.
# [obs]: reference/frost_*.json and seed-controlled 300 s SimC logs.
# Damage calibration fits damage per hit only; casts and hits come out of the
# mechanics and the rotation.
#
# The core of the spec is Shatter: Frostbolt, Flurry, Glacial Spike, Ray of
# Frost and splinters stack Freezing on the target; Ice Lance spends it (6
# stacks, 12 while Thermal Void is up) for a big hit of its own. Fingers of
# Frost lets Ice Lance shatter without consuming; Brain Freeze makes the next
# Flurry instant, +50% and grants Thermal Void; Icicles tick up to five and
# unlock Glacial Spike. Spellslinger splinters chain through Augury Abounds.
name = "Frost Mage (Spellslinger, core kit)"
precombat = ["frostbolt", "icicle_clock"] # [simc] precast Frostbolt; [obs] icicle clock starts

[player]
spell_power = 3319 # [obs] reference snapshot
crit = 0.3357 # [obs] average crit rate of unmodified spells (0.2974 snapshot + gear procs)
haste = 0.29 # [obs] GCD 1.16 s and a 3.9 s icicle tick at the reference haste
mastery = 0.625 # [obs] 0.5621 snapshot + time-averaged mastery procs; mastery_value is the damage bonus
versatility = 0.0528 # [obs] snapshot (gear vers procs net ~0)
crit_multiplier = 2.19 # [obs] average crit/noncrit ratio of Ray of Frost ticks

[gear]
primary = "intellect"
base_primary = 619 # [obs] level-90 tauren base intellect
primary_mult = 1.071 # [obs] Arcane Intellect x1.05, Inspired Intellect x1.02
spell_power_per_primary = 1.0 # [obs] spell power = buffed intellect
crit_bonus = 0.07 # [obs] 5% base + raid crit
haste_mult = 1.03 # [db2 417489] Winter's Blessing, 3% haste
mastery_points = 13 # [obs] base + Skyfury
mastery_coeff = 1.0 # [obs] 1018 rating -> 43.2% + 13 points = 56.2%
versatility_bonus = 0.03 # [simc] Mark of the Wild
effect_mult = { physical = 1.0815, magic = 1.0609 } # [simc] raid debuffs
spec_id = 64 # [db2] mage frost
use_after = "potion" # [simc]

[gear.kit]
enabled = 1 # [simc] full raid kit when gear is supplied
precombat = ["full_kit"] # [simc] Bloodlust at pull
stats = { primary = 75.1, mastery_rating = 165, crit_rating = 16, haste_rating = 16 } # [db2] food, rune, flask, oil
primary_buffs = { lights_potential = 695 } # [db2 1236616] rank 2 potion

# Time-averaged gear stat procs, folded into [player] so --gear lands on the
# same final stats. They belong to this gear set; other gear keeps the averages.
[gear.procs]
crit = 0.0383 # [obs] rituals / Rune of Critical Power / venomcursed
haste = 0.0271 # [obs] rituals / Soul Fang Alacrity / venomcursed
mastery = 0.063 # [obs] Masterful Ritual / Venomcursed Mastery
versatility = 0.0 # [obs]

[fight]
duration = 300 # [obs]
variance = 0.2 # [simc] reference fight-length variation

# Augury Abounds' bad-luck-protected 10% roll: chance grows with the attempts
# since the last success (SimC accumulated RNG), reset on success.
[resources.augury_attempts]
max = 100 # [simc] numerical guard
start = 1 # [simc] first chance is the PRD constant

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "freezing" # [db2 1221389] target debuff: Shatter stacks
duration = 15 # [db2]
max_stacks = 20 # [db2]

[[buffs]]
name = "fingers_of_frost" # [db2 44544: 15 s, 2 stacks]
duration = 15 # [db2]
max_stacks = 2 # [db2]

[[buffs]]
name = "brain_freeze" # [db2 190446: 15 s]
duration = 15 # [db2]

[[buffs]]
name = "thermal_void" # [db2 1247730: 8 s, spent by Ice Lance for a double shatter]
duration = 8 # [db2]

[[buffs]]
name = "icicles" # [db2 205473: 5 stacks, one every 5 s hasted]
duration = 1e9 # [db2] no expiry
max_stacks = 5 # [db2 1246832]
flat = true # [simc] stacks only count, no per-stack bonus

[[buffs]]
name = "glacial_spike" # [db2 1222865] castable marker at 5 Icicles
duration = 1e9 # [db2]

[[buffs]]
name = "overflowing_energy" # [db2 394195] +10% Frostbolt/Glacial Spike crit per stack
duration = 1e9 # [db2]
max_stacks = 10 # [db2]
ability_crit_pct = { frostbolt = 10, glacial_spike = 10 } # [db2] 394195 effect 2

[[buffs]]
name = "brainstorm" # [db2 461531] +1% intellect, 5 stacks, overlapping
duration = 8 # [db2]
max_stacks = 5 # [db2]
overlap = true # [simc] multiple instances may overlap
power_pct = 1 # [db2]

[[buffs]]
name = "splinterstorm" # [db2 1247908] Ray of Frost doubles splinter conjures
duration = 10 # [db2 443783]

[[buffs]]
name = "permafrost_lances" # [db2 455122] Frozen Orb: +10% Shatter damage
duration = 15 # [db2]
ability_pct = { shatter_ice_lance = 10 } # [db2 460590, simc shatter_t::action_multiplier]

[[buffs]]
name = "hand_of_frost" # [db2 1263263] 5 stacks of +1% mage damage
duration = 8 # [db2]
max_stacks = 5 # [db2]
damage_pct = 1 # [db2 1262981] 1% per stack, all mage spells (affected_by.hand_of_frost)
pets = true # [simc] also pet/guardian damage

[[buffs]]
name = "ray_toggle" # [simc] Hand of Frost on every second Ray of Frost tick
duration = 1e9

# ---------------------------------------------------------------- full raid kit (--gear)

[[buffs]]
name = "full_kit" # [simc]
duration = 1e9

[[buffs]]
name = "bloodlust" # [db2 2825]
duration = 40 # [db2]
haste_pct = 30 # [db2]

[[buffs]]
name = "lights_potential" # [db2 1236616]
duration = 30 # [db2]
power_pct = 20 # [obs] replaced from gear

[[abilities]]
name = "full_kit" # [simc]
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "full_kit" }, { type = "buff", buff = "bloodlust" }]

[[abilities]]
name = "potion" # [db2]
spell_id = 1236616
gcd = 0
cooldown = 300 # [db2]
requires_buff = "full_kit"
on_cast = [{ type = "buff", buff = "lights_potential" }]

# ---------------------------------------------------------------- procs / helpers

[[abilities]]
name = "fingers_of_frost_proc" # [simc] mage_t::trigger_fof
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "fingers_of_frost" }]

[[abilities]]
name = "brain_freeze_proc" # [simc] mage_t::trigger_brain_freeze
gcd = 0
triggered_only = true
on_cast = [
  { type = "buff", buff = "brain_freeze" },
  { type = "buff", buff = "brainstorm" }, # [db2 461261]
  { type = "reset_cooldown", ability = "flurry", keep_recharge = true }, # [simc] cooldowns.flurry->reset(): one charge
  { type = "trigger", ability = "frost_splinter", count = "2*(1+buff.splinterstorm.up)", delay = 1.2, interval = 0.1 }, # [db2 444675] Shifting Shards
]

[[abilities]]
name = "augury_attempt" # [simc] Augury Abounds: 10% PRD on every splinter, 0.5 s ICD
gcd = 0
triggered_only = true
cooldown = 0.5 # [simc] internal cooldown
on_cast = [
  { type = "trigger", ability = "augury_success", chance_expr = "0.014745845*augury_attempts" }, # [simc] PRD for 10% mean
  { type = "gain", resource = "augury_attempts", amount = 1 },
]

[[abilities]]
name = "augury_success"
gcd = 0
triggered_only = true
on_cast = [
  { type = "gain", resource = "augury_attempts", amount_expr = "-augury_attempts" },
  { type = "trigger", ability = "frost_splinter", count = "8*(1+buff.splinterstorm.up)", delay = 1.3, interval = 0.1 }, # [db2 1280165]
]

[[abilities]]
name = "hand_of_frost" # [db2 1262769] 5 SP, no mastery; 1 Freezing
spell_id = 1262769
triggered_only = true
no_procs = true
damage = { sp_coeff = 5.0, school = "frost" } # [db2]
on_cast = [
  { type = "buff", buff = "freezing" }, # [db2 1262935] 1 stack
  { type = "buff", buff = "hand_of_frost", set = "5" }, # [db2 1263263]
]

[[abilities]]
name = "icicle_clock" # [obs] one Icicle every 5 s, hasted
triggered_only = true
gcd = 0
[abilities.dot]
name = "icicle_timer"
tick_time = 5 # [obs] 3.9 s at the reference haste (db2 1246832 lists 6 s)
duration = 1e9
hasted = true
school = "frost"
on_tick = [
  { type = "buff", buff = "icicles" },
  { type = "if", if = "buff.icicles.stack=5", then = [{ type = "buff", buff = "glacial_spike" }] }, # [db2 1246832]
]

# ---------------------------------------------------------------- splinters

[[abilities]]
name = "frost_splinter" # [db2 443722] Spellslinger splinter
spell_id = 443722
triggered_only = true
no_procs = true
damage = { sp_coeff = 0.453, school = "frost", mastery = true, mastery_scale = 1.0 } # [db2]
on_cast = [
  { type = "buff", buff = "freezing", chance = 0.15 }, # [db2 1261080] Infused Splinters, 15% for 1 stack
  { type = "reduce_cooldown", ability = "frozen_orb", seconds = 0.3 }, # [db2 444986] Spellfrost Teachings
  { type = "trigger", ability = "augury_attempt" },
]

# ---------------------------------------------------------------- shatter

[[abilities]]
name = "shatter_fof" # [db2 1246949] 0.9154 SP per stack, Fingers of Frost: 6 stacks, 12 with Thermal Void
source = "shatter_ice_lance"
spell_id = 1246949
triggered_only = true
no_procs = true
damage = { sp_coeff = 0.9154, school = "frost", mastery = true, mastery_scale = 1.0, crit_chance_multiplier = 1.5, crit_damage_bonus = 0.200, scale = "6+6*buff.thermal_void.up" } # [db2, obs] crit x1.5 Improved Shatter; Deep Shatter +50% x crit
on_cast = [
  { type = "trigger", ability = "hand_of_frost", chance_expr = "0.23+0.03*buff.thermal_void.up" }, # [db2 1262981] 20% + 0.5% per shattered stack
  { type = "trigger", ability = "frost_splinter", count = "(3+3*buff.thermal_void.up)*(1+buff.splinterstorm.up)", delay = 1.2, interval = 0.1 }, # [db2 444719] Force of Will: stacks/2
  { type = "reduce_cooldown", ability = "ray_of_frost", seconds_expr = "0.6+0.6*buff.thermal_void.up" }, # [db2 1247798] Glaciate: 0.1 s per stack
  { type = "consume", buff = "thermal_void", all = true }, # [simc] ice_lance_t::execute
]

[[abilities]]
name = "shatter_freezing" # [db2 1246949] no Fingers of Frost: min(6*(1+TV), stacks) and consume them
source = "shatter_ice_lance"
spell_id = 1246949
triggered_only = true
no_procs = true
damage = { sp_coeff = 0.9154, school = "frost", mastery = true, mastery_scale = 1.0, crit_chance_multiplier = 1.5, crit_damage_bonus = 0.200, scale = "buff.freezing.stack*(buff.freezing.stack<6+6*buff.thermal_void.up)+(6+6*buff.thermal_void.up)*(buff.freezing.stack>=6+6*buff.thermal_void.up)" }
on_cast = [
  { type = "trigger", ability = "hand_of_frost", chance_expr = "0.20+0.005*(buff.freezing.stack*(buff.freezing.stack<6+6*buff.thermal_void.up)+(6+6*buff.thermal_void.up)*(buff.freezing.stack>=6+6*buff.thermal_void.up))" }, # [db2 1262981]
  { type = "trigger", ability = "frost_splinter", count = "(buff.freezing.stack*(buff.freezing.stack<6+6*buff.thermal_void.up)+(6+6*buff.thermal_void.up)*(buff.freezing.stack>=6+6*buff.thermal_void.up))/2*(1+buff.splinterstorm.up)", delay = 1.2, interval = 0.1 }, # [db2 444719] Force of Will
  { type = "reduce_cooldown", ability = "ray_of_frost", seconds_expr = "0.1*(buff.freezing.stack*(buff.freezing.stack<6+6*buff.thermal_void.up)+(6+6*buff.thermal_void.up)*(buff.freezing.stack>=6+6*buff.thermal_void.up))" }, # [db2 1247798] Glaciate
  { type = "buff", buff = "freezing", set = "buff.freezing.stack-6-6*buff.thermal_void.up" }, # [db2 1246769] Shatter effect 4, at impact
  { type = "consume", buff = "thermal_void", all = true }, # [simc] ice_lance_t::execute
]

