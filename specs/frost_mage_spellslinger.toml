# ---------------------------------------------------------------- rotation
# [simc] default single-target Spellslinger APL (MID2_Mage_Frost.simc), no tier.
# The cds list opens with Ray of Frost when both charges are up (and at the
# end of the fight); the rest is the spellslinger list.

[[rotation]]
action = "flurry"
if = "buff.brain_freeze.up&!buff.thermal_void.up"

[[rotation]]
action = "ray_of_frost"
if = "cooldown.ray_of_frost.charges=2|fight_remains<12"

[[rotation]]
action = "ice_lance_fof"
if = "buff.fingers_of_frost.stack=2"

[[rotation]]
action = "frozen_orb"

[[rotation]]
action = "glacial_spike"
if = "buff.glacial_spike.up"

[[rotation]]
action = "ice_lance_fof"
if = "buff.fingers_of_frost.up"

[[rotation]]
action = "ice_lance_freezing"
if = "buff.freezing.stack>=6"

[[rotation]]
action = "ray_of_frost"
if = "buff.icicles.stack<=3"

[[rotation]]
action = "flurry"

[[rotation]]
action = "glacial_spike"
if = "buff.glacial_spike.up"

[[rotation]]
action = "frostbolt"
