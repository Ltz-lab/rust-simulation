# Unholy Death Knight — Rider of the Apocalypse, Midnight Season 2, core kit.
# Built from ~/Dev/wow-sims/simc/profiles/MID2/MID2_Death_Knight_Unholy.simc
# (talents, default APL, hero tree Rider of the Apocalypse) and
# engine/class_modules/sc_death_knight.cpp.
#
# Where numbers come from:
#   [db2]  game tables (wago.tools exports) via tools/spelldb.py, build 12.1.5.70575
#   [obs]  observed in SimC's report/log on the core profile
#          (reference/unholy_core_observations.json)
#   [simc] read from SimC's class module or the default APL
# Per-hit residual multipliers (talents, auras, the level-damage scaling SimC
# applies) live in calibration/unholy.toml, fitted by tools/calibrate.py.
#
# Midnight unholy: Festering Strike grants Lesser Ghoul stacks that Scourge
# Strike and Soul Reaper spend to summon lesser ghouls; Scourge Strike also
# erupts both diseases. Putrefy summons a ghoul that strikes and explodes and
# reanimates into a Magus (Lord of the Dead). Army of the Dead raises eight
# ghouls, a Magus and an Abomination and (Rider of the Apocalypse) all four
# horsemen; Dark Transformation summons another Magus and Whitemane. Runes and
# runic power drive everything; Runic Corruption speeds rune regen, and Dread
# Plague ticks can make the next Death Coil free (Sudden Doom).

name = "Unholy Death Knight (Rider of the Apocalypse, core kit)"
# [simc] pre-pull permanent ghoul plus the always-on passives
precombat = ["raise_dead", "lord_of_the_dead_summon", "gear_procs_start"]

[player]
# [obs] buffed snapshot from reference/unholy_core_observations.json (no gear
# procs, no consumables, no Bloodlust); strength is attack power for a DK.
attack_power = 2588
spell_power = 341
crit = 0.2556521739
haste = 0.1969454545
mastery = 0.6976956522
versatility = 0.0498148148
crit_multiplier = 2.07        # [obs] DK direct crits x2.07 (26548 -> 54943)
weapon = { min = 0, max = 0, speed = 3.6 }   # [db2] Mazeroa, Warlord's Fury: 3.6s two-hander

[fight]
duration = 300               # [obs] reference setup
variance = 0.2               # [simc] default

# ---------------------------------------------------------------- resources

[resources.rune]
max = 6                      # [db2] MAX_RUNES
start = 6                    # [simc] out of combat
regen = 0.20                 # [obs] SimC regenerates 162 runes / 300s and waits on runes ~25% of GCDs
regen_hasted = true

[resources.runic_power]
max = 100                    # [db2]
start = 0                    # [simc] decays out of combat

[auto_attack]
replace_with = "auto_attack_player"
# Skyfury raid buff: 20% chance to repeat the swing [obs] (SimC's skyfury buff)
on_hit = [{ type = "trigger", ability = "auto_attack_player", chance = 0.20 }]

# ---------------------------------------------------------------- procs

# Venomfang (Bite of Zul'jan weapon effect): real PPM, hasted [simc unique_gear_midnight.cpp]
[[procs]]
ability = "venomfang_proc"
per_minute = 4.7             # [obs] 36.3 applications / 300s at 43% total haste
hasted = true

# Rune of Unleashed Fire (omnium rune): fixed clock [obs] 50.3 procs / 300s
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 10.1

# Rune of the Apocalypse (Pestilence): a fraction of pet claw hits rolls the
# Pestilence plague [simc trigger_rune_of_the_apocalypse]; modelled as a clock
[[procs]]
ability = "pestilence_apply"
per_minute = 22.4            # [obs] 295 ticks at 1s, 6s duration -> ~112 applications

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "gear_procs"          # time-averaged gear/embellishment procs [obs: SimC log]
duration = 1e9
crit_pct = 3.16              # [obs] Venomcursed Critical Strike: 377 rating x 38.6% uptime / 46
haste_pct = 3.8              # [obs] Venomcursed Ascendance: 433 rating x 38.5% uptime / 44
mastery_pct = 2.81           # [obs] Rune of Masterful Cunning: 78 rating x 87% uptime
versatility_pct = -0.5       # [obs] Ascendance downsides: 73 rating x 38.6% uptime
power_pct = 2.42             # [obs] Arcanoweave Insight: +134 strength x 47% uptime

[[buffs]]
name = "icy_talons"          # [db2 194879] 3 stacks of 6% haste, up from the first swing
duration = 1e9
max_stacks = 3
haste_pct = 6

[[buffs]]
name = "unholy_aura"         # [db2 1268917] 2% haste per stack from magus summons
duration = 1e9               # [obs] avg 4.55 stacks = 9.1% haste
haste_pct = 9.1

[[buffs]]
name = "berserking"          # [db2 26297] troll racial
duration = 12
haste_pct = 10

[[buffs]]
name = "runic_corruption"    # [db2 51460] doubles rune regeneration
duration = 3
resource_regen_pct = { rune = 100 }

[[buffs]]
name = "rune_mastery"        # [db2 374585] 6% rune regen, 15% chance per rune spent
duration = 8
resource_regen_pct = { rune = 6 }

[[buffs]]
name = "dark_transformation" # [db2 1235391]
spell_id = 1235391
duration = 15
pet_pct = { ghoul = 200 }    # [db2 1233448] ghoul damage +200%

[[buffs]]
name = "commander_of_the_dead" # [db2 390260]
spell_id = 390264
duration = 30
pet_pct = { army_ghoul = 25 } # [db2 390264] +25% army ghoul damage

[[buffs]]
name = "army_of_the_dead"    # [db2 42650] 30s; gates the Army ghouls' Death Orders
duration = 30

[[buffs]]
name = "forbidden_knowledge" # [db2 1242223] 30s; Death Coil becomes Necrotic Coil
duration = 30

[[buffs]]
