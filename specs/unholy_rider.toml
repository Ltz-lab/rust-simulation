# Unholy Death Knight — Rider of the Apocalypse, Midnight Season 2, core kit.
# Built from ~/Dev/wow-sims/simc/profiles/MID2/MID2_Death_Knight_Unholy.simc
# (talents, default APL, hero tree Rider of the Apocalypse) and
# engine/class_modules/sc_death_knight.cpp.
#
# Where numbers come from:
#   [db2]  game tables (wago.tools exports) via tools/spelldb.py, build 12.1.5.70575
#   [obs]  observed in SimC's report/log on the core profile
#          (reference/unholy_core_observations.json)
#   [simc] read from SimC's class module or the default APL
# Per-hit residual multipliers (talents, auras, the level-damage scaling SimC
# applies) live in calibration/unholy_rider.toml, fitted by tools/calibrate.py.
#
# Midnight unholy: Festering Strike grants Lesser Ghoul stacks that Scourge
# Strike and Soul Reaper spend to summon lesser ghouls; Scourge Strike also
# erupts both diseases. Putrefy summons a ghoul that strikes and explodes and
# reanimates into a Magus (Lord of the Dead). Army of the Dead raises eight
# ghouls, a Magus and an Abomination and (Rider of the Apocalypse) all four
# horsemen; Dark Transformation summons another Magus and Whitemane. Runes and
# runic power drive everything; Runic Corruption speeds rune regen, and Dread
# Plague ticks can make the next Death Coil free (Sudden Doom).

name = "Unholy Death Knight (Rider of the Apocalypse, core kit)"
# [simc] pre-pull permanent ghoul plus the always-on passives
precombat = ["raise_dead", "lord_of_the_dead_summon", "gear_procs_start"]

[player]
# [obs] buffed snapshot from reference/unholy_core_observations.json (no gear
# procs, no consumables, no Bloodlust); strength is attack power for a DK.
# [simc] damage uses sheet attack power + 1000 flat base attack power: +200
# strength adds 220 sheet AP but only 6.1% damage
attack_power = 3588
spell_power = 341
crit = 0.2556521739
haste = 0.1969454545
mastery = 0.6976956522
versatility = 0.0498148148
crit_multiplier = 2.07        # [obs] DK direct crits x2.07 (26548 -> 54943)
weapon = { min = 0, max = 0, speed = 3.6 }   # [db2] Mazeroa, Warlord's Fury: 3.6s two-hander

[gear]
primary = "strength"
base_primary = 621.0          # [obs] level-90 troll death knight base strength (SimC: 2465 buffed = (620.5 + 1727 from gear) x 1.05)
primary_mult = 1.05           # [obs] buffed 2465 / unbuffed 2348 (the strength probe's +200 gives +220 attack power)
attack_power_mult = 1.05      # [obs] Battle Shout: 2465 strength -> 2588 attack power
crit_bonus = 0.05             # [obs] 25.57% at 946 rating (20.57% from rating)
haste_mult = 1.04             # [obs] 19.69% at 664 rating (15.09%): x1.04
mastery_points = 10           # [obs] 69.77% / Dreadblade 1.8 [simc spell 77515] = 38.76 points, 28.76 from rating
mastery_coeff = 1.8           # [simc] Dreadblade, % per mastery point
versatility_bonus = 0.03      # [obs] Mark of the Wild
weapon_ap_per_dps = 6.4189    # [obs] the spec's flat 1000 base attack power at 155.8 two-hander DPS
spec_id = 252                 # [db2] ChrSpecialization Unholy

# Omnium traits (omnium_talents= in the profile; docs/gear.md#omnium-traits). The
# calibration reference has these on, so their worth is inside the fitted
# multipliers; a character with fewer gets it taken back out, trait by trait.
# tools/omnium.py ablate at 20,000 iterations: core kit 148,632 with all, 143,575 with
# none, +3.52%. Each value is the leave-one-out ratio, rescaled so the product
# is exactly all / none.
[gear.omnium]
baseline = ["rune_of_unleashed_fire", "rune_of_lynxlike_reflexes", "rune_of_lingering", "rune_of_masterful_cunning", "rune_of_overload"]
traits = [
  { id = "rune_of_unleashed_fire", name = "Rune of Unleashed Fire", global_mult = 1.01837 },   # [simc] leave-one-out 1.03540
  { id = "rune_of_lynxlike_reflexes", name = "Rune of Lynxlike Reflexes", global_mult = 0.99999 },   # [simc] leave-one-out 0.99998
  { id = "rune_of_lingering", name = "Rune of Lingering", global_mult = 1.00123 },   # [simc] leave-one-out 1.00236
  { id = "rune_of_masterful_cunning", name = "Rune of Masterful Cunning", global_mult = 1.01340 },   # [simc] leave-one-out 1.02576
  { id = "rune_of_overload", name = "Rune of Overload", global_mult = 1.00190 },   # [simc] leave-one-out 1.00363
]

# Raid-night kit, applied only with gear lines (`--set gear.kit.enabled=0`
# turns it off): SimC's default level-90 consumables for the sample profile
# plus Bloodlust, measured on its buffed stats. [simc]
[gear.kit]
enabled = 1
precombat = ["full_kit"]   # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, mastery_rating = 165, crit_rating = 16, haste_rating = 16 }
#   primary 75.1   Silvermoon Parade 50 + Void-Touched augment rune 25.1 [obs: +83 attack power]
#   mastery 165    Flask of the Magisters (rank 2) [obs: SimC buffed stats]
#   crit/haste 16  Thalassian Phoenix Oil (rank 2) on the two-hander [obs]

[fight]
duration = 300               # [obs] reference setup
variance = 0.2               # [simc] default

# ---------------------------------------------------------------- resources

[resources.rune]
max = 6                      # [db2] MAX_RUNES
start = 6                    # [simc] out of combat
regen = 0.225                # [obs] SimC regenerates 162 runes / 300s and waits on runes ~25% of GCDs
regen_hasted = true

[resources.runic_power]
max = 100                    # [db2]
start = 0                    # [simc] decays out of combat

[auto_attack]
replace_with = "auto_attack_player"
# Skyfury raid buff: 20% chance to repeat the swing [obs] (SimC's skyfury buff)
on_hit = [{ type = "trigger", ability = "auto_attack_player", chance = 0.20 }]

# ---------------------------------------------------------------- procs

# Venomfang (Bite of Zul'jan weapon effect): real PPM, hasted [simc unique_gear_midnight.cpp]
[[procs]]
ability = "venomfang_proc"
per_minute = 4.7             # [obs] 36.3 applications / 300s at 43% total haste
hasted = true

# Rune of Unleashed Fire (omnium rune): fixed clock [obs] 50.3 procs / 300s
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 10.1

# Rune of the Apocalypse (Pestilence): a fraction of pet claw hits rolls the
# Pestilence plague [simc trigger_rune_of_the_apocalypse]; modelled as a clock
[[procs]]
ability = "pestilence_apply"
per_minute = 24.3            # [obs] 295 ticks at 1s, 6s duration -> ~112 applications

# Rider's Champion [simc 444005]: 20% chance per rune spent to summon a random
# rider that is not out yet. 162 runes spent per fight -> 32 procs.
[[procs]]
ability = "riders_champion"
per_minute = 2.9            # [obs] 20 rider procs per fight at the reference haste
hasted = true


# ---------------------------------------------------------------- buffs

[[buffs]]
name = "gear_procs"          # time-averaged gear/embellishment procs [obs: SimC log]
duration = 1e9
crit_pct = 3.16              # [obs] Venomcursed Critical Strike: 377 rating x 38.6% uptime / 46
haste_pct = 0.0              # [obs] gear haste rating is inside the sheet haste above
mastery_pct = 2.81           # [obs] Rune of Masterful Cunning: 78 rating x 87% uptime
versatility_pct = -0.5       # [obs] Ascendance downsides: 73 rating x 38.6% uptime
power_pct = 2.42             # [obs] Arcanoweave Insight: +134 strength x 47% uptime

[[buffs]]
name = "icy_talons"          # [db2 194879] 3 stacks of 6% haste, up from the first swing
