duration = 0.001
ability_pct = { death_coil_player = 35 } # [db2 81340 #3]

[[buffs]]
name = "festering_scythe"    # [db2 458123] next Festering Strike is a free Festering Scythe
duration = 15

[[buffs]]
name = "festering_scythe_tt" # [db2 1241077] plagues tick 35% faster (baked into the tick times)
duration = 25

[[buffs]]
name = "lesser_ghoul_ready"  # [db2 1254252] 8 independent stacks of 30s
duration = 30
max_stacks = 8
overlap = true

