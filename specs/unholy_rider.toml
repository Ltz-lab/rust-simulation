# ---------------------------------------------------------------- rotation
# SimC's default unholy APL, single target (Patchwerk). [simc]
# Death Coil is replaced by Necrotic Coil while Forbidden Knowledge is up, so
# every Death Coil line is spelled twice.

# Potion with the cooldowns [simc APL: potion,if=variable.cds_active]
[[rotation]]
action = "potion"
if = "pet.army_ghoul.active>=1|buff.forbidden_knowledge.up|(buff.dark_transformation.up&buff.dark_transformation.remains>5)"

[[rotation]]
action = "army_of_the_dead"
if = "buff.festering_scythe_tt.up"

[[rotation]]
action = "dark_transformation"
if = "buff.army_of_the_dead.up|cooldown.army_of_the_dead.remains>30"

[[rotation]]
action = "berserking"
if = "buff.dark_transformation.up|pet.army_ghoul.active>=1|buff.forbidden_knowledge.up"

[[rotation]]
action = "outbreak"
if = "!dot.dread_plague.ticking"

[[rotation]]
action = "festering_scythe"
if = "buff.festering_scythe.up&(buff.festering_scythe.remains<=3|buff.festering_scythe_tt.remains<3)"

[[rotation]]
action = "festering_strike"
if = "!buff.festering_scythe.up&buff.festering_scythe_tt.remains<3"

[[rotation]]
action = "soul_reaper"
if = "(buff.dark_transformation.up&cooldown.dark_transformation.remains<38)|target.health.pct<35"

[[rotation]]
action = "putrefy"
if = "buff.dark_transformation.up&runic_power<90"

[[rotation]]
action = "necrotic_coil"
if = "buff.forbidden_knowledge.up&(buff.sudden_doom.up|runic_power>=90)"

[[rotation]]
action = "death_coil_player"
if = "!buff.forbidden_knowledge.up&(buff.sudden_doom.up|runic_power>=90)"

[[rotation]]
action = "putrefy"
if = "buff.dark_transformation.up"

[[rotation]]
action = "necrotic_coil"
if = "buff.forbidden_knowledge.up"

[[rotation]]
action = "death_coil_player"
if = "!buff.forbidden_knowledge.up&(buff.dark_transformation.up|runic_power>90)"

[[rotation]]
action = "scourge_strike"
if = "buff.lesser_ghoul_ready.up"

[[rotation]]
action = "festering_scythe"
if = "buff.festering_scythe.up"

[[rotation]]
action = "festering_strike"
if = "buff.lesser_ghoul_ready.stack=0"
