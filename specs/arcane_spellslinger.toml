damage = { sp_coeff = 1.8, school = "fire", crit_bonus = -10 } # [db2]
on_cast = [{ type = "trigger", ability = "rune_lingering_apply" }]
[[abilities]]
name = "rune_lingering_apply"
triggered_only = true
[abilities.dot]
