[[abilities]]
name = "void_eruption"
spell_id = 1310209 # [db2]
triggered_only = true
no_procs = true
damage = { sp_coeff = 1.5, school = "shadow" } # [db2]

# ---------------------------------------------------------------- APL [simc] default single-target Spellslinger, no tier
[[rotation]]
action = "arcane_orb"
if = "time=0"
[[rotation]]
action = "touch_of_the_magi"
if = "(prev_gcd.prismatic_bolt|prev_gcd.arcane_barrage|(buff.arcane_surge.up&buff.arcane_surge.remains<12))&(buff.arcane_surge.up|cooldown.arcane_surge.remains>30)"
[[rotation]]
action = "arcane_surge"
[[rotation]]
action = "evocation"
if = "mana.pct<10&!buff.arcane_surge.up&!buff.touch_of_the_magi.up&cooldown.arcane_surge.remains>10"
[[rotation]]
action = "prismatic_bolt"
if = "buff.arcane_salvo.stack>13"
[[rotation]]
action = "arcane_barrage"
if = "buff.arcane_salvo.stack>=19|(prev_gcd.arcane_surge&buff.arcane_salvo.stack>=15)|(fight_remains<gcd*2&charges=4)"
[[rotation]]
action = "arcane_missiles"
if = "(buff.arcane_salvo.stack<15|buff.clearcasting.stack=3)&!buff.clearcasting_reaction.up"
[[rotation]]
action = "prismatic_bolt"
[[rotation]]
action = "arcane_orb"
if = "charges<3"
[[rotation]]
action = "arcane_blast"
if = "!buff.prismatic_bolt.up"
