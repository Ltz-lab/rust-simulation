# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Arms APL, Slayer, single target. Below 35%
# health (Massacre) it runs slayer_execute, else slayer_st.

[[rotation]]
action = "potion"           # only with [gear.kit] [simc APL: debuff.colossus_smash.remains>8|target.time_to_die<25]
if = "buff.colossus_smash.remains>8|fight_remains<25"

# --- slayer_execute
[[rotation]]
action = "avatar"
if = "target.health.pct<35&(buff.colossus_smash.up|cooldown.colossus_smash.remains>gcd|fight_remains<=20)"

[[rotation]]
action = "colossus_smash"
if = "target.health.pct<35"

[[rotation]]
action = "heroic_strike"
if = "target.health.pct<35"

[[rotation]]
action = "bladestorm"
if = "target.health.pct<35&(buff.colossus_smash.up|cooldown.colossus_smash.remains>25|buff.avatar.up|buff.executioners_precision.stack=2)"

[[rotation]]
action = "mortal_strike"
if = "target.health.pct<35&buff.executioners_precision.stack=2"

[[rotation]]
action = "execute_sd"
if = "target.health.pct<35&(buff.executioner.up|rage>40)"

[[rotation]]
action = "execute_rage"
if = "target.health.pct<35&!buff.sudden_death.up&rage>40"

[[rotation]]
action = "overpower"
if = "target.health.pct<35"

[[rotation]]
action = "execute_sd"
if = "target.health.pct<35"

[[rotation]]
action = "execute_rage"
if = "target.health.pct<35&!buff.sudden_death.up"

# --- slayer_st
[[rotation]]
action = "cleave"
if = "target.health.pct>=35&(dot.rend_dot.remains<=gcd|cooldown.colossus_smash.remains<2&dot.rend_dot.remains<=10)"

[[rotation]]
action = "avatar"
if = "target.health.pct>=35&(buff.colossus_smash.up|cooldown.colossus_smash.remains<10&cooldown.colossus_smash.remains>gcd)"

[[rotation]]
action = "execute_sd"
if = "target.health.pct>=35&(buff.sudden_death.stack=2|cooldown.bladestorm.ready&buff.imminent_demise.stack<1)"

[[rotation]]
action = "colossus_smash"
if = "target.health.pct>=35&buff.sudden_death.stack<2"

[[rotation]]
action = "bladestorm"
if = "target.health.pct>=35&(buff.colossus_smash.up|buff.avatar.up)"

[[rotation]]
action = "heroic_strike"
if = "target.health.pct>=35"

[[rotation]]
action = "mortal_strike"
if = "target.health.pct>=35"

[[rotation]]
action = "execute_sd"
if = "target.health.pct>=35&buff.executioner.up"

[[rotation]]
action = "overpower"
if = "target.health.pct>=35"

[[rotation]]
action = "cleave"
if = "target.health.pct>=35&dot.rend_dot.remains<=5"

[[rotation]]
action = "slam"
if = "target.health.pct>=35&!buff.master_of_warfare_proc.up"

[[rotation]]
action = "wrecking_throw"
