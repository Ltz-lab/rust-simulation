# ---- Mind Blast / Void Blast (one ability: Void Blast shares Mind Blast's charges [simc])
[[abilities]]
name = "mind_blast"
spell_id = 8092
cast_time = 1.5          # [db2] hasted
cooldown = 9             # [db2]
cooldown_hasted = true
charges = 1              # [simc]
# The spell is chosen when the cast starts (the rift may end during the 1.1 s cast) [simc APL]
on_begin = [{ type = "if", if = "buff.entropic_rift.up", then = [{ type = "buff", buff = "void_blast_cast" }], else = [{ type = "consume", buff = "void_blast_cast" }] }]
on_start = [{ type = "if", if = "buff.void_blast_cast.up", then = [{ type = "consume", buff = "void_blast_cast" }, { type = "trigger", ability = "void_blast_hit" }], else = [{ type = "trigger", ability = "mind_blast_hit" }] }]

[[abilities]]
name = "mind_blast_insight"         # Shadowy Insight: instant, spends the buff instead of a charge [simc]
requires_buff = "shadowy_insight"
on_begin = [{ type = "if", if = "buff.entropic_rift.up", then = [{ type = "buff", buff = "void_blast_cast" }], else = [{ type = "consume", buff = "void_blast_cast" }] }]
on_start = [
  { type = "consume", buff = "shadowy_insight" },
  { type = "if", if = "buff.void_blast_cast.up", then = [{ type = "consume", buff = "void_blast_cast" }, { type = "trigger", ability = "void_blast_hit" }], else = [{ type = "trigger", ability = "mind_blast_hit" }] },
]

