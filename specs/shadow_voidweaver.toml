# ---- Void Torrent and the Entropic Rift
[[abilities]]
name = "void_torrent"
spell_id = 263165
gcd = 0                  # [simc] use_off_gcd
cooldown = 30            # [db2]
# [obs] the channel lasts 3.0 s unhasted (buff 289577: 2.98 s) with 5.63 hits per cast: a tick at once, 0.64 s
# ticks (5 whole ticks, last at 2.56 s) and a short final tick at 3.0 s.
# APPROX: the 63% tail chance is fitted to the 5.63 hits. DB2 gives Void Torrent a 1 s tick and no tick-time
# modifier (Quickened Pulse's masks cover SW:P and the Entropic Rift spells, not 263165), so the 0.64 s is not
# derived either. 5.63 fits hasted 1 s ticks in a fixed 3 s channel with a partial last tick (5 ticks below
# 1.333 haste, 6 above), but SimC hastes channel durations, which the 2.98 s buff contradicts. Unresolved.
# finish_delay: the 0.44 s to the 3.0 s channel end plus SimC's channel_lag after a channel that runs to its
# end, 0.25 s [simc sim.cpp channel_lag; player_t::schedule_ready].
channel = { ticks = 5, finish_delay = 0.69, on_finish = [
  { type = "trigger", ability = "void_torrent_tail", chance = 0.63, delay = 0.44 },
  # at the end of the channel (3.0 s, after the 0.44 s wait) the rift and Voidheart go back to full duration [simc]
  { type = "trigger", ability = "void_torrent_end", delay = 0.44 },
] }
on_cast = [
  { type = "trigger", ability = "entropic_rift_spawn" },   # before the channel starts [simc]
  { type = "apply_dot", dot = "void_torrent_insanity" },
]
