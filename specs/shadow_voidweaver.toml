# ---- Shadow Word: Pain
[[abilities]]
name = "shadow_word_pain"
spell_id = 589
gain = { insanity = 3, nzoth = 3 }   # [db2], [simc]
damage = { sp_coeff = 0.168, school = "shadow", mastery = true, mastery_scale = 3, crit_damage_bonus = 0.433 }   # [db2]; crit bonus as on VT [obs]
# Tormented Spirits [simc]: threshold RNG mean 13%, doubled on a crit, so the chance grows with crit
on_cast = [
  { type = "trigger", ability = "apparition_spawn", chance = 0.13 },
  { type = "trigger", ability = "nzoth_check" },
]
on_crit = [{ type = "trigger", ability = "apparition_spawn", chance = 0.13 }]
[abilities.dot]
name = "shadow_word_pain"
sp_coeff = 0.1246        # [db2]
# 2 s x 0.87 hasted [db2]: Quickened Pulse 1266845 #0 is -20% tick time on SW:P, raised to -13% by the spec
# aura 137033 #24 (+7 to it); SimC parses both as passives [simc parse_all_class_passives/_talents].
tick_time = 1.74
duration = 16            # [db2]
school = "shadow"
mastery = true
mastery_scale = 3
on_tick = [
  # [obs] 28.44 starts and 0.02 refreshes: no proc is lost to a buff that is already up (8% of 355.6 ticks), so a
  # roll happens only while it is down. APPROX: 0.0873 gives 28.4 starts per 300 s (8% of all ticks would be 0.08; ticks inside the ~1.14 s windows roll nothing)
  { type = "if", if = "!buff.shadowy_insight.up", then = [{ type = "buff", buff = "shadowy_insight", chance = 0.0873 }] },
  # Tormented Spirits [simc]: threshold RNG mean 13%, doubled on a crit (the extra roll is in on_crit)
  { type = "trigger", ability = "apparition_spawn", chance = 0.13 },
]
on_crit = [{ type = "trigger", ability = "apparition_spawn", chance = 0.13 }]
crit_damage_bonus = 0.433   # [obs] SW:P/VT crit/noncrit 2.50 vs 2.067 elsewhere; Instilled Doubt [db2 1242862 #1] is +20% of it

