  { type = "buff", buff = "crushing_void" },
  { type = "buff", buff = "shadowform" },
  # Ancient Madness [simc]: haste decays over 10 s after Voidform ends
  { type = "buff", buff = "ancient_madness", set = "10*(buff.ancient_madness_extension.stack>0)" },
  { type = "apply_dot", dot = "ancient_madness_clock" },
  { type = "consume", buff = "ancient_madness_extension", all = true },
]

[[buffs]]
name = "void_volley"
duration = 30            # [db2 1242171]
max_stacks = 3           # [db2 228260 #2]
flat = true

[[buffs]]
name = "crushing_void"
duration = 30            # [db2 1279437]

[[buffs]]
name = "ancient_madness_extension"
duration = 60            # lasts as long as Voidform [simc]
max_stacks = 5           # [simc]
haste_pct = 2            # [db2 194249 #11-#13] per stack

[[buffs]]
name = "ancient_madness"
duration = 10            # [simc] linear decay in 1 s steps
max_stacks = 10
refresh_duration = false
# APPROX: SimC gives 10% x extension stacks / 5. Modelled as 10 stacks of 0.9%
# (4.45 average extensions of 5 [obs: 13.04 refreshes / 2.93 starts]).
