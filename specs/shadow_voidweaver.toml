damage = { sp_coeff = 2.1, school = "shadow", mastery = true, mastery_scale = 3 }   # [db2]
on_cast = [
  # Darkening Horizon [db2 449912]: +1 s to the rift, Voidheart and the timer, at most 3 times
  { type = "if", if = "buff.entropic_rift.up&buff.darkening_horizon.stack<3", then = [
    { type = "extend_buff", buff = "entropic_rift", seconds = 1 },
    { type = "extend_buff", buff = "voidheart", seconds = 1 },
