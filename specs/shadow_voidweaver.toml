# Shadow Priest — Voidweaver, Midnight Season 2, core kit.
# Tags: [db2] game tables (build 12.1.5.70575, tools/spelldb.py); [simc] SimC's
# priest module / default shadow APL (midnight branch); [obs] reference/shadow_core_observations.json.
# Source names match that file, so tools/compare.py lines them up. Calibration
# fits damage per hit only: every cast and hit count comes from the mechanics and
# the rotation below. Midnight has no Devouring Plague (Shadow Word: Madness
# replaces it) and no Mind Spike, Dark Ascension, Mind Sear or Mindbender [simc].
#
# Shape of the spec:
#  * Insanity (max 100) is built by Mind Blast / Void Blast, Mind Flay, Tentacle
#    Slam, Void Torrent, Void Volley, apparitions and idols; Shadow Word: Madness
#    (SW:M) spends 45.
#  * Every SW:M impact, Shadow Word: Pain tick roll (Tormented Spirits) and idol
#    event spawns a Shadowy or Void Apparition (travel 3.33 s). Each one fires
#    Shadeburst and extends SW:P and VT by 1 s (Haunting Shadows).
#  * Void Torrent opens an Entropic Rift (buff + hasted timer DoT); when it ends
#    Collapsing Void hits and a Voidwraith appears.
#  * Idol of N'Zoth (stacks on the target) and Idol of Yogg-Saron (stacks per
#    apparition) are resources; Tentacle Slam draws a random idol.
name = "Shadow Priest (Voidweaver, core kit)"

# [simc] APL precombat: shadowform, then Tentacle Slam (VT and a 25% SW:M up at pull)
precombat = ["shadowform", "tentacle_slam"]

[player]
# [obs] buffed snapshot of the reference character plus the time-averaged gear stat
# procs of the same sample-gear family (Soul Fang, Rune of Critical Power, Venomcursed,
# Arcanoweave: 187 crit / 103 haste / 208 mastery / 21 vers rating, 34 intellect,
# as measured for the destruction and affliction specs). A later stage adds [gear].
spell_power = 3412       # [obs] 3374 + 38 averaged gear procs
crit = 0.1675            # [obs] 0.1291 + 0.0384
haste = 0.2929           # [obs] snapshot, no proc average: SW:M's 204.9 ticks and 243 GCDs in 300 s imply a
                         # total average of 1.355-1.37 with Power Infusion, Y'Shaarj and Ancient Madness, which is what 1.2929 gives
versatility = 0.0567     # [obs] 0.0528 + 0.0039
# [obs] mastery_value 0.2043 is the per-DoT value of Shadow Weaving (0.5% per point,
# [db2 343690]); +0.0200 for the averaged procs (208 rating, 0.0096 per 100 rating).
# Sources use mastery_scale = 3: SW:P, VT and SW:M all tick ~98% of the fight and
# Voidform counts as three DoTs [simc shadow_weaving_active_dots].
mastery = 0.2243
crit_multiplier = 2.067  # [obs] crit/noncrit from avg damage, crit rate and non-crit avg: 2.060-2.078 on every source but SW:P/VT

# [gear] turns the profiles/MID2_Priest_Shadow.simc items into stats (docs/gear.md).
# Gearless runs (calibration, reference) never read it. The constants below are
# checked against the reference's buffed snapshot (gear without trinkets, kit off):
# ratings, crit, haste, mastery and vers match; spell power is 13 short. SimC's gear check is not done yet.
[gear]
spec_id = 258            # [db2] ChrSpecialization Shadow
primary = "intellect"
base_primary = 611       # [obs] level-90 Void Elf base intellect (as Arcane Spellslinger)
primary_mult = 1.113945  # [simc] x1.05 x1.03 passives x1.03 Arcane Intellect (as Destruction)
spell_power_per_primary = 1.0 # [obs] buffed intellect = spell power
crit_bonus = 0.05        # [obs] 12.91% at 364 rating = 7.91% from rating + 5% base spell crit
haste_mult = 1.03        # [obs] 29.29% at 1123 rating (25.52%): x1.03, multiplicative with rating haste
mastery_points = 10      # [db2] base 8 + 2 Skyfury
mastery_coeff = 0.5      # [db2 343690] % per point, per DoT (Shadow Weaving)
versatility_bonus = 0.03 # [simc] Mark of the Wild
effect_mult = { physical = 1.0815, magic = 1.0609 } # [simc] raid debuffs

[gear.procs] # [obs] time-averaged sample-gear procs, also included in [player] above
spell_power = 38
crit = 0.0384
haste = 0.0              # [player] haste is the snapshot without a proc average (see there)
mastery = 0.0200
versatility = 0.0039

# Omnium traits (omnium_talents= in the profile; docs/gear.md#omnium-traits). The
# calibration reference has these on, so their worth is inside the fitted
# multipliers; a character with fewer gets it taken back out, trait by trait.
# tools/omnium.py ablate at 20,000 iterations: core kit 143,495 with all, 138,303 with
# none, +3.75%. Each value is the leave-one-out ratio, rescaled so the product
# is exactly all / none.
[gear.omnium]
baseline = ["rune_of_unleashed_fire", "rune_of_selfmending", "rune_of_lingering", "rune_of_critical_power", "rune_of_overload"]
traits = [
  { id = "rune_of_unleashed_fire", name = "Rune of Unleashed Fire", global_mult = 1.01950 },   # [simc] leave-one-out 1.03740
  { id = "rune_of_selfmending", name = "Rune of Self-Mending", global_mult = 1.00002 },   # [simc] leave-one-out 1.00004
  { id = "rune_of_lingering", name = "Rune of Lingering", global_mult = 1.00126 },   # [simc] leave-one-out 1.00239
  { id = "rune_of_critical_power", name = "Rune of Critical Power", global_mult = 1.01436 },   # [simc] leave-one-out 1.02748
  { id = "rune_of_overload", name = "Rune of Overload", global_mult = 1.00201 },   # [simc] leave-one-out 1.00383
]

[gear.kit] # [simc] raid-night kit, applied only with gear lines
enabled = 1
precombat = ["full_kit"] # [simc]
stats = { primary = 75.1, mastery_rating = 165, crit_rating = 16, haste_rating = 16 } # [db2/obs] food, rune, flask, oil
primary_buffs = { lights_potential = 695 } # [db2] potion

[fight]
duration = 300           # [obs] Patchwerk reference
variance = 0.2           # [simc]

