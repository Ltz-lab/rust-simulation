[[buffs]]
name = "shadowy_insight"
duration = 10            # [db2 375981]

[[buffs]]
name = "screams_of_the_void"
duration = 3             # [db2 393919]
refresh_extend = true    # [simc] extends on refresh; 67.9 applications x 3 s = 67.5% uptime [obs]
# SW:P and VT tick 40% faster per rank, 2 ranks taken: +80% [db2 375767 #0 +40 to 393919's dummy #1, and
# #1 -28.6 to its tick-time field, i.e. 1/1.4, per rank; talent node 2/2]. Both are flat label modifiers
# (aura 219) that SimC folds into 393919 [simc parse_all_passive_talents]. With SW:P's real 1.74 s base tick this
# one value gives SW:P 362 / VT 202 ticks against 362.5 / 203.4 [obs]; the old 63/85 fit absorbed SW:P's
# wrong 1.6 s base.
tick_rate_pct = { shadow_word_pain = 80, vampiric_touch = 80 }

[[buffs]]
name = "entropic_rift"
duration = 8             # [db2 459314]
on_expire = [
  # Collapsing Void hits, then Voidheart gets its post-rift 8 s (Touch of the Void) and
  # a Voidwraith appears [simc]
  { type = "trigger", ability = "collapsing_void" },
  { type = "consume", buff = "collapsing_void", all = true },
  { type = "consume", buff = "rift_armed", all = true },
  { type = "consume", buff = "darkening_horizon", all = true },
  { type = "buff", buff = "voidheart", duration = 8 },    # [db2 1266856]
  { type = "summon", pet = "voidwraith" },                # [db2 451235]
]

