# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Assassination APL, single target, Deathstalker.

# Potion [simc APL: potion,if=dot.rupture.ticking&(buff.bloodlust.react|fight_remains<30|debuff.deathmark.up)]
[[rotation]]
action = "potion"
if = "dot.rupture.ticking&(buff.bloodlust.up|buff.deathmark.up|fight_remains<30)"

[[rotation]]
action = "thistle_tea"
if = "energy.pct<30|fight_remains<=10"

# Cooldowns: Deathmark right before Kingsbane, once both bleeds are up.
[[rotation]]
action = "deathmark"
if = "dot.garrote.ticking&dot.rupture.ticking&cooldown.kingsbane.remains<=2&buff.envenom.remains>2"

[[rotation]]
action = "kingsbane"
if = "dot.garrote.ticking&dot.rupture.ticking&(buff.deathmark.up|cooldown.deathmark.remains>52)&buff.envenom.up"

# Vanish for an Ambush and a stealth Garrote, only when the current Garrote is
# not already an improved one (our marker for SimC's dot pmultiplier > 1).
[[rotation]]
action = "vanish"
if = "!buff.stealth.up&!buff.vanish.up&!buff.improved_garrote_dot.up&cooldown.garrote.ready&(buff.deathmark.up|cooldown.deathmark.remains>fight_remains-10)"

# Bleeds.
[[rotation]]
action = "garrote"
if = "buff.stealth.up|buff.vanish.up"

[[rotation]]
action = "garrote"
if = "buff.improved_garrote.up&dot.garrote.remains<=20"

[[rotation]]
action = "garrote"
if = "(!dot.garrote.ticking|dot.garrote.remains<=7)&combo_points<7"

[[rotation]]
action = "rupture"
if = "combo_points>=5&dot.rupture.remains<=7&(!buff.darkest_night.up|!dot.rupture.ticking)"

# Spend: keep Envenom up, dump at high energy, and at 7 points for Darkest Night.
[[rotation]]
action = "envenom"
if = "combo_points>=5&(!buff.darkest_night.up|combo_points>=7)&(buff.envenom.remains<=1|buff.deathmark.up|energy.pct>70|fight_remains<=12)"

# Build.
[[rotation]]
action = "fan_of_knives"
if = "buff.darkest_night.up&combo_points=6"

[[rotation]]
action = "ambush"
if = "(buff.stealth.up|buff.vanish.up)&energy>=50"

[[rotation]]
action = "shiv"
if = "combo_points<5|buff.darkest_night.up&combo_points<7"

[[rotation]]
action = "mutilate"
if = "combo_points<5|buff.darkest_night.up&combo_points<7"
