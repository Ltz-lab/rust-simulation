# ---------------------------------------------------------------- finishers / cooldowns

[[abilities]]
name = "envenom"            # [db2 32645]
spell_id = 32645
cost = { energy = 32.9, combo_points = 1 }   # [db2] 35 less Tight Spender 6%
cost_max = { combo_points = 7 }
gcd = 1.0045
gcd_hasted = false
# 0.395 AP per combo point [db2]; Rapid Injection 2/2 multiplies it by 1.40 while
# Envenom's own buff is up (it is triggered before the hit) [db2 455072, simc].
# Amplifying Poison: 10+ stacks are consumed for +35% [db2 381664 #0/#1].
damage = { ap_coeff = 0.553, school = "nature", mastery = true, scale = "spent.combo_points*(1+0.35*(buff.amplifying_poison.stack>=10))" }
on_begin = [
  { type = "if", if = "buff.envenom.up", then = [{ type = "buff", buff = "inspiring_strike", duration = 6 }] },
]
on_start = [
  { type = "if", if = "spent.combo_points>=7", then = [{ type = "buff", buff = "envenom", duration = 7 }] },
  { type = "if", if = "spent.combo_points>=6&spent.combo_points<7", then = [{ type = "buff", buff = "envenom", duration = 6 }] },
  { type = "if", if = "spent.combo_points<6", then = [{ type = "buff", buff = "envenom", duration = 5 }] },
]
on_cast = [
  { type = "gain", resource = "energy", amount_expr = "2*spent.combo_points" },   # Implacable [db2 1298870, simc]
  { type = "if", if = "buff.amplifying_poison.stack>=10", then = [{ type = "buff", buff = "amplifying_poison", set = "buff.amplifying_poison.stack-10" }] },
  { type = "consume", buff = "cold_blood" },
  { type = "if", if = "spent.combo_points>=5&buff.darkest_night.up", then = [
    { type = "consume", buff = "darkest_night" },
    { type = "if", if = "!buff.deathstalkers_mark.up", then = [{ type = "trigger", ability = "dm_apply" }] },
  ], else = [
    { type = "if", if = "spent.combo_points>=5", then = [{ type = "trigger", ability = "dm_consume" }] },
  ] },
  { type = "trigger", ability = "break_stealth" },
]

