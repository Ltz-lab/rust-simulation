  { type = "buff", buff = "slice_and_dice" },
  { type = "buff", buff = "gear_haste" },
  { type = "buff", buff = "deadly_precision" },
]

[[abilities]]
name = "break_stealth"      # attacks break Stealth and Vanish [simc rogue_t::break_stealth]
triggered_only = true
gcd = 0
on_cast = [
  { type = "consume", buff = "stealth" },
  { type = "consume", buff = "vanish" },
]

[[abilities]]
name = "seal_fate_proc"     # a builder crit: 1 combo point [db2 14190]
