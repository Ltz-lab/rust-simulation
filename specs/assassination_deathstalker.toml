# ---------------------------------------------------------------- builders

[[abilities]]
name = "garrote"            # stealth opener / bleed refresh [db2 703]
spell_id = 703
cost = { energy = 45 }      # [db2] not reduced by Tight Spender
gain = { combo_points = 1 } # [db2 703 #2]
cooldown = 6                # [db2] nulled when cast from stealth or Improved Garrote [simc garrote_t]
gcd = 1.0045             # 1s [db2] + SimC's action spacing [obs: 1.004-1.008s]
gcd_hasted = false
on_cast = [
  # Shrouded Suffocation: +2 combo points when cast from Stealth/Vanish [db2 385478 #1]
  { type = "if", if = "buff.stealth.up|buff.vanish.up", then = [{ type = "gain", resource = "combo_points", amount = 2 }] },
  # Improved Garrote: +50% for the dot when stealthed or within the 6s window [db2 392401]
  { type = "if", if = "buff.stealth.up|buff.vanish.up|buff.improved_garrote.up", then = [{ type = "buff", buff = "improved_garrote_dot" }] },
  # Garrote applies Deathstalker's Mark if the target has none [simc garrote_t::execute]
  { type = "if", if = "!buff.deathstalkers_mark.up", then = [{ type = "trigger", ability = "dm_apply" }] },
  # a stealth/Early Improved Garrote cast does not start the cooldown [simc garrote_t::update_ready]
  { type = "if", if = "buff.stealth.up|buff.vanish.up|buff.improved_garrote.up", then = [{ type = "reset_cooldown", ability = "garrote" }] },
  # direct hit for 0 damage in SimC, so it is not an on-hit proc source: the
  # poison rolls are written out here with the same chance [db2 2823, 32645 #2]
  { type = "trigger", ability = "deadly_poison_instant", chance = 0.26 },
  { type = "trigger", ability = "deadly_poison_envenom", chance = 0.21 },
  { type = "trigger", ability = "amplifying_poison", chance = 0.26 },
  { type = "trigger", ability = "amplifying_poison_envenom", chance = 0.21 },
  # a 0-damage hit still rolls a crit for Seal Fate and Cold Blood
  { type = "trigger", ability = "seal_fate_proc", chance = 0.33565 },
  { type = "trigger", ability = "cold_blood_proc", chance = 0.33565 },
  { type = "trigger", ability = "break_stealth" },
]
[abilities.dot]
name = "garrote"
spell_id = 703
ap_coeff = 0.4515          # [db2] per 2s
tick_time = 2.0
duration = 24.0            # [db2] 18s + Razor Wire 6s [db2 1249802]
school = "physical"
mastery = true
crit_damage_bonus = 0.2    # Lethality [db2 382238 #2]
on_tick = [{ type = "if", if = "dot.deadly_poison_dot.ticking", then = [{ type = "gain", resource = "energy", amount = 3 }] }]   # [db2 79134, simc Venomous Wounds]

