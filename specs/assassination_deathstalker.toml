# ---------------------------------------------------------------- auto attacks
# Reference: 541 main-hand executions and 452 hits per fight [obs], i.e. 0.974
# hits per swing at this cadence: a 0.84 hit plus a Skyfury repeat at
# 0.84 x 0.16. Skyfury's repeat always lands (it runs with may_miss = false)
# and only rolls on hits [simc unique_gear.cpp generic::skyfury], so white
# misses live in the 0.84 and the repeat carries no chance to miss of its own.

[[abilities]]
name = "mh_swing"
triggered_only = true
gcd = 0
on_cast = [
  { type = "trigger", ability = "auto_attack_mh", chance = 0.84 },
  { type = "trigger", ability = "mh_repeat", chance = 0.1344 },
]

[[abilities]]
name = "mh_repeat"
triggered_only = true
gcd = 0
on_cast = [{ type = "trigger", ability = "auto_attack_mh" }]

[[abilities]]
name = "oh_swing"
triggered_only = true
gcd = 0
on_cast = [
  { type = "trigger", ability = "auto_attack_oh", chance = 0.84 },
  { type = "trigger", ability = "oh_repeat", chance = 0.1344 },
]

[[abilities]]
name = "oh_repeat"
triggered_only = true
gcd = 0
on_cast = [{ type = "trigger", ability = "auto_attack_oh" }]

[[abilities]]
name = "auto_attack_mh"
triggered_only = true
damage = { ap_coeff = 0.3, school = "physical" }    # dagger 1.8s, AP/6 x speed; scale from calibration
on_cast = [{ type = "if", if = "buff.deathstalkers_mark.up", then = [{ type = "trigger", ability = "hunt_them_down" }] }]

[[abilities]]
name = "auto_attack_oh"
triggered_only = true
damage = { ap_coeff = 0.15, school = "physical" }   # half damage off hand
on_cast = [{ type = "if", if = "buff.deathstalkers_mark.up", then = [{ type = "trigger", ability = "hunt_them_down" }] }]

