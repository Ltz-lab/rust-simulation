# Assassination Rogue — Deathstalker, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Rogue_Assassination.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_rogue.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, spec auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# The spec runs on energy (13.2/s base, hasted) and combo points (7, start 0).
# Builders (Mutilate, Shiv, Fan of Knives, Ambush) generate points, finishers
# (Envenom, Rupture) spend them. Garrote and Rupture are maintained bleeds;
# poisons (Deadly and Amplifying, both lethal through Dragon-Tempered Blades)
# proc from every direct hit, with a higher rate while Envenom is up. Kingsbane
# and Deathmark are the 60s/120s cooldowns. Deathstalker's Mark is applied by
# Garrote; finishers spend its stacks, and the last one arms Darkest Night.
#
# Gear stats come from the [gear] table below. The
# fight's average gear haste and crit procs are folded into `gear_haste` and
# [player].crit (Alacrity included); Lethal Dose, Zoldyck Recipe, Precise
# Killer, Implacable's +20% to the Mark and Hunt Them Down, and the persistent
# multiplier of stealth Garrote (our Improved Garrote buff only covers its 6s
# window) stay in the calibration residuals. See docs/assassination-rogue.md.

name = "Assassination Rogue (Deathstalker, core kit)"

# Stealth + Slice and Dice before the pull [simc APL]. SnD is kept up by
# Cut to the Chase in practice (98% uptime [obs]); here it is one long buff.
precombat = ["stealth_open", "slice_and_dice_open"]

[player]
attack_power = 2644      # [obs] fully buffed snapshot (agility 2519 x Battle Shout 1.05)
weapon_attack_power = 741   # [obs] SimC's ability attack power is 3385 = 2644 + 741 (weapon share)
spell_power = 431        # [obs] only the gear procs below use it
crit = 0.3840            # [obs] 33.565% snapshot + ~4.8pp time-averaged gear crit procs (poison crit rate in the log)
haste = 0.31114          # [obs] rating 1201 (46.24 a point) + Blessing of the Bronze and Skyfury
versatility = 0.05278    # [obs] rating 123 (54 a point) + Mark of the Wild
mastery = 0.43572        # [obs] Potent Assassin: 1.7% per point, 10 base/Skyfury points + rating
crit_multiplier = 2.305  # [obs] 2.0 x Precise Killer +10% x Eyes of the Eagle +2% twice x diamond +0.6%
# Daggers swing every 1.8s [db2]; ability damage comes from coefficients below.
weapon = { min = 0, max = 0, speed = 1.8 }
off_hand = { min = 0, max = 0, speed = 1.8 }

[gear]
primary = "agility"
base_primary = 618            # [obs] level-90 rogue base agility (SimC: 2519 buffed = (618 + 1708 from gear) x 1.08297)
primary_mult = 1.0831        # [obs] buffed 2519 / unbuffed 2326 (the agility probe's +200 gives +217 +-0.5)
attack_power_mult = 1.05      # [obs] Battle Shout: 2519 agility -> 2644 attack power
crit_bonus = 0.12             # [obs] 33.565% at 992 rating = 21.565% from rating + 12%
haste_mult = 1.03             # [obs] 31.11% at 1201 rating (27.30%): x1.03, multiplicative with rating haste
mastery_points = 10           # [obs] 8 base + 2 Skyfury, in mastery points (43.57% at 25.63 points)
mastery_coeff = 1.7           # [obs] Potent Assassin, % per mastery point (10.0 base points fits exactly)
versatility_bonus = 0.03      # [obs] Mark of the Wild
weapon_ap_per_dps = 6.2994    # [obs] weapon_attack_power 741 at 117.64 main-hand DPS
spec_id = 259                 # [db2] ChrSpecialization Assassination

# The time-averaged gear crit procs folded into [player] above (poison crit rate
# in the log), so --gear lands on the same final stats.
[gear.procs]
crit = 0.04835

# Raid-night kit, applied only with gear lines (`--set gear.kit.enabled=0`
# turns it off): SimC's default level-90 consumables for the sample profile
# plus Bloodlust, measured on its buffed stats. [simc]
[gear.kit]
enabled = 1
precombat = ["full_kit"]   # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, crit_rating = 197, haste_rating = 32 }
#   primary 75.1   food 50 + Void-Touched augment rune 25.1 [obs: +87 attack power]
#   crit 165       Flask of the Shattered Sun (rank 2) [simc apl/rogue]
#   crit/haste 32  Thalassian Phoenix Oil (rank 2) on both daggers
primary_buffs = { lights_potential = 695 }   # [db2 1236616] rank-2 Light's Potential

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1          # [simc] rogue_t::available(): re-check at least every 100ms while pooling

[resources.energy]
max = 250                # [db2] 100 + Vigor 2/2 (+100) + Path of Blood (+50)
start = 250              # [obs] full out of combat
regen = 13.2             # [db2] 10 x 1.20 Motivated Murderer x 1.10 Vigor 2/2
regen_hasted = true      # [obs] 18.8 energy/s over the fight at the gear's average haste

[resources.combo_points]
max = 7                  # [db2] 5 + Deeper Stratagem + Sanguine Stratagem
start = 0

[auto_attack]
replace_with = "mh_swing"
off_hand_replace_with = "oh_swing"
wakes = false   # [simc] READY_TRIGGER: a waiting rogue re-checks on resources and every 100ms

# Random gear procs retained by the core reference (weapons, rings, neck).
# Fixed per-hit damage, scaled by spell power; calibration fits the scale.
[[procs]]
ability = "breath_of_corruption"   # Zatha'tek main hand [obs: 20 a fight]
per_minute = 4.04

[[procs]]
ability = "searing_lightwood"      # off-hand enchant [obs: 51 a fight]
per_minute = 9.72

[[procs]]
ability = "rune_of_unleashed_fire" # ring rune [obs: 33 a fight]
per_minute = 9.2

# Poison application. With Dragon-Tempered Blades the rogue runs two lethal
# poisons (Deadly and Amplifying); each rolls separately on every direct hit.
# chance = (0.30 base + 0.30 Envenom) x 0.70 DTB + 0.05 Improved Poisons
# [db2 2823, 32645 #2, 381801 #2, 381624 #1]: 0.26 outside Envenom, 0.47 inside.
# The Envenom half is its own entry, so the buff decides whether it rolls:
# a second roll of 0.21 on top of the 0.26 gives the same expected 0.47 procs
# per hit while Envenom is up [simc sc_rogue.cpp rogue_poison_t::proc_chance].
[[procs]]
ability = "deadly_poison_instant"
chance = 0.26
on_hit = true

[[procs]]
ability = "deadly_poison_envenom"
chance = 0.21
on_hit = true

[[procs]]
ability = "amplifying_poison"
chance = 0.26
on_hit = true

[[procs]]
ability = "amplifying_poison_envenom"
chance = 0.21
on_hit = true

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "stealth"            # out of combat [db2 1784]; broken by the opener
duration = 1e9

[[buffs]]
name = "vanish"             # [db2 11327: 3s]; broken by the next attack
duration = 3

[[buffs]]
name = "improved_garrote"   # 6s after entering stealth: Garrote +50% [db2 392401 #1, simc]
duration = 6
ability_pct = { garrote = 50 }

[[buffs]]
name = "improved_garrote_dot"   # marker: the last Garrote was cast improved (SimC's pmultiplier > 1)
duration = 24

[[buffs]]
name = "slice_and_dice"     # +50% attack speed [db2 315496]; Swift Slasher adds haste [db2 381988]
duration = 1e9
attack_speed_pct = 50
attack_speed_per_haste = 1

[[buffs]]
name = "gear_haste"         # [obs] time-averaged haste of the core kit's gear procs
duration = 1e9              # Rune of Burning Haste 81% uptime and Venomcursed Haste 34%,
haste_pct = 8.77            # from 5,647.6 energy regenerated over 300s (18.83/s vs 13.2 x 1.31114)

[[buffs]]
name = "envenom"            # [db2 32645 #1: +30% poison chance]; duration = combo points spent
duration = 6                # [simc] Envenom's own buff, refreshed by every Envenom
max_stacks = 1

[[buffs]]
name = "inspiring_strike"   # Envenom while Envenom is up: +5% Envenom damage [db2 1250036, simc]
duration = 6
ability_pct = { envenom = 5 }

[[buffs]]
name = "deadly_precision"   # +5% crit to builders and bleeds [db2 381542 #0, #1 label]
duration = 1e9
ability_crit_pct = { garrote = 5, mutilate_mh = 5, mutilate_oh = 5, fan_of_knives = 5, shiv = 5, kingsbane = 5, ambush = 5 }

[[buffs]]
name = "cold_blood"         # a builder crit: +10% Envenom crit, consumed by Envenom [db2 1264297, simc]
duration = 6
ability_crit_pct = { envenom = 10 }

[[buffs]]
name = "darkest_night"      # last Mark stack spent: next 5+ point Envenom +35% and crits [db2 457280]
duration = 30
ability_pct = { envenom = 35 }
ability_crit_pct = { envenom = 100 }

[[buffs]]
name = "deathstalkers_mark" # target debuff, 3 stacks [db2 457129: 60s]
duration = 60
max_stacks = 3

[[buffs]]
name = "unshakeable_drive"  # each Mark stack spent; +50% Mutilate damage [db2 1248775]
duration = 12               # stacks only count uses, so the bonus applies once (flat)
max_stacks = 3
flat = true

[[buffs]]
name = "finish_the_job"     # Deathmark's cast: +10% to most abilities for 16s [db2 1249810, simc]
duration = 16

[[buffs]]
name = "deathmark"          # Deathmark's target debuff: +75% bleed and poison damage [db2 360194 #1]
duration = 16
ability_pct = { garrote = 75, rupture = 75, deadly_poison_dot = 75, deadly_poison_instant = 75, amplifying_poison = 75 }
on_expire = [{ type = "buff", buff = "lingering_darkness" }]

[[buffs]]
name = "lingering_darkness" # 30s after Deathmark ends: +30% to Envenom, Kingsbane, poisons, Mark [db2 457273]
duration = 30

[[buffs]]
name = "kingsbane"          # lethal poison hits while Kingsbane ticks stack it [db2 394095: 14s]
duration = 14               # +20% Kingsbane damage per stack, up to 50 stacks [db2 394095 #0]
max_stacks = 50
ability_pct = { kingsbane = 20 }

[[buffs]]
name = "regicides_reward"   # Kingsbane ends with 5+ stacks: +2% haste per 5 stacks for 20s [db2 1250331]
duration = 20
max_stacks = 10
haste_pct = 2

[[buffs]]
name = "amplifying_poison"  # stack debuff; Envenom consumes 10 for +35% damage [db2 381664 #0/#1]
duration = 12
max_stacks = 20

# ---------------------------------------------------------------- stealth and shared procs

[[abilities]]
name = "stealth_open"
triggered_only = true
gcd = 0
on_cast = [
  { type = "buff", buff = "stealth" },
  { type = "buff", buff = "improved_garrote" },   # the aura arms the 6s window [simc]
]

