on_cast = [{ type = "buff", buff = "cold_blood" }]

# ---------------------------------------------------------------- Deathstalker

[[abilities]]
name = "dm_apply"           # Garrote applies 3 stacks [db2 457052 #0]
triggered_only = true
gcd = 0
on_cast = [
  { type = "buff", buff = "deathstalkers_mark", stacks = 3 },
  { type = "trigger", ability = "dm_consume", chance = 0.30 },   # Quietus Celeris [db2 1273017: 6 in 20]
]

[[abilities]]
name = "dm_consume"         # a 5+ point finisher spends a stack [db2 457052 #1, simc]
triggered_only = true
gcd = 0
on_cast = [{ type = "if", if = "buff.deathstalkers_mark.up", then = [
  { type = "consume", buff = "deathstalkers_mark" },
  { type = "trigger", ability = "deathstalkers_mark_damage" },
  { type = "buff", buff = "unshakeable_drive" },
  { type = "if", if = "!buff.deathstalkers_mark.up", then = [
    { type = "gain", resource = "energy", amount = 30 },   # [db2 457280 #0]
    { type = "buff", buff = "darkest_night" },
  ] },
] }]

[[abilities]]
