# Blood Death Knight — Deathbringer, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust / embellishments; matches the
# core-kit profile tools/make_reference.sh builds from
# profiles/MID2_Death_Knight_Blood_Deathbringer.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_death_knight.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py, not hand-tuned here.
#
# A tank, simulated only for the damage it deals to a Patchwerk boss that hits
# it every 1.5-2s. What the boss does to the death knight matters in a few ways
# and each is its own source: Bone Shield loses a stack on boss hits (outside
# Dancing Rune Weapon windows), Bloody Reflection fires on a hit while Blood
# Shield is up, and Blood Draw never procs (health stays high).
#
# Runes: 6, regenerating 10s/haste, at most 3 at a time [simc]. Heart Strike 1
# (+15 RP, +2 Heartbreaker), Marrowrend 1 (+20 RP, +3 Bone Shield), Death's
# Caress 1 (+10 RP, +2 Bone Shield), Death and Decay 1 (+10 RP; free with
# Crimson Scourge), Reaper's Mark 2 (+20 RP, +3 Bone Shield). Runic power (max
# 125): the rest comes from Runic Attenuation (3, RPPM 15.6), Relish in Blood
# and Blood Mist (2 a second while Dancing Rune Weapon's mist is up). Death
# Strike spends 35 and is the biggest hit in the rotation, so almost every RP
# is turned into one.
#
# Deathbringer: Reaper's Mark (45s) explodes for 40 stacks of 0.544 AP when its
# debuff reaches the stack cap, 3-11s later, and arms two Exterminates; every
# Dancing Rune Weapon arms one. Marrowrend consumes an Exterminate and fires it
# 500ms later (12.88 AP, then 5.72 AP). Wave of Souls hits twice per Mark.
#
# Dancing Rune Weapon (120s with Insatiable Blade) and Dance of Midnight (12.5%
# per rune spent, 8s) summon pets that copy the death knight's Death Strike,
# Heart Strike, Marrowrend, Blood Boil, Blood Plague and swings. They are
# modelled as echoes: a share of each of the player's hits, with the shares
# measured per source from the reference (see the echo buffs).

name = "Blood Death Knight (Deathbringer, core kit)"

precombat = ["gear_procs_start", "deaths_caress"]

[player]
# SimC's buffed snapshot (raid buffs, no procs). Damage uses the sheet attack
# power plus ~1000 flat base attack power from the two-hander's DPS, and
# Blood's mastery adds attack power x(1 + 0.5 x mastery value) [db2 77513].
attack_power = 3387      # [obs] 2387 strength-derived + 1000 flat [simc]: the strength probe (+265 sheet AP) adds 6.2% damage
mastery = 0.2858         # [obs] 0.5455 x the sheet's 52.39%: the mastery probe lifts every source 9.35%, the sheet's attack power only 8.6%
crit = 0.2587            # [obs]
haste = 0.334            # [obs] the GCD averages 1.124s in the log: sheet 23.29% plus Berserking, Parry Haste and the like
versatility = 0.1252     # [obs]
crit_multiplier = 2.08   # [obs] DK direct crits, as Frost
# Two-hander, 3.6s [db2 Mazeroa, Warlord's Fury]
weapon = { min = 0, max = 0, speed = 3.6 }

# How `--gear profile.simc` turns gear into the [player] stats above (see
# docs/gear.md). All [obs] from SimC's reported stats unless tagged.
[gear]
primary = "strength"
base_primary = 464.4           # [obs] 2387 AP (3387 less the 1000 flat) less the items' strength
primary_mult = 1.05           # [obs] plate specialization
attack_power_mult = 1.0815    # [obs] Battle Shout x1.05 and Skyfury x1.03
crit_bonus = 0.05             # [obs] 25.87% on the sheet at 960 rating (20.87% from rating): Wild Strikes-type passives
haste_mult = 1.04             # [obs] 23.29% on the sheet at 816 rating (18.55% from rating)
mastery_points = 10           # [obs] 8 base + 2 Skyfury
mastery_ap = 0.5455           # read by tools/validate_stats.py: damage scales with (1 + 0.5455 x the sheet's mastery value)
mastery_coeff = 1.0909        # [obs] mastery_ap x the sheet's 2.0% a point (Blood Shield, 26.2 points = 52.39%)
versatility_bonus = 0.03      # [obs] Mark of the Wild
weapon_ap_per_dps = 6.4189    # [obs] the flat 1000 attack power at the 155.8 DPS two-hander, as Unholy
spec_id = 250                 # [db2] ChrSpecialization

# The time-averaged haste above the sheet: Berserking, Parry Haste and the like
# (the GCD averages 1.124s in the log = 33.4% haste), folded into [player].haste
[gear.procs]
haste = 0.1011

# Raid-night kit with gear lines (see Ret): SimC's default level-90 Blood
# consumables plus Bloodlust. --set gear.kit.enabled=0 for core-kit runs.
[gear.kit]
enabled = 1
precombat = ["full_kit"]      # Bloodlust at the pull; unlocks the potion
stats = { primary = 69.1, versatility_rating = 165, crit_rating = 16, haste_rating = 16 }
primary_buffs = { draught_of_rampant_abandon = 870 }   # Draught of Rampant Abandon [simc unique_gear_midnight.cpp 1236998]: fitted to SimC's +4.1% DPS, 27.5s uptime a use
#   primary 69.1   Silvermoon Parade and the Void-Touched augment rune [obs: sheet attack power +99]
#   vers 165       Flask of Thalassian Resistance (rank 2) [obs: SimC buffed stats]
#   crit/haste 16  Thalassian Phoenix Oil (rank 2) on the main hand [obs]

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1          # [simc] death_knight_t::available(): re-check while pooling runes/RP
ready_tolerance = 1e-5

[resources.runes]
max = 6                  # [db2]
start = 6                # [obs]
regen = 0.2998           # [obs] 115.2 runes a fight at 33.4% haste (0.384/s); 0.40/s here, the engine spends runes as they arrive and never banks the 2 Reaper's Mark needs, so 0.40 restores its 7 Marks
regen_hasted = true      # [simc] 10s / haste a rune

[resources.runic_power]
max = 125                # [obs] "runic_power 24.00/125.00" in the log
start = 0

[auto_attack]
replace_with = "auto_attack_mh"
wakes = false

# ---------------------------------------------------------------- procs

# Skyfury raid buff: 20% to repeat the swing [obs 28.7 a fight]
[[procs]]
ability = "skyfury_mh"
on_hit = true
chance = 0.167          # chained: the repeat can proc again; 28.7 of 172 hits
sources = ["auto_attack_mh"]

# Runic Attenuation: real PPM, hasted, 3 RP [obs 78 procs a fight]
[[procs]]
ability = "runic_attenuation"
on_hit = true
per_minute = 10.7
hasted = true

# Bloody Reflection: a hit while Blood Shield is up, 0.5s ICD [obs 25.2 a fight]
[[procs]]
ability = "bloody_reflection"
per_minute = 5.04

# Bone Shield loses a stack to boss hits, but not while a Dancing Rune Weapon is
# out [obs 29 a fight, none inside the windows]
[[procs]]
ability = "bone_shield_loss"
per_minute = 4.8

# Rune of Unleashed Fire (Omnium) [obs: 50.1 a fight]
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 10.0

# Venomfang [obs: 38.3 a fight]
[[procs]]
ability = "venomfang_proc"
per_minute = 7.66

# Pets that are not Dancing Rune Weapon: the ghoul (auto attacks, Claw) and
# the Bloodworms [obs: 143.9 ghoul swings, 7.5 Claws, 428.7 worm swings]
[[procs]]
ability = "ghoul_swing"
per_minute = 28.8
[[procs]]
ability = "ghoul_claw"
per_minute = 1.5
[[procs]]
ability = "bloodworm_swing"
per_minute = 86

