# ---------------------------------------------------------------- rotation
# SimC's default single-target APL for this profile (Deathbringer): the
# cooldown lines, then the deathbringer list.

[[rotation]]
action = "vampiric_blood"
if = "!buff.vampiric_blood.up"

[[rotation]]
action = "potion"
if = "cooldown.dancing_rune_weapon.remains>78|fight_remains<=30"

[[rotation]]
action = "dancing_rune_weapon"
if = "!buff.exterminate.up&!buff.reapers_mark_debuff.up&(fight_remains>95|fight_remains<25|time>300)"

[[rotation]]
action = "death_strike"
if = "runic_power.max-runic_power<20|(runic_power.max-runic_power<26&(buff.dancing_rune_weapon.up|buff.dance_of_midnight.up))"

[[rotation]]
action = "death_and_decay"
if = "!buff.death_and_decay.up"

[[rotation]]
action = "reapers_mark"

[[rotation]]
action = "marrowrend"
if = "buff.exterminate.up"

[[rotation]]
action = "deaths_caress"
if = "(!buff.bone_shield.up|buff.bone_shield.remains<3|buff.bone_shield.stack<6)&runes<4"

[[rotation]]
action = "marrowrend"
if = "!buff.bone_shield.up|buff.bone_shield.remains<3|buff.bone_shield.stack<6"

[[rotation]]
action = "death_strike"

[[rotation]]
action = "blood_boil"

[[rotation]]
action = "consumption"
if = "!buff.dancing_rune_weapon.up&!buff.dance_of_midnight.up"

[[rotation]]
action = "heart_strike"

[[rotation]]
action = "consumption"
