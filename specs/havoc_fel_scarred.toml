# ---------------------------------------------------------------- rotation [simc APL, single target]

[[rotation]]
action = "metamorphosis"
if = "!buff.demonsurge_annihilation.up&!buff.demonsurge_death_sweep.up&(!cooldown.blade_dance.up|!cooldown.death_sweep.up)&buff.eye_beam_lockout.remains>8"

[[rotation]]
action = "the_hunt"
if = "buff.eye_beam_lockout.remains<10&buff.metamorphosis.remains>15|(buff.eye_beam_lockout.up&buff.metamorphosis.up)"

[[rotation]]
action = "vengeful_retreat"
if = "!buff.initiative.up"

[[rotation]]
action = "essence_break"
if = "buff.demonsurge_death_sweep.up|buff.demonsurge_annihilation.up"

[[rotation]]
action = "death_sweep"
if = "buff.essence_break.up|buff.demonsurge_death_sweep.up"

[[rotation]]
action = "annihilation"
if = "buff.essence_break.up|buff.demonsurge_annihilation.up"

[[rotation]]
action = "abyssal_gaze_empowered"
if = "!buff.eye_beam_lockout.up&buff.metamorphosis.up&buff.empowered_eye_beam.up&!buff.demonsurge_death_sweep.up&!buff.demonsurge_annihilation.up"

[[rotation]]
action = "abyssal_gaze"
if = "!buff.eye_beam_lockout.up&buff.metamorphosis.up&!buff.empowered_eye_beam.up&!buff.demonsurge_death_sweep.up&!buff.demonsurge_annihilation.up"

[[rotation]]
action = "eye_beam_empowered"
if = "!buff.eye_beam_lockout.up&!buff.metamorphosis.up&buff.empowered_eye_beam.up"

[[rotation]]
action = "eye_beam"
if = "!buff.eye_beam_lockout.up&!buff.metamorphosis.up&!buff.empowered_eye_beam.up"

[[rotation]]
action = "immolation_aura"
if = "buff.demonsurge_consuming_fire.up&buff.demonsurge.remains<gcd"

[[rotation]]
action = "essence_break"
if = "buff.eye_beam_lockout.remains>4"

[[rotation]]
action = "death_sweep"

[[rotation]]
action = "blade_dance"
if = "!buff.metamorphosis.up"

[[rotation]]
action = "annihilation"

[[rotation]]
action = "felblade"
if = "fury<=100"

[[rotation]]
action = "chaos_strike"
if = "!buff.metamorphosis.up"

[[rotation]]
action = "felblade"

[[rotation]]
action = "immolation_aura"

[[rotation]]
action = "arcane_torrent"
