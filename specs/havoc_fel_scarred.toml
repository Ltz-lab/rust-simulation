# ---------------------------------------------------------------- rotation [simc APL, single target]
#
# SimC puts Blade Dance and Death Sweep on one shared cooldown (`cooldown.blade_dance`,
# whose length is whichever was cast last). The two are modelled with their own
# cooldowns here, so the APL's `!cooldown.blade_dance.up` gate on Metamorphosis is
# dropped rather than being read as Blade Dance's longer 15s cooldown: with it, the
# Blade Dance that follows every Demonic window blocks the hardcast Metamorphosis
# for another 10s and Metamorphosis falls from 2.8 casts a fight to 2.1.

[[rotation]]
action = "potion"           # only with [gear.kit] [simc APL: cooldown.metamorphosis.up&(cooldown.eye_beam.up|!talent.chaotic_transformation)|fight_remains<=30]
if = "cooldown.metamorphosis.ready&cooldown.eye_beam.ready|fight_remains<31"

[[rotation]]
action = "metamorphosis"
if = "!buff.demonsurge_annihilation.up&!buff.demonsurge_death_sweep.up&buff.eye_beam_lockout.remains>8"   # [simc] minus its shared Blade Dance/Death Sweep cooldown check, see the note above

[[rotation]]
action = "the_hunt"
if = "buff.eye_beam_lockout.remains<10&cooldown.metamorphosis.remains>15|(!buff.eye_beam_lockout.up&cooldown.metamorphosis.up)"   # [simc] lines The Hunt up with Eye Beam

[[rotation]]
action = "vengeful_retreat"
if = "!buff.initiative.up"

[[rotation]]
action = "essence_break"
if = "buff.demonsurge_death_sweep.up|buff.demonsurge_annihilation.up"

[[rotation]]
action = "death_sweep"
if = "buff.essence_break.up|buff.demonsurge_death_sweep.up"

[[rotation]]
action = "annihilation"
if = "buff.essence_break.up|buff.demonsurge_annihilation.up"

[[rotation]]
action = "abyssal_gaze_empowered"
if = "!buff.eye_beam_lockout.up&buff.metamorphosis.up&buff.empowered_eye_beam.up&!buff.demonsurge_death_sweep.up&!buff.demonsurge_annihilation.up"

[[rotation]]
action = "abyssal_gaze"
if = "!buff.eye_beam_lockout.up&buff.metamorphosis.up&!buff.empowered_eye_beam.up&!buff.demonsurge_death_sweep.up&!buff.demonsurge_annihilation.up"

[[rotation]]
action = "eye_beam_empowered"
if = "!buff.eye_beam_lockout.up&!buff.metamorphosis.up&buff.empowered_eye_beam.up"

[[rotation]]
action = "eye_beam"
if = "!buff.eye_beam_lockout.up&!buff.metamorphosis.up&!buff.empowered_eye_beam.up"

[[rotation]]
action = "immolation_aura"
if = "buff.demonsurge_consuming_fire.up&buff.demonsurge.remains<gcd"

[[rotation]]
action = "essence_break"
if = "buff.eye_beam_lockout.remains>4"

[[rotation]]
action = "death_sweep"

[[rotation]]
action = "blade_dance"
if = "!buff.metamorphosis.up"

[[rotation]]
action = "annihilation"

[[rotation]]
action = "felblade"
if = "fury<=100"

[[rotation]]
action = "chaos_strike"
if = "!buff.metamorphosis.up"

[[rotation]]
action = "felblade"

[[rotation]]
action = "immolation_aura"

[[rotation]]
action = "arcane_torrent"
