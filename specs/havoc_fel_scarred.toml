# Annihilation: Chaos Strike inside Metamorphosis [simc 201427]
[[abilities]]
name = "annihilation"
cost = { fury = 40 }                                 # [db2 201427]
requires_buff = "metamorphosis"
damage = { ap_coeff = 0.9567, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 227518]
source = "annihilation_damage_1"
on_cast = [
  { type = "trigger", ability = "annihilation_damage_2", delay = 0.3 },
  { type = "trigger", ability = "annihilation_refund", chance_expr = "0.10+crit", delay = 0.3 },   # [obs] as Chaos Strike
  { type = "consume", buff = "chaos_theory", all = true },
  { type = "extend_buff", buff = "metamorphosis", seconds = 0.333 },                   # [simc] Shattered Destiny: 0.1s per 12 fury [db2 388116]
  { type = "if", if = "buff.demonsurge_annihilation.up", then = [
      { type = "consume", buff = "demonsurge_annihilation", all = true },
      { type = "trigger", ability = "demonsurge", delay = 0.45 },                        # [simc] trigger_demonsurge delay
  ] },
]

[[abilities]]
name = "annihilation_damage_2"
triggered_only = true
damage = { ap_coeff = 1.5034, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 201428]

[[abilities]]
