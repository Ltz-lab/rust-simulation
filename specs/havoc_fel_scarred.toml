# Havoc Demon Hunter — Fel-Scarred, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Demon_Hunter_Havoc.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_demon_hunter.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# Fury (170 max) is built by Demon Blades on every auto-attack hit, Immolation
# Aura (20 on cast, 3 a tick), Felblade, Vengeful Retreat (Tactical Retreat:
# 8 a second for 10s), Arcane Torrent and Chaos Strike's off-hand refund;
# Chaos Strike/Annihilation (40), Blade Dance/Death Sweep (35), Eye Beam and
# Abyssal Gaze (30) spend it. Eye Beam (Demonic) opens Metamorphosis, inside
# which Annihilation and Death Sweep replace the base abilities; Metamorphosis
# also resets Eye Beam and Blade Dance (Chaotic Transformation) and Immolation
# Aura (Violent Transformation). Fel-Scarred: Eye Beam/Abyssal Gaze and
# Metamorphosis hand out Demonsurge empowerments, and every empowered cast
# fires a Demonsurge hit; Burning Blades rolls 35% of every direct hit into a
# 6s DoT.

name = "Havoc Demon Hunter (Fel-Scarred, core kit)"

# Immolation Aura is up before the pull [simc APL: actions.precombat]
precombat = ["isolated_prey_marker", "immolation_aura"]

[player]
attack_power = 2784          # [obs] buffed snapshot (agility 2652 x Battle Shout)
weapon_attack_power = 700    # [obs] +200 agility gives +6.4%: about a sixth of ability damage is the flat weapon part
crit = 0.3696                # [obs] buffed snapshot
haste = 0.1686               # [obs] buffed snapshot; Metamorphosis and Furious Gaze add on top
versatility = 0.0898         # [obs] buffed snapshot
mastery = 0.877              # [obs] Mastery: Demonic Presence [db2 185164], all chaos-school abilities
crit_multiplier = 2.4        # [obs] crit/non-crit of Chaos Strike; Know Your Enemy + Critical Chaos [db2 388118, 320413]
# [db2] 2.6s warglaives. [obs] The effective cadence is slower: Vengeful Retreat
# leaps out of melee range and cancels a swing or two each cast, so the reference
# sees 139.8 landed main-hand hits a fight where a pure 2.6s cadence gives ~159.
weapon = { min = 7500, max = 8000, speed = 2.94 }   # [obs] effective swing interval 2.04s
off_hand = { min = 0, max = 0, speed = 3.02 }       # [obs] the off hand lands 136.1 a fight

[gear]
primary = "agility"
base_primary = 621            # [obs] level-90 blood elf demon hunter base agility (SimC report: 2339 at the pull = 621 + 1718 from gear)
primary_mult = 1.0            # [obs] no agility raid buff
attack_power_mult = 1.1904    # [obs] 2339 agility -> 2784 attack power and the +200 agility probe -> 3022: Battle Shout x1.05 times a +13.37% class aura
crit_bonus = 0.11             # [obs] 36.96% at 1194 rating (25.96% from rating)
haste_mult = 1.05             # [obs] 16.86% at 497 rating (11.30% from rating), multiplicative with rating haste
mastery_points = 12           # [obs] 8 base + 2 Skyfury + 2, in mastery points
mastery_coeff = 2.25          # [db2 185164] Mastery: Demonic Presence, % per mastery point
versatility_bonus = 0.07      # [obs] 8.98% at 107 rating (1.98% from rating)
weapon_ap_per_dps = 5.9505    # [obs] weapon_attack_power 700 at 117.64 main-hand DPS
spec_id = 577                 # [db2] ChrSpecialization
# Damage of the library's gear procs (data/item_effects.toml): the raid debuffs
# the calibrated sources carry in their fitted multipliers, Chaos Brand (+3%
# magic), Mystic Touch (+5% physical) and Hunter's Mark (+3%). [simc]
effect_mult = { physical = 1.0815, magic = 1.0609 }

# Raid-night kit with gear lines: SimC's default level-90 Havoc consumables plus
# Bloodlust. --set gear.kit.enabled=0 for core-kit runs.
[gear.kit]
enabled = 1
precombat = ["full_kit"]      # Bloodlust at the pull; unlocks the potion
stats = { primary = 25.1, crit_rating = 262, haste_rating = 32 }
#   primary 25.1   Void-Touched augment rune [db2 1264426; obs +25 agility]
#   crit 165       Flask of the Shattered Sun (rank 2) [obs: SimC's buffed stats]
#   crit 65        Blooming Feast [obs: SimC's buffed stats]
#   crit/haste 32  Thalassian Phoenix Oil (rank 2) on both warglaives [obs: 16 each]

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1
ready_tolerance = 1e-5

[resources.fury]
max = 170                    # [obs] "/170.00" in the log
start = 0

[auto_attack]
replace_with = "mh_swing"
off_hand_replace_with = "oh_swing"

# Isolated Prey is a passive; the marker just switches it on at the pull
[[abilities]]
name = "isolated_prey_marker"
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "isolated_prey" }]

# Raid-night kit (see [gear.kit]); only with gear lines
[[abilities]]
name = "full_kit"
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "full_kit" }, { type = "buff", buff = "bloodlust" }]

# Potion of Recklessness: highest secondary up, lowest down [db2 1236994]
[[abilities]]
name = "potion"
spell_id = 1236994
gcd = 0
cooldown = 300
requires_buff = "full_kit"
on_cast = [{ type = "buff", buff = "recklessness" }]

# ---------------------------------------------------------------- auto attacks
# A dual-wielded white swing misses 16.3% of the time ([obs] SimC's own result
# split: 139.8 of 167.1 a fight land), and the Skyfury raid buff repeats 20% of
# swings [simc]. A repeat is a fresh swing with its own miss roll, so the swing
# effects route through the wrapper and only landed hits run the on-hit procs.

[[abilities]]
name = "mh_swing"
triggered_only = true
gcd = 0
on_cast = [
  { type = "trigger", ability = "auto_attack_mh", chance = 0.837 },
  { type = "trigger", ability = "mh_repeat", chance = 0.20 },
]

[[abilities]]
name = "mh_repeat"
triggered_only = true
gcd = 0
on_cast = [{ type = "trigger", ability = "auto_attack_mh", chance = 0.837 }]

[[abilities]]
name = "oh_swing"
triggered_only = true
gcd = 0
on_cast = [
  { type = "trigger", ability = "auto_attack_oh", chance = 0.837 },
  { type = "trigger", ability = "oh_repeat", chance = 0.20 },
]

[[abilities]]
name = "oh_repeat"
triggered_only = true
gcd = 0
on_cast = [{ type = "trigger", ability = "auto_attack_oh", chance = 0.837 }]

[[abilities]]
name = "auto_attack_mh"
triggered_only = true
damage = { ap_coeff = 0.1857, weapon_mult = 1.0, school = "physical", feed = [{ dot = "burning_blades", pct = 35 }] }   # [simc] 2.6s/14 of AP on a swing, plus burning_blades_trigger_t

[[abilities]]
name = "auto_attack_oh"
triggered_only = true
damage = { ap_coeff = 0.1857, weapon_mult = 1.0, school = "physical", mult = 0.5, feed = [{ dot = "burning_blades", pct = 35 }] }   # [obs] off-hand hits at 49% of the main hand's

# Demon Blades: every auto-attack hit deals shadow damage and builds fury [simc 203555]
[[abilities]]
name = "demon_blades"
triggered_only = true
damage = { ap_coeff = 0.464, school = "shadow" }   # [db2 203796]
gain = { fury = 15 }                               # [obs] 15 fury a hit (13 base + delta)

[[procs]]
ability = "demon_blades"
on_hit = true
chance = 1.0
sources = ["auto_attack_mh", "auto_attack_oh"]

# ---------------------------------------------------------------- spenders

# Chaos Strike: main hand now, off hand 300ms later [simc 162794]
[[abilities]]
name = "chaos_strike"
cost = { fury = 40 }                                 # [db2 162794]
damage = { ap_coeff = 0.736, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 222031]
source = "chaos_strike_damage_1"
on_cast = [
  { type = "trigger", ability = "chaos_strike_damage_2", delay = 0.3 },
  { type = "trigger", ability = "chaos_strike_refund", chance_expr = "0.10+crit", delay = 0.3 },   # [obs] Critical Chaos: the refund chance follows crit (10% + crit chance fits the crit probe; ~50% of casts refund at the snapshot)
  { type = "consume", buff = "chaos_theory", all = true },
]

[[abilities]]
name = "chaos_strike_damage_2"
triggered_only = true
