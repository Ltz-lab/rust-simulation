cost = { fury = 40 }                                 # [db2 162794]
damage = { ap_coeff = 0.736, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 222031]
source = "chaos_strike_damage_1"
on_cast = [
  { type = "trigger", ability = "chaos_strike_damage_2", delay = 0.3 },
  { type = "trigger", ability = "chaos_strike_refund", chance = 0.45, delay = 0.3 },   # [obs] 0.42-0.46 refunds a cast
  { type = "consume", buff = "chaos_theory", all = true },
]

[[abilities]]
name = "chaos_strike_damage_2"
triggered_only = true
damage = { ap_coeff = 1.1567, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 199547]

[[abilities]]
name = "chaos_strike_refund"
triggered_only = true
gain = { fury = 20 }                                 # [obs] 20 fury a refund

# Annihilation: Chaos Strike inside Metamorphosis [simc 201427]
[[abilities]]
name = "annihilation"
cost = { fury = 40 }                                 # [db2 201427]
requires_buff = "metamorphosis"
damage = { ap_coeff = 0.9567, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 227518]
source = "annihilation_damage_1"
on_cast = [
  { type = "trigger", ability = "annihilation_damage_2", delay = 0.3 },
  { type = "trigger", ability = "annihilation_refund", chance = 0.45, delay = 0.3 },   # [obs]
  { type = "consume", buff = "chaos_theory", all = true },
  { type = "extend_buff", buff = "metamorphosis", seconds = 0.333 },                   # [simc] Shattered Destiny: 0.1s per 12 fury [db2 388116]
  { type = "if", if = "buff.demonsurge_annihilation.up", then = [
      { type = "consume", buff = "demonsurge_annihilation", all = true },
      { type = "trigger", ability = "demonsurge", delay = 0.45 },                        # [simc] trigger_demonsurge delay
  ] },
]

[[abilities]]
name = "annihilation_damage_2"
triggered_only = true
damage = { ap_coeff = 1.5034, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 201428]

[[abilities]]
name = "annihilation_refund"
triggered_only = true
gain = { fury = 20 }

# Relentless Onslaught: 10% of off-hand hits repeat the strike, 1s ICD [simc 389977]
[[procs]]
ability = "annihilation_onslaught_damage_1"
on_hit = true
chance = 0.10
icd = 1.0
sources = ["chaos_strike_damage_2", "annihilation_damage_2"]

[[abilities]]
name = "annihilation_onslaught_damage_1"
triggered_only = true
damage = { ap_coeff = 0.9567, school = "chaos", mastery = true }   # [db2 227518]
on_cast = [{ type = "trigger", ability = "annihilation_onslaught_damage_2", delay = 0.3 }]

[[abilities]]
name = "annihilation_onslaught_damage_2"
triggered_only = true
damage = { ap_coeff = 1.5034, school = "chaos", mastery = true }   # [db2 201428]

# Blade Dance: 3 AoE hits then a heavier one; First Blood splits the main target [simc 188499, 206416]
[[abilities]]
name = "blade_dance"
cost = { fury = 35 }                                 # [db2 188499]
cooldown = 15                                        # [db2 188499] category cooldown
cooldown_hasted = true                               # [simc] havoc_demon_hunter aura
damage = { ap_coeff = 0.2475, school = "chaos", mastery = true, hits = 3, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 391374]
source = "blade_dance_first_blood"
on_cast = [
  { type = "trigger", ability = "blade_dance_first_blood_4", delay = 0.7 },
  { type = "buff", buff = "chaos_theory" },
  { type = "if", if = "buff.eternal_hunt.up", then = [
      { type = "consume", buff = "eternal_hunt", all = true },
      { type = "reset_cooldown", ability = "blade_dance" },
      { type = "reset_cooldown", ability = "death_sweep" },
  ] },
]

[[abilities]]
name = "blade_dance_first_blood_4"
triggered_only = true
damage = { ap_coeff = 0.742, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 391378]

# Death Sweep: Blade Dance inside Metamorphosis [simc 210152]
[[abilities]]
name = "death_sweep"
cost = { fury = 35 }                                 # [db2 210152]
cooldown = 9                                         # [db2 210152] category cooldown
cooldown_hasted = true
requires_buff = "metamorphosis"
damage = { ap_coeff = 0.3218, school = "chaos", mastery = true, hits = 3, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 393055]
source = "death_sweep_first_blood"
on_cast = [
  { type = "trigger", ability = "death_sweep_first_blood_4", delay = 0.7 },
  { type = "buff", buff = "chaos_theory" },
  { type = "extend_buff", buff = "metamorphosis", seconds = 0.292 },
  { type = "if", if = "buff.eternal_hunt.up", then = [
      { type = "consume", buff = "eternal_hunt", all = true },
      { type = "reset_cooldown", ability = "blade_dance" },
      { type = "reset_cooldown", ability = "death_sweep" },
  ] },
  { type = "if", if = "buff.demonsurge_death_sweep.up", then = [
      { type = "consume", buff = "demonsurge_death_sweep", all = true },
      { type = "trigger", ability = "demonsurge", delay = 0.7 },                          # [simc] Death Sweep's 700ms delay
  ] },
]

[[abilities]]
name = "death_sweep_first_blood_4"
triggered_only = true
damage = { ap_coeff = 0.9646, school = "chaos", mastery = true, feed = [{ dot = "burning_blades", pct = 35 }] }   # [db2 393054]

# ---------------------------------------------------------------- Eye Beam / Abyssal Gaze

# Eye Beam: 2s channel, ~11 ticks; Demonic opens Metamorphosis for 5s + the hasted channel [simc 198013, 213410].
# Abyssal Gaze is the same channel inside Metamorphosis, with Demonic Intensity's +30% [db2 452497, 452489];
# Eternal Hunt's empowered Eye Beam ticks hit twice as hard [db2 1271092; obs 19299 vs 9571 non-crit].
# All four share one lockout: SimC puts Eye Beam and Abyssal Gaze on the same cooldown, and Cycle of Hatred's
# 2.5s-a-stack cut takes the 30s category cooldown to ~20s in steady state [obs: casts 20-22s apart].
[[abilities]]
name = "eye_beam"
cost = { fury = 30 }                                 # [db2 198013]
channel = { ticks = 11 }
dot = { name = "eye_beam_tick", tick_time = 0.2, duration = 2.2, hasted = true, ap_coeff = 0.4026, school = "chaos", mastery = true, on_tick = [{ type = "gain", resource = "fury", amount = 2 }] }   # [db2 198030; obs 2 fury a tick]
on_start = [
  { type = "buff", buff = "eye_beam_lockout", duration = 20 },
  { type = "if", if = "!buff.metamorphosis.up", then = [
      { type = "trigger", ability = "demonsurge", delay = 0.7 },                          # [simc] Volatile Instinct enters Meta with a surge
  ] },
  { type = "buff", buff = "demonsurge_annihilation" },
  { type = "buff", buff = "demonsurge_death_sweep" },
  { type = "buff", buff = "metamorphosis", duration = 7.75 },                             # [obs] 5s Demonic + the hasted channel (~2.7s)
  { type = "extend_buff", buff = "metamorphosis", seconds = 0.25 },                       # [simc] Shattered Destiny
]
on_cast = [
  { type = "buff", buff = "furious_gaze" },
  { type = "buff", buff = "eternal_hunt" },
  { type = "consume", buff = "empowered_eye_beam", all = true },
]

[[abilities]]
name = "eye_beam_empowered"
cost = { fury = 30 }
channel = { ticks = 11 }
dot = { name = "eye_beam_empowered_tick", tick_time = 0.2, duration = 2.2, hasted = true, ap_coeff = 0.4026, mult = 2.0, school = "chaos", mastery = true, on_tick = [{ type = "gain", resource = "fury", amount = 2 }] }   # [obs] 19299 vs 9571 non-crit
on_start = [
  { type = "buff", buff = "eye_beam_lockout", duration = 20 },
  { type = "if", if = "!buff.metamorphosis.up", then = [
      { type = "trigger", ability = "demonsurge", delay = 0.7 },
  ] },
  { type = "buff", buff = "demonsurge_annihilation" },
  { type = "buff", buff = "demonsurge_death_sweep" },
  { type = "buff", buff = "metamorphosis", duration = 7.75 },
  { type = "extend_buff", buff = "metamorphosis", seconds = 0.25 },
]
on_cast = [
  { type = "buff", buff = "furious_gaze" },
  { type = "buff", buff = "eternal_hunt" },
  { type = "consume", buff = "empowered_eye_beam", all = true },
]

[[abilities]]
name = "abyssal_gaze"
cost = { fury = 30 }
requires_buff = "metamorphosis"
channel = { ticks = 11 }
dot = { name = "abyssal_gaze_tick", tick_time = 0.2, duration = 2.2, hasted = true, ap_coeff = 0.4026, mult = 1.313, school = "chaos", mastery = true, on_tick = [{ type = "gain", resource = "fury", amount = 2 }] }   # [db2 452489 #4] +30% Eye Beam
on_start = [
  { type = "buff", buff = "eye_beam_lockout", duration = 20 },
  { type = "buff", buff = "demonsurge_annihilation" },
  { type = "buff", buff = "demonsurge_death_sweep" },
  { type = "buff", buff = "metamorphosis", duration = 7.75 },
  { type = "extend_buff", buff = "metamorphosis", seconds = 0.25 },
]
on_cast = [
  { type = "buff", buff = "furious_gaze" },
  { type = "buff", buff = "eternal_hunt" },
  { type = "consume", buff = "empowered_eye_beam", all = true },
  { type = "if", if = "buff.demonsurge_abyssal_gaze.up", then = [
      { type = "consume", buff = "demonsurge_abyssal_gaze", all = true },
      { type = "trigger", ability = "demonsurge", delay = 0.45 },
  ] },
]

[[abilities]]
name = "abyssal_gaze_empowered"
cost = { fury = 30 }
requires_buff = "metamorphosis"
channel = { ticks = 11 }
dot = { name = "abyssal_gaze_empowered_tick", tick_time = 0.2, duration = 2.2, hasted = true, ap_coeff = 0.4026, mult = 2.626, school = "chaos", mastery = true, on_tick = [{ type = "gain", resource = "fury", amount = 2 }] }   # [obs] 25184 vs 9571 non-crit
on_start = [
  { type = "buff", buff = "eye_beam_lockout", duration = 20 },
  { type = "buff", buff = "demonsurge_annihilation" },
  { type = "buff", buff = "demonsurge_death_sweep" },
  { type = "buff", buff = "metamorphosis", duration = 7.75 },
  { type = "extend_buff", buff = "metamorphosis", seconds = 0.25 },
]
on_cast = [
  { type = "buff", buff = "furious_gaze" },
  { type = "buff", buff = "eternal_hunt" },
  { type = "consume", buff = "empowered_eye_beam", all = true },
  { type = "if", if = "buff.demonsurge_abyssal_gaze.up", then = [
      { type = "consume", buff = "demonsurge_abyssal_gaze", all = true },
      { type = "trigger", ability = "demonsurge", delay = 0.45 },
  ] },
]

