# Havoc Demon Hunter — Fel-Scarred, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Demon_Hunter_Havoc.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_demon_hunter.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# Fury (170 max) is built by Demon Blades on every auto-attack hit, Immolation
# Aura (20 on cast, 3 a tick), Felblade, Vengeful Retreat (Tactical Retreat:
# 8 a second for 10s), Arcane Torrent and Chaos Strike's off-hand refund;
# Chaos Strike/Annihilation (40), Blade Dance/Death Sweep (35), Eye Beam and
# Abyssal Gaze (30) spend it. Eye Beam (Demonic) opens Metamorphosis, inside
# which Annihilation and Death Sweep replace the base abilities; Metamorphosis
# also resets Eye Beam and Blade Dance (Chaotic Transformation) and Immolation
# Aura (Violent Transformation). Fel-Scarred: Eye Beam/Abyssal Gaze and
# Metamorphosis hand out Demonsurge empowerments, and every empowered cast
# fires a Demonsurge hit; Burning Blades rolls 35% of every direct hit into a
# 6s DoT.

name = "Havoc Demon Hunter (Fel-Scarred, core kit)"

# Immolation Aura is up before the pull [simc APL: actions.precombat]
precombat = ["isolated_prey_marker", "immolation_aura"]

[player]
attack_power = 2784          # [obs] buffed snapshot (agility 2652 x Battle Shout)
weapon_attack_power = 700    # [obs] +200 agility gives +6.4%: about a sixth of ability damage is the flat weapon part
crit = 0.3696                # [obs] buffed snapshot
haste = 0.1686               # [obs] buffed snapshot; Metamorphosis and Furious Gaze add on top
versatility = 0.0898         # [obs] buffed snapshot
mastery = 0.877              # [obs] Mastery: Demonic Presence [db2 185164], all chaos-school abilities
crit_multiplier = 2.4        # [obs] crit/non-crit of Chaos Strike; Know Your Enemy + Critical Chaos [db2 388118, 320413]
weapon = { min = 7500, max = 8000, speed = 2.6 }   # [db2] 2.6s warglaives; damage fitted to the logged swings
off_hand = { min = 0, max = 0, speed = 2.6 }

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1
ready_tolerance = 1e-5

[resources.fury]
max = 170                    # [obs] "/170.00" in the log
start = 0

[auto_attack]
replace_with = "auto_attack_mh"
off_hand_replace_with = "auto_attack_oh"

# Isolated Prey is a passive; the marker just switches it on at the pull
[[abilities]]
name = "isolated_prey_marker"
gcd = 0
triggered_only = true
on_cast = [{ type = "buff", buff = "isolated_prey" }]

# ---------------------------------------------------------------- auto attacks

[[abilities]]
name = "auto_attack_mh"
damage = { ap_coeff = 0.1857, weapon_mult = 1.0, school = "physical", feed = [{ dot = "burning_blades", pct = 35 }] }   # [simc] 2.6s/14 of AP on a swing, plus burning_blades_trigger_t

[[abilities]]
name = "auto_attack_oh"
damage = { ap_coeff = 0.1857, weapon_mult = 1.0, school = "physical", mult = 0.5, feed = [{ dot = "burning_blades", pct = 35 }] }   # [obs] off-hand hits at 49% of the main hand's

# Demon Blades: every auto-attack hit deals shadow damage and builds fury [simc 203555]
[[abilities]]
name = "demon_blades"
triggered_only = true
damage = { ap_coeff = 0.464, school = "shadow" }   # [db2 203796]
gain = { fury = 15 }                               # [obs] 15 fury a hit (13 base + delta)

[[procs]]
ability = "demon_blades"
on_hit = true
chance = 1.0
sources = ["auto_attack_mh", "auto_attack_oh"]

# ---------------------------------------------------------------- spenders

# Chaos Strike: main hand now, off hand 300ms later [simc 162794]
[[abilities]]
