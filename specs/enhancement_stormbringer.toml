gcd = 0
triggered_only = true
on_cast = [  { type = "buff", buff = "stormsurge" },
  { type = "buff", buff = "stormblast" },
  { type = "reset_cooldown", ability = "stormstrike" },
  { type = "reset_cooldown", ability = "stormstrike" },
]

[[abilities]]
