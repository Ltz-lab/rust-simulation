# ---------------------------------------------------------------- rotation
# Default Stormbringer single-target APL (actions.single_sb), single target.

[[rotation]]
action = "flame_shock"
if = "!dot.flame_shock.up&time<5"

[[rotation]]
action = "flame_shock"
if = "!dot.flame_shock.up"

[[rotation]]
action = "stormstrike"
if = "time<1"

[[rotation]]
action = "crash_lightning"

[[rotation]]
action = "voltaic_blaze"
if = "buff.doom_winds.up&buff.maelstrom_weapon.stack>=7&buff.maelstrom_weapon.stack<10"

[[rotation]]
action = "ascendance"
if = "!buff.doom_winds.up"

[[rotation]]
action = "tempest"
if = "buff.maelstrom_weapon.stack>=10"

[[rotation]]
action = "lightning_bolt"
if = "!buff.tempest.up&buff.maelstrom_weapon.stack>=10"

[[rotation]]
action = "tempest"
if = "buff.maelstrom_weapon.stack>=8&(cooldown.voltaic_blaze.remains<=gcd|cooldown.crash_lightning.remains<=gcd)"

[[rotation]]
action = "lightning_bolt"
if = "!buff.tempest.up&buff.maelstrom_weapon.stack>=8&(cooldown.voltaic_blaze.remains<=gcd|cooldown.crash_lightning.remains<=gcd)"

[[rotation]]
action = "stormstrike"
if = "cooldown.stormstrike.charges_fractional>=1.8"

[[rotation]]
action = "stormstrike"

[[rotation]]
action = "voltaic_blaze"

[[rotation]]
action = "lava_lash"

[[rotation]]
action = "tempest"
if = "buff.maelstrom_weapon.stack>=8"

[[rotation]]
action = "lightning_bolt"
if = "!buff.tempest.up&buff.maelstrom_weapon.stack>=8"

[[rotation]]
action = "crash_lightning"

[[rotation]]
action = "lightning_bolt"
if = "!buff.tempest.up&buff.maelstrom_weapon.stack>=5"

[[rotation]]
action = "flame_shock"
