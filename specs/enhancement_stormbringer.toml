ap_coeff = 1.212            # [db2 469270] 1.2 x 1.01 spell-power-to-AP
school = "nature"
crit_damage_per_crit = 0.4   # [db2 1251026] Overcharge
mastery = true
duration = 10
tick_time = 1
hasted = false
whole_ticks = true

[[abilities]]
name = "static_accumulation"   # [db2 384411/384437] 1 MW every 3s during Doom Winds
gcd = 0
triggered_only = true

[abilities.dot]
name = "static_accumulation_tick"
ap_coeff = 0
duration = 10
tick_time = 3
whole_ticks = true
on_tick = [{ type = "buff", buff = "maelstrom_weapon" }]

[[abilities]]
name = "doom_winds_proc"    # 3 successes per 600 stacks spent [simc asc_dw deck]
gcd = 0
triggered_only = true
on_cast = [{ type = "trigger", ability = "doom_winds_apply" }]

# ---------------------------------------------------------------- auto attacks

[[abilities]]
name = "auto_attack_mh"
source = "main_hand"
