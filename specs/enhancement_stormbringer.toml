on_cast = [  { type = "trigger", ability = "flametongue_attack" },
  { type = "if", if = "buff.windfury_imbue.up", then = [ { type = "trigger", ability = "windfury_proc", chance_expr = "0.394*(1+0.5*buff.doom_winds.up)" }, ] },
