# Enhancement Shaman — Stormbringer, Midnight Season 2, core kit.
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Shaman_Enhancement.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_shaman.cpp) or its default APL
#
# Maelstrom Weapon is a buff, not a resource: every melee hit has a 20% chance
# to add a stack (187880 proc chance), and Lightning Bolt / Chain Lightning /
# Tempest spend every stack they have: +20% damage and -20% cast time each
# (344179), so from 5 stacks they are instant. Enhancement's spell power is
# 101% of attack power (137041 effect #6, "Override Spell Power per Attack
# Power"), so every spell coefficient below is sp_coeff x 1.01 expressed as
# an attack-power coefficient, scaled by the same AP the engine computes.
#
# Stormstrike has two charges (Stormblast) on a hasted 7.5s recharge; every
# hit can proc Stormsurge (5% + 30% of mastery) which resets it and makes the
# next one deal an extra 25% hit. Ascendance replaces Stormstrike with
# Windstrike and starts Doom Winds; while Doom Winds is up every Stormstrike,
# Windstrike and Crash Lightning re-casts the last Lightning Bolt (Thorim's
# Invocation). Crash Lightning leaves a 12s weapon enhancement: while it is
# up Stormstrike and Lava Lash each add a Crash Lightning hit that grows with
# its stack count.

name = "Enhancement Shaman (Stormbringer, core kit)"
precombat = ["flurry_always", "windfury_weapon", "flametongue_weapon", "lightning_shield"]

[player]
# [obs] SimC's buffed snapshot; agility -> attack power (1911 agility).
attack_power = 2652
# [obs] the main-hand weapon's share of ability power, 6 x its DPS (350)
weapon_attack_power = 830
crit = 0.3198            # [obs]
haste = 0.1927           # [obs]
versatility = 0.0528     # [obs]
mastery = 0.72           # [obs] Mastery: Enhanced Elements: Fire/Frost/Nature damage
crit_multiplier = 2.0    # [obs] fitted per source by the calibration
# [db2 137041 #1/#2] Enhancement Shaman: +25% direct and periodic spell damage
global_mult = 1.25
weapon = { min = 0, max = 0, speed = 2.6 }   # [obs] swings every 2.6s hasted
off_hand = { min = 0, max = 0, speed = 2.6 }

[fight]
duration = 300
variance = 0.2

[auto_attack]
replace_with = "auto_attack_mh"
off_hand_replace_with = "auto_attack_offhand"

# Maelstrom Weapon: 20% chance per hit (187880), one stack each [db2/simc]
[[procs]]
ability = "mw_gain"
on_hit = true
chance = 0.20

# ---------------------------------------------------------------- buffs

[[buffs]]
name = "flurry_always"     # [obs] 98% uptime: every crit refreshes it
duration = 1e9
max_stacks = 3
attack_speed_pct = 15      # [db2 382889]

[[buffs]]
name = "windfury_imbue"    # marker: main hand imbued (Windfury Weapon)
duration = 1e9

[[buffs]]
name = "flametongue_imbue" # marker: off hand imbued (Flametongue Weapon)
duration = 1e9

[[buffs]]
name = "lightning_shield"
duration = 1e9

[[buffs]]
name = "enhancement_autos" # 137041 #5: auto attacks deal +421% damage
duration = 1e9
ability_pct = { main_hand = 421, offhand = 421, windlash = 421, windlash_offhand = 421 }

[[buffs]]
name = "maelstrom_weapon"  # [db2 344179]
duration = 30
max_stacks = 10            # [db2 384143: +5 over the base 5]
ability_pct = { lightning_bolt = 20, lightning_bolt_ti = 20, tempest = 20, tempest_ti = 20, chain_lightning_ti = 20 }
cast_time_pct = { lightning_bolt = 20, lightning_bolt_ti = 20, tempest = 20, tempest_ti = 20, chain_lightning_ti = 20 }

[[buffs]]
name = "stormblast"        # [db2 470466] next Stormstrike's extra hit; also its +25%
duration = 12
max_stacks = 2

[[buffs]]
name = "stormsurge"        # [db2 201846] marker for the reset
duration = 12

[[buffs]]
name = "doom_winds"        # [db2 466772] 8s, +2s Thorim's Invocation
duration = 10

[[buffs]]
name = "ascendance"        # [db2 114051]
duration = 15
cooldown_rate_pct = { stormstrike = 150 }   # [db2 114051 #10] Windstrike recharges 60% faster

[[buffs]]
name = "crash_lightning"   # [db2 1252415] weapon enhancement, one stack per cast
duration = 12
max_stacks = 20
overlap = true             # Storm Unleashed: each cast's stack expires on its own [simc]

[[buffs]]
name = "tempest"           # [db2 454015] next Lightning Bolt is Tempest
duration = 30
max_stacks = 2

[[buffs]]
name = "arc_discharge"     # [db2 455097] next Chain Lightning casts twice, +40%
duration = 15
max_stacks = 2

[[buffs]]
name = "storm_unleashed"   # [db2 1262830] Crash Lightning ignores its cooldown and leaves a storm
duration = 20
max_stacks = 2

[[buffs]]
name = "lightning_strikes" # [db2 384451] next Stormstrike/Lava Lash +25% and 1 MW
duration = 30
max_stacks = 3
ability_pct = { stormstrike_mh = 25, stormstrike_offhand = 25, windstrike_mh = 25, windstrike_offhand = 25, lava_lash = 25 }

[[buffs]]
name = "mw_spent"           # helper: the stacks a Lightning spell is about to spend
duration = 5
max_stacks = 20

[[buffs]]
name = "unlimited_power"   # [db2 454394] 1% haste per stack, 15 stacks
duration = 15
max_stacks = 15
haste_pct = 1

[[buffs]]
name = "storm_swell"       # [db2 455089] +5 mastery
duration = 6
mastery_pct = 5

