# ---------------------------------------------------------------- strikes

[[abilities]]
name = "stormstrike"
gcd = 1.5
cooldown = 7.5
cooldown_hasted = true
charges = 2                 # [db2 319930]
on_cast = [  { type = "if", if = "buff.ascendance.up", then = [ { type = "trigger", ability = "windstrike_mh" }, { type = "trigger", ability = "windstrike_offhand" }, ], else = [ { type = "trigger", ability = "stormstrike_mh" }, { type = "trigger", ability = "stormstrike_offhand" }, ] },
  { type = "if", if = "buff.crash_lightning.up", then = [{ type = "trigger", ability = "crash_lightning_proc" }] },
  { type = "if", if = "buff.stormblast.up", then = [ { type = "consume", buff = "stormblast" }, { type = "if", if = "buff.ascendance.up", then = [ { type = "trigger", ability = "stormblast_ws_mh" }, { type = "trigger", ability = "stormblast_ws_offhand" }, ], else = [ { type = "trigger", ability = "stormblast_mh" }, { type = "trigger", ability = "stormblast_offhand" }, ] }, ] },
  { type = "if", if = "buff.lightning_strikes.up", then = [ { type = "buff", buff = "maelstrom_weapon" }, { type = "consume", buff = "lightning_strikes" }, ] },
  { type = "buff", buff = "maelstrom_weapon" },   # Elemental Assault [db2 210853]
  { type = "trigger", ability = "stormflurry", chance = 0.2 },
  { type = "trigger", ability = "thorims_invocation" },
  { type = "if", if = "buff.ascendance.up", then = [{ type = "trigger", ability = "ride_the_lightning_ws" }], else = [{ type = "trigger", ability = "ride_the_lightning" }] },
  { type = "trigger", ability = "awakening_storms_roll" },
]

