duration = 30
ability_pct = { eviscerate = 35, eviscerate_bonus = 35, eviscerate_shadow_clone = 35 }
ability_crit_pct = { eviscerate = 100, eviscerate_bonus = 100, eviscerate_shadow_clone = 100 }

[[buffs]]
name = "unshakeable_drive"  # each Mark stack spent; spent by builders [db2 1248775: 12s, 3 stacks]
duration = 12
