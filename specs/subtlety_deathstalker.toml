duration = 1e9

[[buffs]]
name = "vanish"             # [db2 11327: 3s]; broken by the next attack
duration = 3

[[buffs]]
name = "shadow_dance"       # [db2 185313: 6s] x(1 + 1.5 x rating haste) Deepening Shadows [db2 1271702 #2, simc]
# 6 x (1 + 1.5 x (H/1.03 - 1)) = 5.738 x (1 + 1.5228 x (H - 1)) in total
# haste H [simc]: 8.03s, one GCD short of 9 at SimC's action spacing; 8.2s and
# up with a haste proc (8.35 average [obs])
duration = 5.738
haste_duration = 1.5228
attack_speed_pct = 25       # Warning Signs [db2 426555, simc]
on_expire = [
  { type = "consume", buff = "dance_stance" },
  { type = "buff", buff = "lingering_shadow", stacks = 50 },   # [simc] full stacks as Dance ends
  { type = "trigger", ability = "lingering_shadow_decay" },
  { type = "consume", buff = "shadow_focus" },
]

[[buffs]]
name = "dance_stance"       # Shadow Dance's stealth for Shadowstrike, after a short stance delay [simc shadow_dance_t]
duration = 1e9

[[buffs]]
name = "slice_and_dice"     # +50% attack speed [db2 315496]; up from the first finisher to the end [obs]
duration = 1e9
attack_speed_pct = 50
attack_speed_per_haste = 1  # Swift Slasher: plus your haste [db2 381988, simc composite_melee_auto_attack_speed]

[[buffs]]
name = "premeditation"      # next combo-point builder in stealth: +7 combo points [db2 343160]
duration = 1e9

[[buffs]]
name = "silent_storm"       # next Shuriken Storm crits [db2 385727]
duration = 1e9
ability_crit_pct = { shuriken_storm = 100 }

[[buffs]]
name = "shadow_focus"       # in stealth and Shadow Dance [db2 112942]
duration = 1e9

[[buffs]]
name = "find_weakness"      # Shadowstrike: 10s [db2 1264521]; ignores 30% armor (in the residual, 98% uptime)
duration = 10

[[buffs]]
name = "shadow_techniques"  # auto-attack stacks, spent for combo points [db2 196911]
duration = 1e9
max_stacks = 14             # [db2 10]; 14 in practice [obs: capped at 14]

[[buffs]]
name = "st_counter"         # Shadow Techniques' hit counter [simc trigger_shadow_techniques]
duration = 1e9
max_stacks = 3

[[buffs]]
name = "ancient_arts"       # 5+ Shadow Techniques stacks: the next finisher converts them [db2 1269163: 12s, simc]
duration = 12

[[buffs]]
name = "supercharge"        # Shadow Dance: 2 supercharged combo points, +3 each [db2 470347, 470398]
duration = 1e9
max_stacks = 2

[[buffs]]
name = "cold_blood"         # crit of a combo-point builder: next finisher +10% crit [db2 382245, 1264297]
duration = 1e9
ability_crit_pct = { eviscerate = 10, eviscerate_bonus = 10, secret_technique_player = 10, secret_technique_clones = 10 }

[[buffs]]
name = "shadow_blades"      # [db2 121471: 16s] combo points from builders doubled; 20% of damage copied [db2 #0, simc]
duration = 16
on_expire = [{ type = "buff", buff = "lingering_darkness" }]   # [simc]
# a copy of each rogue hit; physical hits x1.37 (Deeper Daggers, Veiltouched,
# Dark Brew, Ancient Arts [simc residual_shadow_multiplier]), after armor [obs 0.27 / 0.20]
echo = { ability = "shadow_blades_attack", pct = 20, school_pct = { physical = 27.4 }, pre_armor = false, sources = [
  "eviscerate", "eviscerate_bonus", "eviscerate_shadow_clone", "secret_technique_player", "secret_technique_clones",
  "secret_technique_shadow_clone", "deathstalkers_mark", "hunt_them_down", "shadowstrike", "shadowstrike_shadow_clone",
  "backstab", "backstab_shadow_clone", "goremaws_bite", "shuriken_storm", "instant_poison", "auto_attack_mh", "auto_attack_oh",
] }

[[buffs]]
name = "lingering_darkness" # Shadow Blades ends: 30s [db2 457273]
duration = 30

[[buffs]]
name = "goremaws_bite_window"   # Goremaw's Bite: 20% of finisher damage copied for 13.95s [db2 1309274, simc]
duration = 13.95
# finisher hits (combo-point state > 0); physical x1.37, both with the target
# multipliers reversed (x0.925 physical, x0.943 shadow) [obs, simc trigger_residual_action]
echo = { ability = "goremaws_bite_finisher", pct = 18.86, school_pct = { physical = 25.35 }, pre_armor = false, sources = [
  "eviscerate", "eviscerate_bonus", "eviscerate_shadow_clone", "secret_technique_player", "secret_technique_clones",
  "secret_technique_shadow_clone",
] }

[[buffs]]
name = "lingering_shadow"   # 50 stacks as Shadow Dance ends, decaying over ~17s [db2 385960, obs]
duration = 18
max_stacks = 50
# Backstab copies stacks% of its damage, x1.37 for the physical Backstab [simc, obs 0.60 at 44 stacks]
echo = { ability = "lingering_shadow", pct = 1, school_pct = { physical = 1.37 }, pre_armor = false, sources = ["backstab", "backstab_shadow_clone"] }

[[buffs]]
name = "deathstalkers_mark" # target debuff, 3 stacks [db2 457129: 60s; 457052 #0]
duration = 60
max_stacks = 3

[[buffs]]
