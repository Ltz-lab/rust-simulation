# ---------------------------------------------------------------- rotation
# Paraphrase of SimC's default Subtlety APL, single target, Deathstalker.
# Shadowstrike needs stealth: Stealth, Vanish, or Shadow Dance's stance.
# stealth = buff.shadow_dance.up|buff.stealth.up|buff.vanish.up
# dance_condition = !stealth&energy>=30&buff.slice_and_dice.up&(combo_points<=2|combo_points>=6)

# Potion with Shadow Blades [simc APL: potion,if=buff.shadow_blades.up|fight_remains<30]
[[rotation]]
action = "potion"
if = "buff.shadow_blades.up|fight_remains<30"

[[rotation]]
action = "goremaws_bite"
if = "buff.shadow_dance.up&!buff.ancient_arts.up|fight_remains<=14"

[[rotation]]
action = "shadow_blades"
if = "!(buff.shadow_dance.up|buff.stealth.up|buff.vanish.up)&energy>=30&buff.slice_and_dice.up&(combo_points<=2|combo_points>=6)&cooldown.shadow_dance.charges_fractional>=1.8|fight_remains<=20"

[[rotation]]
action = "shadow_dance"
if = "!(buff.shadow_dance.up|buff.stealth.up|buff.vanish.up)&(energy>=30&buff.slice_and_dice.up&(combo_points<=2|combo_points>=6)&(buff.darkest_night.up|cooldown.secret_technique.ready&buff.deathstalkers_mark.stack<=1)&cooldown.shadow_blades.remains>=35-cooldown.secret_technique.duration|fight_remains<=10)"

[[rotation]]
action = "vanish"
if = "!(buff.shadow_dance.up|buff.stealth.up|buff.vanish.up)&energy>=50&combo_points<=2"

# build at max for Apex
[[rotation]]
action = "shadowstrike"
if = "(buff.dance_stance.up|buff.stealth.up|buff.vanish.up)&!buff.ancient_arts.up&buff.shadow_techniques.stack>=5&(buff.darkest_night.up|cooldown.secret_technique.ready)"

# finishers at 6+ combo points (7 with Darkest Night)
[[rotation]]
action = "eviscerate"
if = "(combo_points>=7|combo_points>=6&!buff.darkest_night.up)&(buff.darkest_night.up|!buff.slice_and_dice.up)"

[[rotation]]
action = "secret_technique"
if = "(combo_points>=7|combo_points>=6&!buff.darkest_night.up)&buff.shadow_dance.up"

[[rotation]]
action = "eviscerate"
if = "(combo_points>=7|combo_points>=6&!buff.darkest_night.up)&(buff.shadow_dance.up|buff.shadow_blades.up|buff.deathstalkers_mark.stack>1|buff.deathstalkers_mark.stack=1&buff.shadow_techniques.stack>=5)"

# builders, in stealth or above 60 energy
[[rotation]]
action = "shuriken_storm"
if = "buff.shadow_dance.up&buff.premeditation.up&(buff.deathstalkers_mark.up|buff.darkest_night.up)"

[[rotation]]
action = "shadowstrike"
if = "buff.dance_stance.up|buff.stealth.up|buff.vanish.up"

[[rotation]]
action = "backstab"
if = "!(buff.shadow_dance.up|buff.stealth.up|buff.vanish.up)&energy>60"
