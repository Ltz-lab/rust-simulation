[[buffs]]
name = "venomcursed_haste"  # +377 haste rating for 12s [obs]: x1.0696 haste
duration = 12
haste_pct = 6.96

[[buffs]]
name = "hasty_ritual"       # +101 haste rating for 16s [obs]: x1.0186 haste
duration = 16
