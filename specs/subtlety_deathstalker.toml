# Subtlety Rogue — Deathstalker, Midnight Season 2, core kit
# (no trinkets / tier set / consumables / Bloodlust; matches the core-kit
# profile tools/make_reference.sh builds from MID2_Rogue_Subtlety.simc).
#
# Where numbers come from:
#   [db2]  raw game tables (wago.tools exports) via tools/spelldb.py
#   [obs]  observed behaviour in combat logs (here: SimC's log as a stand-in)
#   [simc] read from SimC's source (sc_rogue.cpp) or its default APL
# Damage coefficients are attack-power coefficients straight from SpellEffect.
# Residual damage multipliers (talents, auras, armor) live in a separate
# calibration file produced by tools/calibrate.py — not hand-tuned here.
#
# The spec runs on energy (10/s, hasted) and combo points (7). Auto attacks
# from both hands build Shadow Techniques stacks; builders turn the stacks into
# combo points, and with Ancient Arts a finisher does it again right after it
# lands, so finishers chain. Finishers spend Deathstalker's Mark stacks; the
# last one grants Darkest Night, whose 7-point finisher re-applies the Mark.
# Shadow Dance opens stealth windows (Shadowstrike, Secret Technique,
# Supercharged combo points), Shadow Blades and Goremaw's Bite copy damage.

name = "Subtlety Rogue (Deathstalker, core kit)"

# Stealth out of combat: the opener is a Shadowstrike [simc APL]
precombat = ["stealth_open"]

[player]
# Final stats = buffed snapshot + the time-averaged gear stat procs
# (rituals, Venomcursed, Rune of Masterful Cunning, Arcanoweave, Nature's
# Tenacity) [obs: 14 logged fights, 200 crit / 144 haste / 88 mastery / 104
# vers rating and 37 agility on average, converted with the probes' rating ->
# stat deltas]. Hunt Them Down and Instant Poison crit at 24.4%, as here.
# Haste is the exception: Venomcursed's 377 and Hasty Ritual's 101 haste
# rating are procs below, because Shadow Dance's length depends on the haste
# it starts with. Together they average 165 rating against 144 observed (the
# other Venomcursed procs take some haste away), so the rest is -21 rating.
attack_power = 2682      # 2640 + 42
weapon_attack_power = 702   # [obs] the weapon's share of ability damage: +200 agility (+227 AP) gives +6.56%, not +8.5%
spell_power = 433        # [obs] buffed; only the gear procs below use it, so they don't grow with agility
crit = 0.2433            # 0.1998 + 0.0435
haste = 0.2576           # buffed 0.2625, less 21 rating (x1.03, 44.25 rating a point [obs probe])
versatility = 0.1292     # 0.1100 + 0.0192
mastery = 0.9495         # 0.9060 + 0.0435: Executioner, finishers' damage [db2 76808]
crit_multiplier = 2.3    # [obs] crit/non-crit of Instant Poison and Deathstalker's Mark
# Daggers swing every 1.8s [db2; obs 0.713s off-hand opener = half of 1.8/1.2625]
weapon = { min = 0, max = 0, speed = 1.8 }
off_hand = { min = 0, max = 0, speed = 1.8 }

[gear]
primary = "agility"
base_primary = 618            # [obs] level-90 dwarf rogue base agility (SimC: 2326 unbuffed = 1708 from gear + 618)
primary_mult = 1.08126        # [obs] buffed 2515 / unbuffed 2326 (+200 agility probe: +216 buffed)
attack_power_mult = 1.05      # [obs] Battle Shout: 2515 agility -> 2640 attack power
crit_bonus = 0.12             # [obs] 19.98% at 367 rating = 7.98% from rating + 12%
haste_mult = 1.03             # [obs] 26.25% at 993 rating (22.44%): x1.03, multiplicative with rating haste
mastery_points = 10           # [obs] 8 base + 2 Skyfury, in mastery points (90.6% at 26.98 points from rating)
mastery_coeff = 2.45          # [db2 76808] Executioner, % per mastery point (+500 mastery probe: +24.7% over 10.09 points)
versatility_bonus = 0.03      # [obs] Mark of the Wild
weapon_ap_per_dps = 5.9675    # [obs] weapon_attack_power 702 at 117.64 main-hand DPS

# The time-averaged gear stat procs folded into [player] above, so --gear
# lands on the same final stats. They belong to this gear set.
[gear.procs]
attack_power = 42
crit = 0.0435
haste = -0.0049
mastery = 0.0435
versatility = 0.0192

# Raid-night kit, applied only with gear lines (`--set gear.kit.enabled=0`
# turns it off): SimC's default level-90 Rogue consumables plus Bloodlust,
# measured on the sample profile. [simc]
[gear.kit]
enabled = 1
precombat = ["full_kit"]   # Bloodlust at the pull; unlocks the potion
stats = { primary = 75.1, crit_rating = 197, haste_rating = 32 }
#   primary 75.1   food 50 + Void-Touched augment rune 25.1
#   crit 165       Flask of the Shattered Sun (rank 2) [simc apl/rogue.cpp]
#   crit/haste 32  Thalassian Phoenix Oil (rank 2) on both daggers
primary_buffs = { lights_potential = 695 }   # [db2 1236616] rank-2 Light's Potential

[fight]
duration = 300
variance = 0.2
idle_poll = 0.1          # [simc] rogue_t::available(): re-check at least every 100ms while pooling

[resources.energy]
max = 100                # [db2]
start = 100              # [obs] full out of combat
regen = 10               # [simc] base_energy_regen_per_second
regen_hasted = true      # [obs] 9 energy in 0.713s at 1.2625 haste

[resources.combo_points]
max = 7                  # [db2] 5 + Deeper Stratagem + Secret Stratagem
start = 0

[auto_attack]
replace_with = "mh_swing"
off_hand_replace_with = "oh_swing"
wakes = false   # [simc] READY_TRIGGER: a waiting rogue re-checks on resource thresholds and every 100ms, not on swings

# Random gear procs, as Poisson rates [obs]
[[procs]]
ability = "rune_of_unleashed_fire"
per_minute = 8.3

[[procs]]
ability = "breath_of_corruption"   # Zatha'tek main hand, hasted [obs: 18 a fight, +8% in the haste probe]
per_minute = 2.78
hasted = true

[[procs]]
ability = "venomcursed_haste_proc" # 38.7% uptime, 12s [obs]
per_minute = 2.45

[[procs]]
ability = "hasty_ritual_proc"      # 18.5% uptime, 16s [obs]
per_minute = 0.767

