# Shadow Techniques: a builder takes as many stacks as it has room for, as
# combo points; each one taken is a 20% chance of a Shadow Clone of the
# builder (Ancient Arts: 15% [db2 1268932 #0] + 5% [db2 1268939 #0]; obs 0.20 per stack).
# 5+ stacks left over arm Ancient Arts for the next finisher.
[[abilities]]
name = "st_convert_backstab"
triggered_only = true
gcd = 0
on_cast = [
  { type = "if", if = "buff.shadow_techniques.up&combo_points<7", then = [
    { type = "if", if = "buff.shadow_techniques.stack>=7-combo_points", then = [
      { type = "trigger", ability = "backstab_shadow_clone", chance_expr = "0.2*(7-combo_points)" },
      { type = "buff", buff = "shadow_techniques", set = "buff.shadow_techniques.stack-7+combo_points" },
      { type = "gain", resource = "combo_points", amount_expr = "7-combo_points" },
    ], else = [
      { type = "trigger", ability = "backstab_shadow_clone", chance_expr = "0.2*buff.shadow_techniques.stack" },
      { type = "gain", resource = "combo_points", amount_expr = "buff.shadow_techniques.stack" },
      { type = "consume", buff = "shadow_techniques", all = true },
    ] },
  ] },
  { type = "if", if = "buff.shadow_techniques.stack>=5", then = [{ type = "buff", buff = "ancient_arts" }] },
]

[[abilities]]
name = "st_convert_shadowstrike"
triggered_only = true
gcd = 0
on_cast = [
  { type = "if", if = "buff.shadow_techniques.up&combo_points<7", then = [
    { type = "if", if = "buff.shadow_techniques.stack>=7-combo_points", then = [
      { type = "trigger", ability = "shadowstrike_shadow_clone", chance_expr = "0.2*(7-combo_points)" },
      { type = "buff", buff = "shadow_techniques", set = "buff.shadow_techniques.stack-7+combo_points" },
      { type = "gain", resource = "combo_points", amount_expr = "7-combo_points" },
    ], else = [
      { type = "trigger", ability = "shadowstrike_shadow_clone", chance_expr = "0.2*buff.shadow_techniques.stack" },
      { type = "gain", resource = "combo_points", amount_expr = "buff.shadow_techniques.stack" },
      { type = "consume", buff = "shadow_techniques", all = true },
    ] },
  ] },
  { type = "if", if = "buff.shadow_techniques.stack>=5", then = [{ type = "buff", buff = "ancient_arts" }] },
]

[[abilities]]
name = "st_convert_plain"   # Shuriken Storm, Goremaw's Bite: no clone of their own here
triggered_only = true
gcd = 0
on_cast = [
  { type = "if", if = "buff.shadow_techniques.up&combo_points<7", then = [
    { type = "if", if = "buff.shadow_techniques.stack>=7-combo_points", then = [
      { type = "buff", buff = "shadow_techniques", set = "buff.shadow_techniques.stack-7+combo_points" },
      { type = "gain", resource = "combo_points", amount_expr = "7-combo_points" },
    ], else = [
      { type = "gain", resource = "combo_points", amount_expr = "buff.shadow_techniques.stack" },
      { type = "consume", buff = "shadow_techniques", all = true },
    ] },
  ] },
  { type = "if", if = "buff.shadow_techniques.stack>=5", then = [{ type = "buff", buff = "ancient_arts" }] },
]

# ---------------------------------------------------------------- finishers
# Damage per combo point spent; a Supercharged point adds 3 [db2 470347 #1 +
# Forced Induction, simc current_effective_cp].

[[abilities]]
name = "eviscerate"
spell_id = 196819
cost = { energy = 35, combo_points = 1 }   # [db2]
cost_max = { combo_points = 7 }
gcd = 1.0045             # 1s [db2] + SimC's action spacing [obs: 1.004-1.008s]
gcd_hasted = false
