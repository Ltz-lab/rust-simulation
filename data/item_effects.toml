# Item effect library: what trinkets and non-class set bonuses do, as spec
# fragments. With gear lines, every on-use / on-equip effect of an equipped
# trinket (ItemEffect) and every set bonus reached (ItemSetSpell) is looked up
# here by its spell id; a spec's own `[[gear.effects]]` (class set bonuses)
# win over these. An effect with no entry is reported as unmodelled.
#
# `text` is a spec fragment in the spec format: `abilities`, `buffs`, `procs`,
# `precombat` and `rotation` lists are added to the spec, `patch` entries
# append lists (on_cast, ...) to an existing ability or buff. Numbers come
# from the game data through `${...}` placeholders, scaled to the item's level
# (see `placeholder` in src/gear.rs): `${e1}` is effect 1 of the entry's
# spell, `${1297760.e3}` effect 3 of another, plus `rppm`, `rppm_haste`,
# `duration`, `icd`, `cooldown`, `stacks`, `chance`, `ilvl`, and `:pct` to
# divide by 100. Rotation entries with `use = "buff"` (stat buffs) or
# `use = "other"` take the spec's `[gear] use_items` condition for that kind
# and go after its `use_after` action. Buff `stats` (primary, *_rating, per
# stack) become the character's own percent bonuses.
#
# Most Midnight trinkets keep their numbers in dummy auras and are scripted
# in SimC (engine/player/unique_gear_midnight.cpp); each entry follows that
# script, and names the spells it reads. Add a template, then rerun
# tools/gamedata.py so the spells it names are in the game data.

# Zul'jin's Guillotine Technique (270173): real-PPM physical hit, +2% damage
# per 1% of target health missing. [simc zuljins_guillotine_technique]
[[effect]]
spell = 1291728
text = '''
[[procs]]
ability = "guillotine"
per_minute = ${rppm}
hasted = ${rppm_haste}
on_hit = true

[[abilities]]
name = "guillotine"
spell_id = 1306604
triggered_only = true
no_procs = true
damage = { amount = ${e1}, school = "physical", scale = "1+${e2:pct}*(100-target.health.pct)" }
'''

# Bite of Zul'jan 2pc (the trinket plus Mazeroa, Warlord's Fury or 268209):
# Guillotine becomes Perfected Guillotine (100% of its damage) and applies
# Venomfang. Only where the spec models Venomfang (Ret: the main hand's proc).
[[effect]]
spell = 1291726
text = '''
[[patch]]
ability = "guillotine"
requires = ["venomfang_proc"]
on_cast = [{ type = "trigger", ability = "venomfang_proc" }]
'''

# Voracious Heart of Ula'tek (270175): on use, primary stat for 20s; while
# it's up, hits proc Devour Morsel (physical damage), each adding a stack of
# Devoured Strength (primary stat), which ends with the main buff.
# [simc voracious_heart_of_ulatek; values on 1297760]
[[effect]]
spell = 1297761
text = '''
[[buffs]]
name = "voracious_heart"
duration = ${duration}
stats = { primary = ${1297760.e1} }
on_expire = [{ type = "consume", buff = "devoured_strength", all = true }]

[[buffs]]
name = "devoured_strength"
duration = ${1305376.duration}
max_stacks = ${1305376.stacks}
stats = { primary = ${1297760.e3} }

[[abilities]]
name = "voracious_heart"
spell_id = 1297761
gcd = 0
cooldown = ${cooldown}
on_cast = [{ type = "buff", buff = "voracious_heart" }]

[[procs]]
ability = "devour_morsel"
per_minute = ${rppm}
hasted = ${rppm_haste}
on_hit = true

[[abilities]]
name = "devour_morsel"
spell_id = 1305374
triggered_only = true
no_procs = true
requires_buff = "voracious_heart"
damage = { amount = ${1297760.e2}, school = "physical" }
on_cast = [{ type = "buff", buff = "devoured_strength" }]

[[rotation]]
action = "voracious_heart"
use = "buff"
'''

[[effect]]
spell = 1297760    # Voracious Heart's values, read by 1297761
none = true

