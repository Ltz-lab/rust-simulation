# one per unique gem colour worn anywhere in the gear: Garnet Nalorakk, Amethyst
# Halazzi, Lapis Jan'alai, Peridot Akil'zon. A uniform pick among N options is N
# independent procs at rppm/N, so every entry procs at `rppm:per_option` (the
