# Havoc Demon Hunter (Fel-Scarred) — live "press this next" priority, retail 12.1.5
#
# Same rotation language as specs/*.toml ([[rotation]] action + `if`, src/expr.rs), but every
# name a condition uses is something a combat-log stream can tell you:
#   buff.X / debuff.X   an aura in [[auras]] (SPELL_AURA_APPLIED/REFRESH/DOSE/REMOVED; the
#                       stream's Amount carries the remaining ms) or a [[markers]] entry
#                       (set and cleared by the player's own SPELL_CAST_SUCCESS)
#   cooldown.X          started by SPELL_CAST_SUCCESS of any id in that spell's cooldown group
#   fury                SPELL_ENERGIZE (power type 17) minus each cast's cost
#   active_enemies      distinct units the player damaged in the last `aoe_window` seconds
#   gcd, gcd.remains    from the player's casts and haste (base haste + haste auras)
# See docs/havoc-overlay.md for the event-by-event list. src/overlay.rs evaluates it;
# `azsim overlay overlay/havoc_fel_scarred.toml --demo 40` shows it running.
#
# Sources:
#   [simc]   the rules: SimulationCraft's default Havoc APL, profiles/MID2_Demon_Hunter_Havoc.simc,
#            generated below by tools/simc_overlay.py
#   [spec]   specs/havoc_fel_scarred.toml, this repo's calibrated model of the same build
#   [db2]    retail game data, build 12.1.5.70783 (SpellName) / 70575 (Spell* tables)
#   [obs live 2026-11-05]  Jack's Havoc recording through combatfeed

name = "Havoc Demon Hunter (Fel-Scarred) overlay"
resource = { name = "fury", power_type = 17, max = 170 }   # [db2] power type 17 = Fury; 170 with the build's talents [spec]
gcd = 1.5                    # [db2] hasted, 0.75s floor
aoe_window = 3.0             # seconds a damaged unit counts towards active_enemies
haste = 0.0                  # base haste from gear: set by the overlay at login (--haste); 0 = unhasted cooldowns

# Haste from auras the log shows [db2 162264 #3, 343312 #0]
haste_auras = { metamorphosis = 0.20, furious_gaze = 0.08 }

# ------------------------------------------------------------------ spells
# ids: every id SPELL_CAST_SUCCESS may carry for this action. `group` shares one cooldown between
# forms of the same button (SimC does the same for Blade Dance / Death Sweep). `requires` /
# `excludes` is the Metamorphosis form check. `gain` and `applies` are only used to look ahead
# (the live stream reports both as events).

[[spells]]
name = "chaos_strike"
ids = [162794]               # [db2] Chaos Strike
cost = 40                    # [db2 162794]
excludes = "metamorphosis"

[[spells]]
name = "annihilation"
ids = [201427]               # [db2] Annihilation (Chaos Strike in Metamorphosis, 162264 #5)
cost = 40                    # [db2 201427]
requires = "metamorphosis"

[[spells]]
name = "blade_dance"
ids = [188499]               # [db2] Blade Dance
group = "blade_dance"
cooldown = 15                # [db2 188499] category cooldown
hasted = true                # [spec] havoc aura
cost = 35
excludes = "metamorphosis"
on_cast = [{ if_aura = "eternal_hunt", reset = "blade_dance" }]   # [spec] Eternal Hunt is consumed and resets it

[[spells]]
name = "death_sweep"
ids = [210152]               # [db2] Death Sweep (Blade Dance in Metamorphosis, 162264 #6)
group = "blade_dance"
cooldown = 9                 # [db2 210152]
hasted = true
cost = 35
requires = "metamorphosis"
on_cast = [{ if_aura = "eternal_hunt", reset = "blade_dance" }]

[[spells]]
name = "eye_beam"
ids = [198013]               # [db2] Eye Beam
group = "eye_beam"
cooldown = 30                # [db2 198013]
stack_cooldown = { aura = "cycle_of_hatred", seconds = -2.5 }   # [db2 258887 #0] 2.5s a stack [obs live: 1214887 stacks 1-3]
cost = 30
gcd = 2.0                    # 2s channel [db2 198013 duration], hasted
excludes = "metamorphosis"
applies = { metamorphosis = 6.9, furious_gaze = 8 }   # [spec] Demonic: 5s + the channel; Furious Gaze on completion

[[spells]]
name = "abyssal_gaze"
ids = [452497]               # [db2] Abyssal Gaze (Eye Beam in Metamorphosis, Demonsurge 452489 #3)
group = "eye_beam"
cooldown = 30
stack_cooldown = { aura = "cycle_of_hatred", seconds = -2.5 }
cost = 30
gcd = 2.0
requires = "metamorphosis"
applies = { metamorphosis = 6.9, furious_gaze = 8 }

[[spells]]
name = "immolation_aura"
ids = [258920]               # [db2] Immolation Aura
group = "immolation_aura"
cooldown = 30                # [db2 258920] recharge, 1 charge
talent_cooldown = { a_fire_inside = 24 }   # [db2 427775 #2] -6s recharge on category 1676
talent_charges = { a_fire_inside = 2 }     # [db2 427775 #0] +1 charge
gain = 20                    # [db2 258920 #1]
excludes = "metamorphosis"
applies = { immolation_aura = 10 }

[[spells]]
name = "consuming_fire"
ids = [452487]               # [db2] Consuming Fire (Immolation Aura in Metamorphosis, 452489 #1)
group = "immolation_aura"
cooldown = 30                # [db2 452487]
