# [simc line 60] actions+=/death_sweep
[[rotation]]
action = "death_sweep"

# [simc line 61] actions+=/blade_dance
[[rotation]]
action = "blade_dance"

# [simc line 62] actions+=/immolation_aura,if=active_enemies>1&(talent.a_fire_inside|talent.burning_wound)
[[rotation]]
action = "consuming_fire"
if = "active_enemies>1&(talent.a_fire_inside|talent.burning_wound)"

[[rotation]]
action = "immolation_aura"
if = "active_enemies>1&(talent.a_fire_inside|talent.burning_wound)"

# [simc line 63] actions+=/annihilation
[[rotation]]
action = "annihilation"

# [simc line 64] actions+=/felblade,if=hero_tree.felscarred&fury<=100
[[rotation]]
