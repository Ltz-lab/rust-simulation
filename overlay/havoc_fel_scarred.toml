# ------------------------------------------------------------------ priority
# SimC's default Havoc APL (the top-DPS rotation), line for line, from
# profiles/MID2_Demon_Hunter_Havoc.simc via tools/simc_overlay.py. A rule fires when its spell
# is off cooldown at the end of the GCD, affordable, in the right form, and its `if` holds.
# Re-run the tool after updating the profile.

# >>> simc
# Generated by tools/simc_overlay.py from profiles/MID2_Demon_Hunter_Havoc.simc; edit there, not here.

# [simc line 41] actions+=/immolation_aura,if=talent.violent_transformation&talent.a_fire_inside&cooldown.metamorphosis.remains<gcd.max*3
[[rotation]]
action = "consuming_fire"
if = "talent.violent_transformation&talent.a_fire_inside&cooldown.metamorphosis.remains<gcd*3"

[[rotation]]
action = "immolation_aura"
if = "talent.violent_transformation&talent.a_fire_inside&cooldown.metamorphosis.remains<gcd*3"

# [simc line 42] actions+=/metamorphosis,if=(!talent.chaotic_transformation|!cooldown.blade_dance.up&cooldown.eye_beam.remains>8)&!action.death_sweep.demonsurge_available&!action.annihilation.demonsurge_available
[[rotation]]
action = "metamorphosis"
if = "(!talent.chaotic_transformation|!cooldown.blade_dance.up&cooldown.eye_beam.remains>8)&!buff.demonsurge_death_sweep.up&!buff.demonsurge_annihilation.up"

# [simc line 44] actions+=/the_hunt,if=(!talent.eternal_hunt|cooldown.eye_beam.remains<10&cooldown.metamorphosis.remains>15|!cooldown.eye_beam.up&cooldown.metamorphosis.up|!hero_tree.felscarred)&!buff.reavers_glaive.up
[[rotation]]
action = "the_hunt"
if = "(!talent.eternal_hunt|cooldown.eye_beam.remains<10&cooldown.metamorphosis.remains>15|!cooldown.eye_beam.up&cooldown.metamorphosis.up|!talent.felscarred)&!0"

# [simc line 45] actions+=/vengeful_retreat,use_off_gcd=1,if=gcd.remains<0.3&cooldown.metamorphosis.remains&cooldown.eye_beam.remains<gcd.max*0.3&!buff.initiative.up|cooldown.metamorphosis.up&cooldown.eye_beam.remains&cooldown.blade_dance.remains&!buff.eternal_hunt.up
[[rotation]]
action = "vengeful_retreat"
if = "gcd.remains<0.3&cooldown.metamorphosis.remains&cooldown.eye_beam.remains<gcd*0.3&!buff.initiative.up|cooldown.metamorphosis.up&cooldown.eye_beam.remains&cooldown.blade_dance.remains&!buff.eternal_hunt.up"

# [simc line 48] no button for 'reavers_glaive': actions+=/reavers_glaive,if=buff.rending_strike.down&buff.glaive_flurry.down
# [simc line 49] actions+=/annihilation,if=buff.rending_strike.up&buff.glaive_flurry.down&debuff.reavers_mark.stack<2|buff.rending_strike.up&active_enemies>=2
[[rotation]]
action = "annihilation"
if = "0&!0&0<2|0&active_enemies>=2"

# [simc line 50] actions+=/essence_break,if=action.death_sweep.demonsurge_available|action.annihilation.demonsurge_available
[[rotation]]
action = "essence_break"
if = "buff.demonsurge_death_sweep.up|buff.demonsurge_annihilation.up"

# [simc line 51] actions+=/death_sweep,if=debuff.essence_break.up|action.death_sweep.demonsurge_available
[[rotation]]
action = "death_sweep"
if = "debuff.essence_break.up|buff.demonsurge_death_sweep.up"

# [simc line 52] actions+=/annihilation,if=debuff.essence_break.up|action.annihilation.demonsurge_available
[[rotation]]
action = "annihilation"
if = "debuff.essence_break.up|buff.demonsurge_annihilation.up"

# [simc line 53] actions+=/throw_glaive,if=active_enemies>1&talent.burning_wound&!talent.screaming_brutality&active_dot.burning_wound<(spell_targets>?3)&!variable.tab_target_burning_wound
[[rotation]]
action = "throw_glaive"
if = "active_enemies>1&talent.burning_wound&!talent.screaming_brutality&0<((spell_targets)*((spell_targets)>(3))+(3)*((spell_targets)<=(3)))&!1"

# [simc line 54] actions+=/immolation_aura,if=talent.a_fire_inside&talent.burning_wound&(charges=2|full_recharge_time<gcd.max*2)
[[rotation]]
action = "consuming_fire"
if = "talent.a_fire_inside&talent.burning_wound&(cooldown.immolation_aura.charges=2|cooldown.immolation_aura.full_recharge_time<gcd*2)"

[[rotation]]
action = "immolation_aura"
if = "talent.a_fire_inside&talent.burning_wound&(cooldown.immolation_aura.charges=2|cooldown.immolation_aura.full_recharge_time<gcd*2)"

# [simc line 55] actions+=/abyssal_gaze,if=!action.death_sweep.demonsurge_available&!action.annihilation.demonsurge_available
[[rotation]]
action = "abyssal_gaze"
if = "!buff.demonsurge_death_sweep.up&!buff.demonsurge_annihilation.up"

# [simc line 56] actions+=/eye_beam
[[rotation]]
action = "eye_beam"

# [simc line 57] actions+=/immolation_aura,,if=action.immolation_aura.demonsurge_available&buff.demonsurge.remains<gcd.max
