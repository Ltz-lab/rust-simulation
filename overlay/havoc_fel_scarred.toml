on = "target"
duration = 4

# ------------------------------------------------------------------ markers
# State the log has no aura for, kept from the player's own casts: Fel-Scarred's per-button
# Demonsurge empowerments. Metamorphosis empowers four buttons, an Eye Beam / Abyssal Gaze two
# [spec, from SimC's demonsurge_* buffs]; casting the button spends it; all end with Metamorphosis.

[[markers]]
name = "demonsurge_annihilation"
set_by = ["metamorphosis", "eye_beam", "abyssal_gaze"]
cleared_by = ["annihilation"]
ends_with = "metamorphosis"

[[markers]]
name = "demonsurge_death_sweep"
set_by = ["metamorphosis", "eye_beam", "abyssal_gaze"]
cleared_by = ["death_sweep"]
ends_with = "metamorphosis"

[[markers]]
name = "demonsurge_abyssal_gaze"
set_by = ["metamorphosis"]
cleared_by = ["abyssal_gaze"]
ends_with = "metamorphosis"

[[markers]]
name = "demonsurge_consuming_fire"
set_by = ["metamorphosis"]
cleared_by = ["consuming_fire"]
ends_with = "metamorphosis"

