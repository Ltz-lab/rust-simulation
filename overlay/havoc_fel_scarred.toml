# ------------------------------------------------------------------ auras the log reports
# on = "player": on the player; "target": cast by the player on the unit it is fighting.
# duration: used only when the event carries no remaining time.

[[auras]]
name = "metamorphosis"
ids = [162264]               # [db2] Metamorphosis buff (hardcast and Demonic)
duration = 20

[[auras]]
name = "furious_gaze"
ids = [343312]               # [db2]
duration = 8

[[auras]]
name = "initiative"
ids = [391215]               # [db2]
duration = 5

[[auras]]
name = "immolation_aura"
ids = [258920, 427912]       # [db2] the buff carries the cast's id; 427912 with A Fire Inside [obs live 2026-11-05]
duration = 10                # [obs live 2026-11-05: duration_ms 10000]

[[auras]]
name = "eye_beam_channel"
ids = [198013, 452497]       # the channel aura of Eye Beam / Abyssal Gaze on the player
duration = 2
haste_probe = 2.0            # [db2 198013] 2s channel: 2000 / duration_ms = 1 + gear haste
                             # [obs live 2026-11-05: 1692 ms in and out of Metamorphosis, so
                             # Metamorphosis' haste doesn't shorten it; it does shorten Death Sweep]

[[auras]]
