talent_charges = { a_fire_inside = 2 }
gain = 20
requires = "metamorphosis"
applies = { immolation_aura = 10 }

[[spells]]
name = "essence_break"
ids = [258860]               # [db2] Essence Break
cooldown = 40                # [db2 258860]
applies = { essence_break = 4.25 }   # [spec] the debuff, 320338

[[spells]]
